<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games — webartests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 60px 24px 80px;
    }
    a.back {
      display: inline-block;
      margin-bottom: 40px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }
    a.back:hover { color: #aaa; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 48px;
      max-width: 600px;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 900px;
    }
    a.card {
      display: block;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
      text-decoration: none;
      color: inherit;
    }
    a.card:hover { background: #222; border-color: #444; }
    .card-icon { font-size: 32px; margin-bottom: 16px; }
    a.card h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    a.card p { font-size: 14px; color: #888; line-height: 1.5; }
    .tag {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      background: #222;
      border: 1px solid #333;
      padding: 3px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <a class="back" href="../">← Back</a>
  <h1>Games</h1>
  <p class="subtitle">Small games that run as static pages. Nothing to install.</p>
  <div class="grid">
    <a class="card" href="perfect-fit/">
      <div class="card-icon">🪵</div>
      <h2>Perfect Fit</h2>
      <p>Mark the work the way a shop does. Compass, tick stick, bevel, and coping saw — seat the tool, lock it, and live with the gap.</p>
      <span class="tag">Touch · 9 techniques · No build</span>
    </a>
  </div>
</body>
</html>
