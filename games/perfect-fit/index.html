<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Perfect Fit</title>
<meta name="description" content="Mark the work the way a shop does. Compass, tick stick, bevel, and coping saw — then cut the line.">
<meta name="theme-color" content="#140e0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perfect Fit">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <a id="btn-back" href="../">←</a>
    <div id="title-block">
      <p id="kicker">Workshop</p>
      <h1 id="title">Perfect Fit</h1>
    </div>
    <button id="btn-sound" type="button" aria-pressed="true" aria-label="Mute sound">♫</button>
  </header>
  <p id="geometry" class="hidden"></p>
  <div id="coach" class="hidden">
    <p id="coach-text"></p>
    <div class="coach-actions">
      <button type="button" id="coach-skip">Skip</button>
      <button type="button" id="coach-next" class="primary">Next</button>
    </div>
  </div>
  <ol id="steps" class="hidden"></ol>
  <div id="stage">
    <canvas id="c" aria-label="Workbench"></canvas>
    <div id="menu" class="can-scroll"></div>
  </div>
  <footer id="dock" class="hidden">
    <div id="play-ui">
      <p id="instruction"></p>
      <p id="seat-flag"></p>
      <div class="play-actions">
        <button id="btn-restart" type="button">Restart</button>
        <button id="btn-hint" type="button">Hint <span class="cost">−★</span></button>
        <button id="btn-action" type="button" class="primary">Cut</button>
      </div>
    </div>
    <div id="result-ui" class="hidden">
      <div class="stars" id="stars" aria-label="Star rating">
        <span class="star">★</span><span class="star">★</span><span class="star">★</span>
      </div>
      <h2 id="result-title">Hairline</h2>
      <p id="result-stats"></p>
      <p id="replay-note"></p>
      <p id="new-best"></p>
      <button id="btn-replay" type="button">Replay the steps</button>
      <div class="result-actions">
        <button type="button" id="btn-retry">Retry</button>
        <button type="button" id="btn-next" class="primary">Next</button>
      </div>
    </div>
  </footer>
</div>
<noscript><p style="color:#fff;padding:24px">Perfect Fit needs JavaScript to run.</p></noscript>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
