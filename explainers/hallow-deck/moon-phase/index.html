<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1a0e08">
  <title>Moon Phase Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <style>
    :root {
      --wood-deep: #140a06;
      --wood: #2a160c;
      --wood-mid: #4a2a16;
      --wood-lit: #6a3e22;
      --brass: #d4b056;
      --brass-hi: #f3e0a8;
      --brass-lo: #8a6a28;
      --ink: #f4e7c8;
      --dim: #b9a378;
      --panel: #1c100a;
      --line: rgba(212, 176, 86, 0.35);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      font: 16px/1.45 "Cormorant Garamond", "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(80, 48, 22, 0.45), transparent 55%),
        repeating-linear-gradient(90deg, rgba(255, 210, 140, 0.025) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #2a160c 0%, #120804 100%);
      min-height: 100dvh;
      padding: 16px 16px calc(20px + var(--safe-b));
    }
    .page {
      max-width: 560px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    .eyebrow {
      font-family: Cinzel, serif;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--brass);
      margin: 0 0 4px;
    }
    h1 {
      font-family: Cinzel, serif;
      font-weight: 700;
      font-size: clamp(22px, 6vw, 32px);
      letter-spacing: 0.08em;
      margin: 0;
      color: var(--brass-hi);
      text-shadow: 0 1px 0 #3a2508, 0 0 24px rgba(212, 176, 86, 0.25);
    }
    .case {
      position: relative;
      margin: 8px auto 16px;
      padding: 22px 18px 18px;
      border-radius: 28px 28px 36px 36px;
      background:
        linear-gradient(180deg, rgba(255, 220, 160, 0.08), transparent 28%),
        repeating-linear-gradient(92deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 6px),
        linear-gradient(180deg, #5a341c 0%, #3a1e10 40%, #241208 100%);
      box-shadow:
        0 0 0 2px #1a0c06,
        0 0 0 3px rgba(212, 176, 86, 0.35),
        0 0 0 8px #2a160c,
        0 18px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 230, 180, 0.25),
        inset 0 -20px 30px rgba(0, 0, 0, 0.25);
    }
    .dial {
      position: relative;
      width: min(100%, 72dvh, 520px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background: #050308;
      box-shadow:
        0 0 0 6px #8a6a28,
        0 0 0 8px #f3e0a8,
        0 0 0 11px #b08930,
        0 0 0 14px #5a4214,
        0 0 0 18px #d4b056,
        0 0 0 22px #2a160c,
        inset 0 0 40px #000,
        0 10px 30px rgba(0, 0, 0, 0.6);
    }
    #view {
      position: absolute;
      inset: 13%;
      width: 74%;
      height: 74%;
      display: block;
      border-radius: 50%;
      background: #000;
    }
    .glass {
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,0.16), transparent 32%),
        linear-gradient(160deg, rgba(255,255,255,0.07), transparent 42%, rgba(0,0,0,0.18));
      z-index: 3;
    }
    .numerals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .numeral {
      position: absolute;
      inset: 3.6%;
      pointer-events: none;
    }
    .numeral span {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2.4em;
      margin-left: -1.2em;
      text-align: center;
      font-family: Cinzel, serif;
      font-weight: 700;
      font-size: clamp(11px, 2.8vw, 15px);
      color: var(--brass-hi);
      text-shadow: 0 1px 2px #000;
      line-height: 1;
    }
    .hands {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 2px 2px 40% 40%;
      background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
      box-shadow: 0 0 4px rgba(0,0,0,0.7);
    }
    .hand.hour { width: 5px; height: 22%; margin-left: -2.5px; }
    .hand.minute { width: 3px; height: 30%; margin-left: -1.5px; }
    .hand.second {
      width: 1.5px;
      height: 33%;
      margin-left: -0.75px;
      background: #c45a3a;
      z-index: 1;
    }
    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff4c8, #d4b056 45%, #5a3e10 78%, #2a1a08);
      box-shadow: 0 0 0 2px #3a2a10, 0 1px 3px #000;
      z-index: 4;
    }
    .loading {
      position: absolute;
      inset: 13%;
      display: grid;
      place-items: center;
      z-index: 5;
      border-radius: 50%;
      background: #050308;
      font-family: Cinzel, serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .loading[hidden] { display: none; }
    .readout {
      text-align: center;
      margin: 16px 4px 4px;
    }
    .phase-name {
      font-family: Cinzel, serif;
      font-weight: 600;
      font-size: clamp(20px, 5.4vw, 28px);
      letter-spacing: 0.06em;
      margin: 0 0 4px;
      color: var(--brass-hi);
    }
    .when {
      margin: 0;
      color: var(--dim);
      font-size: 17px;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin: 14px 0 0;
    }
    .metric {
      background: rgba(10, 5, 2, 0.45);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .metric b {
      display: block;
      font-family: Cinzel, serif;
      font-size: clamp(15px, 3.8vw, 18px);
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: pre-line;
      line-height: 1.25;
    }
    .metric span {
      display: block;
      margin-top: 2px;
      font-family: Cinzel, serif;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .controls {
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(12, 6, 3, 0.55);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(243, 224, 168, 0.08);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    label.slide {
      display: block;
      margin: 10px 0 0;
    }
    label.slide span {
      display: flex;
      justify-content: space-between;
      font-family: Cinzel, serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 6px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      margin: 0;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, #3a2a10, #d4b056, #3a2a10);
    }
    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, #3a2a10, #d4b056, #3a2a10);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-radius: 50%;
      border: 2px solid var(--brass-hi);
      background: radial-gradient(circle at 35% 35%, #f8e8b8, #8a6a28);
      box-shadow: 0 1px 4px #000;
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--brass-hi);
      background: radial-gradient(circle at 35% 35%, #f8e8b8, #8a6a28);
    }
    input[type="datetime-local"] {
      flex: 1 1 180px;
      min-width: 0;
      font: 16px/1.2 "Cormorant Garamond", serif;
      color: var(--ink);
      background: #140a06;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color-scheme: dark;
    }
    button {
      font-family: Cinzel, serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1a0e08;
      background: linear-gradient(180deg, var(--brass-hi), var(--brass));
      border: 1px solid var(--brass-lo);
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 44px;
      cursor: pointer;
      box-shadow: 0 1px 0 var(--brass-hi) inset, 0 2px 4px rgba(0,0,0,0.4);
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button.on {
      background: linear-gradient(180deg, #efe0a0, #c45a3a);
      border-color: #8a3020;
    }
    select.speed {
      font: 16px "Cormorant Garamond", serif;
      color: var(--ink);
      background: #140a06;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 8px;
      min-height: 44px;
    }
    footer {
      margin-top: 16px;
      text-align: center;
      color: #7a6848;
      font-size: 13px;
    }
    footer a { color: var(--brass); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 420px) {
      body { padding: 10px 10px calc(14px + var(--safe-b)); }
      .case { padding: 14px 10px 12px; border-radius: 22px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">Hallow-deck · Astronomical dial</p>
      <h1>Moon Phase Clock</h1>
    </header>

    <div class="case">
      <div class="dial" id="dial">
        <canvas id="view"></canvas>
        <div class="numerals" id="numerals"></div>
        <div class="hands">
          <div class="hand hour" id="hourHand"></div>
          <div class="hand minute" id="minuteHand"></div>
          <div class="hand second" id="secondHand"></div>
          <div class="pin"></div>
        </div>
        <div class="glass"></div>
        <div class="loading" id="loading">Winding the clock…</div>
      </div>

      <div class="readout">
        <h2 class="phase-name" id="phaseName">—</h2>
        <p class="when" id="when">—</p>
        <div class="metrics">
          <div class="metric"><b id="illum">—</b><span>Illuminated</span></div>
          <div class="metric"><b id="age">—</b><span>Moon age</span></div>
          <div class="metric"><b id="nextFull">—</b><span>Next full moon</span></div>
          <div class="metric"><b id="nextNew">—</b><span>Next new moon</span></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <input type="datetime-local" id="datetime" step="60" aria-label="Date and time">
        <button type="button" id="nowBtn">Now</button>
        <button type="button" id="playBtn" aria-pressed="false">Play</button>
        <select class="speed" id="speed" aria-label="Play speed">
          <option value="3600000">1 hour / s</option>
          <option value="86400000" selected>1 day / s</option>
          <option value="604800000">1 week / s</option>
        </select>
      </div>
      <label class="slide">
        <span>Date <i id="rangeHint" style="font-style:normal;color:#b9a378;letter-spacing:0.04em;text-transform:none">±2 years</i></span>
        <input type="range" id="coarse" min="0" max="1" step="1" aria-label="Date, plus or minus two years">
      </label>
      <label class="slide">
        <span>Fine <i id="fineHint" style="font-style:normal;color:#b9a378;letter-spacing:0.04em;text-transform:none">±24 hours</i></span>
        <input type="range" id="fine" min="-1440" max="1440" step="1" value="0" aria-label="Fine date, plus or minus 24 hours in minutes">
      </label>
    </div>

    <footer>
      Moon map: NASA / GSFC / <a href="https://svs.gsfc.nasa.gov/4720">SVS CGI Moon Kit</a>.
      Phase from a SunCalc-style illumination model (BSD).
    </footer>
  </div>

  <script type="module">
    import * as THREE from 'three';

    /* Moon illumination after SunCalc (Vladimir Agafonkin), BSD-2-Clause. */
    const RAD = Math.PI / 180;
    const DAY_MS = 86400000;
    const SYNODIC = 29.530588853;
    const OBLIQUITY = 23.4397 * RAD;
    const SUN_DIST = 149598000;

    function toDays(date) {
      return date.valueOf() / DAY_MS - 0.5 + 2440587.5 - 2451545;
    }
    function rightAscension(l, b) {
      return Math.atan2(Math.sin(l) * Math.cos(OBLIQUITY) - Math.tan(b) * Math.sin(OBLIQUITY), Math.cos(l));
    }
    function declination(l, b) {
      return Math.asin(Math.sin(b) * Math.cos(OBLIQUITY) + Math.cos(b) * Math.sin(OBLIQUITY) * Math.sin(l));
    }
    function solarMeanAnomaly(d) { return RAD * (357.5291 + 0.98560028 * d); }
    function eclipticLongitude(M) {
      const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
      return M + C + 102.9372 * RAD + Math.PI;
    }
    function sunCoords(d) {
      const L = eclipticLongitude(solarMeanAnomaly(d));
      return { dec: declination(L, 0), ra: rightAscension(L, 0) };
    }
    function moonCoords(d) {
      const L = RAD * (218.316 + 13.176396 * d);
      const M = RAD * (134.963 + 13.064993 * d);
      const F = RAD * (93.272 + 13.229350 * d);
      const l = L + RAD * 6.289 * Math.sin(M);
      const b = RAD * 5.128 * Math.sin(F);
      const dist = 385001 - 20905 * Math.cos(M);
      return { ra: rightAscension(l, b), dec: declination(l, b), dist };
    }
    function moonIllumination(date) {
      const d = toDays(date);
      const s = sunCoords(d);
      const m = moonCoords(d);
      const phi = Math.acos(
        Math.sin(s.dec) * Math.sin(m.dec) +
        Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra)
      );
      const inc = Math.atan2(SUN_DIST * Math.sin(phi), m.dist - SUN_DIST * Math.cos(phi));
      const angle = Math.atan2(
        Math.cos(s.dec) * Math.sin(s.ra - m.ra),
        Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra)
      );
      return {
        fraction: (1 + Math.cos(inc)) / 2,
        phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI,
        angle
      };
    }

    function phaseName(phase) {
      const t = (phase + 1) % 1;
      if (t < 0.03 || t >= 0.97) return 'New Moon';
      if (t < 0.22) return 'Waxing Crescent';
      if (t < 0.28) return 'First Quarter';
      if (t < 0.47) return 'Waxing Gibbous';
      if (t < 0.53) return 'Full Moon';
      if (t < 0.72) return 'Waning Gibbous';
      if (t < 0.78) return 'Last Quarter';
      return 'Waning Crescent';
    }

    function phaseOffset(p, target) {
      return ((p - target + 0.5) % 1 + 1) % 1 - 0.5;
    }
    function nextCrossing(fromMs, target) {
      const p0 = moonIllumination(new Date(fromMs)).phase;
      let dist = (target - p0 + 1) % 1;
      if (dist < 0.002) dist = 1;
      const approx = fromMs + dist * SYNODIC * DAY_MS;
      let lo = approx - 1.6 * DAY_MS;
      let hi = approx + 1.6 * DAY_MS;
      for (let i = 0; i < 50; i++) {
        const mid = (lo + hi) / 2;
        if (phaseOffset(moonIllumination(new Date(mid)).phase, target) < 0) lo = mid;
        else hi = mid;
      }
      return (lo + hi) / 2;
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function toLocalInput(ms) {
      const d = new Date(ms);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatWhen(ms) {
      return new Date(ms).toLocaleString(undefined, {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      });
    }
    function formatShort(ms) {
      const d = new Date(ms);
      const day = d.toLocaleString(undefined, { month: 'short', day: 'numeric' });
      const tm = d.toLocaleString(undefined, { hour: 'numeric', minute: '2-digit' });
      return day + '\n' + tm;
    }

    const ROMAN = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
    const numerals = document.getElementById('numerals');
    ROMAN.forEach((label, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'numeral';
      wrap.style.transform = `rotate(${i * 30}deg)`;
      const el = document.createElement('span');
      el.textContent = label;
      el.style.transform = `rotate(${-i * 30}deg)`;
      wrap.appendChild(el);
      numerals.appendChild(wrap);
    });

    const now0 = Date.now();
    const MIN_MS = now0 - 2 * 365.25 * DAY_MS;
    const MAX_MS = now0 + 2 * 365.25 * DAY_MS;
    const coarse = document.getElementById('coarse');
    coarse.min = String(Math.floor(MIN_MS / 3600000));
    coarse.max = String(Math.floor(MAX_MS / 3600000));
    coarse.step = '1';

    let t = now0;
    let fineBase = t;
    let playing = false;
    let lastTick = 0;
    let sun, renderer, scene, camera, moonPivot;

    const $ = (id) => document.getElementById(id);
    const hourHand = $('hourHand');
    const minuteHand = $('minuteHand');
    const secondHand = $('secondHand');

    function setTime(ms, from) {
      t = Math.min(MAX_MS, Math.max(MIN_MS, ms));
      const info = moonIllumination(new Date(t));
      if (sun) {
        const a = info.phase * Math.PI * 2;
        /* Pull the sun a few degrees toward the camera so thin crescents
           stay visible; grazing Lambert light would otherwise vanish. */
        sun.position.set(Math.sin(a), 0, -Math.cos(a) + 0.32);
        sun.position.normalize();
      }
      $('phaseName').textContent = phaseName(info.phase);
      $('when').textContent = formatWhen(t);
      $('illum').textContent = `${(info.fraction * 100).toFixed(1)}%`;
      $('age').textContent = `${(info.phase * SYNODIC).toFixed(1)} d`;
      $('nextFull').textContent = formatShort(nextCrossing(t, 0.5));
      $('nextNew').textContent = formatShort(nextCrossing(t, 0));

      const d = new Date(t);
      const sec = d.getSeconds() + d.getMilliseconds() / 1000;
      const min = d.getMinutes() + sec / 60;
      const hr = (d.getHours() % 12) + min / 60;
      hourHand.style.transform = `rotate(${hr * 30}deg)`;
      minuteHand.style.transform = `rotate(${min * 6}deg)`;
      secondHand.style.transform = `rotate(${sec * 6}deg)`;

      if (from !== 'datetime') $('datetime').value = toLocalInput(t);
      if (from !== 'coarse') coarse.value = String(Math.round(t / 3600000));
      if (from !== 'fine') {
        fineBase = t;
        $('fine').value = '0';
        $('fineHint').textContent = '±24 hours';
      } else {
        const minutes = Number($('fine').value);
        const sign = minutes < 0 ? '−' : '+';
        $('fineHint').textContent = `${sign}${Math.floor(Math.abs(minutes) / 60)}h ${pad(Math.abs(minutes) % 60)}m`;
      }
    }

    $('datetime').addEventListener('input', (e) => {
      const v = e.target.value;
      if (!v) return;
      setTime(new Date(v).getTime(), 'datetime');
    });
    coarse.addEventListener('input', () => setTime(Number(coarse.value) * 3600000, 'coarse'));
    $('fine').addEventListener('input', () => setTime(fineBase + Number($('fine').value) * 60000, 'fine'));
    $('nowBtn').addEventListener('click', () => setTime(Date.now()));
    $('playBtn').addEventListener('click', () => {
      playing = !playing;
      lastTick = performance.now();
      $('playBtn').textContent = playing ? 'Pause' : 'Play';
      $('playBtn').classList.toggle('on', playing);
      $('playBtn').setAttribute('aria-pressed', String(playing));
    });

    function tick(now) {
      requestAnimationFrame(tick);
      if (playing) {
        const dt = Math.min(0.1, (now - lastTick) / 1000);
        lastTick = now;
        const next = t + dt * Number($('speed').value);
        if (next >= MAX_MS || next <= MIN_MS) {
          setTime(Math.min(MAX_MS, Math.max(MIN_MS, next)));
          playing = false;
          $('playBtn').textContent = 'Play';
          $('playBtn').classList.remove('on');
          $('playBtn').setAttribute('aria-pressed', 'false');
        } else {
          setTime(next);
        }
      }
      if (renderer) renderer.render(scene, camera);
    }

    async function init() {
      const canvas = $('view');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.4;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20);
      camera.position.set(0, 0, 5.7);

      const stars = new THREE.Points(
        new THREE.BufferGeometry().setAttribute(
          'position',
          new THREE.Float32BufferAttribute(
            Array.from({ length: 600 }, () => (Math.random() - 0.5) * 18),
            3
          )
        ),
        new THREE.PointsMaterial({ color: 0xf0e6c8, size: 0.018, sizeAttenuation: true })
      );
      scene.add(stars);

      scene.add(new THREE.AmbientLight(0x16141c, 0.018));
      const earthshine = new THREE.DirectionalLight(0x6d7c9c, 0.07);
      earthshine.position.set(-0.15, 0.2, 1);
      scene.add(earthshine);

      sun = new THREE.DirectionalLight(0xfff3dc, 11);
      scene.add(sun);

      /* Unlit-leaning brass so the bezel stays gold even when the sun is behind the moon. */
      const bezelMat = new THREE.MeshStandardMaterial({
        color: 0xe8c96a, metalness: 0.7, roughness: 0.32,
        emissive: 0x8a6814, emissiveIntensity: 0.7
      });
      const darkBrass = new THREE.MeshStandardMaterial({
        color: 0x8a6a28, metalness: 0.7, roughness: 0.45,
        emissive: 0x4a380c, emissiveIntensity: 0.55
      });
      const ring = (r, tube, mat, z = 0) => {
        const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 16, 96), mat);
        m.position.z = z;
        scene.add(m);
      };
      ring(1.22, 0.035, bezelMat, 0.02);
      ring(1.30, 0.018, darkBrass, 0.01);
      ring(1.38, 0.03, bezelMat, 0);

      const loader = new THREE.TextureLoader();
      const [map, bump] = await Promise.all([
        loader.loadAsync('lroc_color_2k.jpg'),
        loader.loadAsync('ldem_3_8bit.jpg')
      ]);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      bump.anisotropy = map.anisotropy;

      moonPivot = new THREE.Group();
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(1, 96, 64),
        new THREE.MeshStandardMaterial({
          map,
          bumpMap: bump,
          bumpScale: 0.02,
          color: 0xfff3e4,
          roughness: 0.86,
          metalness: 0
        })
      );
      /* LROC map has 0° longitude at u=0.5; rotate so the near side faces the camera. */
      moon.rotation.y = -Math.PI / 2;
      moonPivot.add(moon);
      scene.add(moonPivot);

      function resize() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const s = Math.max(1, Math.round(w));
        renderer.setSize(s, s, false);
        camera.aspect = 1;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener('resize', resize);

      document.getElementById('loading').hidden = true;
      setTime(t);
    }

    setTime(t);
    requestAnimationFrame(tick);
    init().catch((err) => {
      $('loading').textContent = 'Could not load the moon map';
      console.error(err);
    });
  </script>
</body>
</html>
