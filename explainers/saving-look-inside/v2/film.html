    this.g.style.opacity = eo(seg(t, 16.8, 17.3)) * (1 - seg(t, 20.6, 21.2));
    const wob = Math.sin(t * 9) * 2.5 * seg(t, 17.6, 17.8) * (1 - seg(t, 17.9, 18.2));
    const ang = lerp(-80, 74, eo(seg(t, 16.9, 17.6))) + wob + (12 - 74) * spring(seg(t, 18.0, 19.0));
    this.nd.style.transform = 'rotate(' + ang.toFixed(2) + 'deg)';
    this.gf.setAttribute('stroke-dasharray', ((ang + 90) / 180 * 100).toFixed(2) + ' 100');
    const fl = t < 18.4;
    this.rd.textContent = fl ? 'FLAT OUT' : 'THROTTLED';
    this.rd.style.fill = fl ? 'var(--accent)' : 'var(--main)';
    this.rd.style.opacity = Math.min(1, Math.abs(seg(t, 18.2, 18.6) - 0.5) * 2);
    this.ch.forEach((st, i) => { const p = seg(t, 22.2 + i * 0.22, 22.6 + i * 0.22); st.opacity = eo(p); st.transform = 'translateY(' + lerp(16, 0, eob(p, 1.5)) + 'px)'; });
    this.dl.style.opacity = 0;
  },
});
}

/* ---- v2 overlays: hook (0-2.9 s) and ending (31-36 s) ---- */
{
const { seg, eo, ei, eio, lerp, clamp01 } = kit;
const tl = (x,y,w) => '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="11" rx="5" style="fill:#C9CED8"/>';
function pageSvg(x){ let s='<rect x="'+x+'" y="0" width="380" height="540" rx="4" style="fill:#FBFAF6;stroke:#D7D3C8;stroke-width:2"/>'; for(let k=0;k<13;k++) s+=tl(x+34,60+k*34,(k%5===4)?180:312); s+='<text x="'+(x+190)+'" y="520" text-anchor="middle" style="font:22px var(--sans);fill:#8A8F99">'+(x<300?'14':'15')+'</text>'; return s; }
function spread(cls){ return '<div class="'+cls+'" style="position:absolute;left:90px;top:560px;width:900px;height:720px;border-radius:18px;background:#1B2236;border:2px solid #2E3A5A;overflow:hidden">'+
 '<div style="height:84px;display:flex;align-items:center;gap:18px;padding:0 28px;background:#222B44">'+
 '<span style="font:700 30px var(--sans);color:#0F1424;background:var(--accent);padding:8px 22px;border-radius:999px">Read sample</span>'+
 '<span style="font:28px var(--sans);color:#AEB6C8">Look inside</span><span style="margin-left:auto;font:700 40px var(--sans);color:#AEB6C8">‹ ›</span></div>'+
 '<svg viewBox="0 0 900 636" width="900" height="636" style="display:block"><g transform="translate(40 50)">'+pageSvg(30)+pageSvg(410)+
 '<g class="v2-flip" style="transform-origin:410px 270px">'+pageSvg(410)+'</g><line x1="410" y1="0" x2="410" y2="540" style="stroke:#B9B4A8;stroke-width:3"/></g></svg></div>'; }
kit.scene('v2', {
 init(kit){
  kit.stage.append(kit.h(
   '<div class="v2-hook ground" style="z-index:5">'+spread('v2-sp')+
   '<div class="words" style="left:72px;top:70px;width:936px"><p class="lbl" style="font-size:30px;letter-spacing:.16em;color:var(--accent)">AMAZON · LOOK INSIDE THE BOOK</p>'+
   '<h2 class="line">500 million pages, one reboot from gone.</h2><p class="sub">A BIOS setting that wiped the disks on reboot.</p></div></div>'+
   '<div class="v2-end ground" style="z-index:5;opacity:0">'+spread('v2-sp')+
   '<div class="words" style="left:72px;top:150px;width:936px"><h2 class="line" style="font-size:96px">Still serving pages today.</h2>'+
   '<div class="v2-ul" style="height:10px;width:300px;border-radius:5px;background:var(--accent);transform-origin:0 50%"></div>'+
   '</div>'+
   '<p class="lbl" style="position:absolute;left:72px;bottom:22px;margin:0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))">Created with Claude Motion</p></div>'));
  this.hook=kit.stage.querySelector('.v2-hook'); this.end=kit.stage.querySelector('.v2-end');
  this.flips=[...kit.stage.querySelectorAll('.v2-flip')]; this.ul=kit.stage.querySelector('.v2-ul');
 },
 render(t){
  this.hook.style.opacity = 1 - eio(seg(t, 2.6, 3.0));
  this.hook.style.display = t > 3.0 ? 'none' : '';
  const e = eio(seg(t, 31.0, 31.5)); this.end.style.opacity = e; this.end.style.display = e <= 0 ? 'none' : '';
  // page flip: hook flips at 0.6-1.4; ending flips at 32.6-33.4 and settles flat (matches frame 0)
  const fp = (a) => { const p = seg(t, a, a + 0.8); return p <= 0 || p >= 1 ? 1 : Math.cos(Math.PI * eio(p)); };
  const v = t < 10 ? fp(0.6) : fp(32.6);
  this.flips.forEach(f => f.style.transform = 'scaleX(' + Math.abs(v).toFixed(3) + ')');
  this.ul.style.transform = 'scaleX(' + eo(seg(t, 31.4, 31.9)) + ')';
 }
});
}
/* ---- runner ---- */
const CUT=kit.scenes();CUT.forEach(s=>s.init(kit));
const frame=document.getElementById('frame'),stage=kit.stage;
function fit(){const s=Math.min(innerWidth*.95/W,(innerHeight-70)/H);frame.style.width=W*s+'px';frame.style.height=H*s+'px';stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
let t=0,playing=true,last=performance.now();
const scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),btn=document.getElementById('play');
function draw(){CUT.forEach(s=>s.render(t));scrub.value=t;tc.textContent=t.toFixed(2)+'s';}
function loop(now){if(playing){t+=(now-last)/1000;if(t>DUR)t=0;draw();}last=now;requestAnimationFrame(loop);}
btn.onclick=()=>{playing=!playing;btn.textContent=playing?'Pause':'Play';};
scrub.oninput=()=>{t=+scrub.value;playing=false;btn.textContent='Play';draw();};
window.renderAt=x=>{playing=false;t=x;draw();};
if(location.hash==='#render'){playing=false;document.getElementById('bar').style.display='none';document.body.style.background='#070B1A';frame.style.width=W+'px';frame.style.height=H+'px';stage.style.transform='none';removeEventListener('resize',fit);document.getElementById('wrap').style.cssText='display:block';}
document.fonts.ready.then(()=>{draw();requestAnimationFrame(loop);});
