<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Explainers — webartests</title>
  <link rel="stylesheet" href="../shared/css/main.css">
  <style>
    a.back { display: inline-block; margin-bottom: 40px; color: #555; text-decoration: none; font-size: 14px; }
    a.back:hover { color: #aaa; }
    .page { max-width: 900px; }
    .lede { color: #aaa; font-size: 15px; line-height: 1.65; max-width: 640px; margin-bottom: 14px; }
    .intro { margin-bottom: 48px; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .panel { overflow: hidden; cursor: pointer; }
    .panel:hover { background: var(--card-hover); border-color: var(--border-hover); }
    .panel h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .panel h2 a { color: #fff; text-decoration: none; }
    .panel h2 a:hover { color: var(--accent-blue); }
    .panel p { max-width: none; margin-bottom: 0; color: #888; font-size: 14px; line-height: 1.5; }
    .card-thumb {
      display: block;
      width: calc(100% + 56px);
      height: 200px;
      margin: -28px -28px 18px;
      object-fit: cover;
      object-position: center 22%;
      border-bottom: 1px solid #2a2a2a;
      background: #0d0d0d;
    }
    .meta { display: block; margin-top: 14px; font-size: 12px; color: #666; }
    .meta a { color: var(--accent-blue); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .empty { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <a class="back" href="../">← Back</a>

  <div class="page">
    <p class="section-label">Series</p>
    <h1>Explainers</h1>
    <div class="intro">
      <p class="lede">Short animated explainers of papers and ideas worth a minute of your time.</p>
    </div>

    <p class="section-label">Explainers</p>
    <!--
      EXPLAINERS
      Add the next entry at the top of the `explainers` array in the script below,
      then add explainers/<slug>/index.html.
    -->
    <div id="explainer-list" class="card-grid"></div>
  </div>

  <script>
    /*
     * EXPLAINERS — add new entries at the top of this array.
     *
     *   name     card title
     *   href     path from this folder, with a trailing slash
     *   summary  one sentence
     *   paper    link to the source (optional)
     *   made     tool it was made with (optional)
     *   image    poster image, path from this folder (optional)
     *   tags     short labels, joined on the card
     */
    var explainers = [
      {
        name: "Saving Look Inside the Book",
        href: "saving-look-inside/",
        summary: "A 30-second look at rebuilding the page-image servers behind Amazon's Look Inside the Book: over 50 aging machines, 500 million pages, about 80 TB moved, and a replacement where 80% of the code is diagnostics.",
        made: "Claude Motion",
        image: "saving-look-inside/poster.jpg",
        tags: ["Infrastructure", "Reliability", "Amazon"]
      },
      {
        name: "Start the Search Before They Finish Talking",
        href: "start-the-search/",
        summary: "A 94-second look at a Qualcomm AI Research and KAIST AI paper where an on-device voice agent starts read-only tool calls while you are still talking, cutting the median wait from 5.79 s to 4.60 s.",
        paper: "https://arxiv.org/abs/2610.07641",
        made: "Claude Motion",
        image: "start-the-search/poster.jpg",
        tags: ["On-device AI", "Voice agents", "Paper"]
      },
      {
        name: "Same AI, Less Scaffolding",
        href: "same-ai-less-scaffolding/",
        summary: "A 61-second look at an EPFL and Apple paper that found a plain coding agent matched or beat elaborate agent harnesses on ML engineering tasks.",
        paper: "https://arxiv.org/abs/2609.40303",
        made: "Claude Motion",
        image: "same-ai-less-scaffolding/poster.jpg",
        tags: ["AI agents", "ML engineering", "Paper"]
      }
    ];

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
      });
    }

    var mount = document.getElementById("explainer-list");
    if (!explainers.length) {
      mount.innerHTML = '<p class="empty">No explainers yet.</p>';
    } else {
      mount.innerHTML = explainers.map(function (x) {
        var thumb = x.image
          ? '<img class="card-thumb" src="' + esc(x.image) + '" alt="' + esc(x.name) + ' title frame">'
          : '<div class="card-icon">🎬</div>';
        var meta = [];
        if (x.paper) meta.push('<a href="' + esc(x.paper) + '" target="_blank" rel="noopener">Read the paper</a>');
        if (x.made) meta.push('Made with ' + esc(x.made));
        return (
          '<div class="panel" data-href="' + esc(x.href) + '">' +
            '<a href="' + esc(x.href) + '" tabindex="-1" aria-hidden="true">' + thumb + '</a>' +
            '<h2><a href="' + esc(x.href) + '">' + esc(x.name) + '</a></h2>' +
            '<p>' + esc(x.summary) + '</p>' +
            (meta.length ? '<span class="meta">' + meta.join(' · ') + '</span>' : '') +
            '<span class="tag">' + esc((x.tags || []).join(" · ")) + '</span>' +
          '</div>'
        );
      }).join("");
      mount.querySelectorAll('.panel[data-href]').forEach(function (card) {
        card.addEventListener('click', function (e) {
          if (e.target.closest('a')) return;
          location.href = card.getAttribute('data-href');
        });
      });
    }
  </script>
</body>
</html>
