<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Maze Planning — webartests</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --primary: #5b9bd5;
            --success: #10b981;
            --warning: #f59e0b;
            --violet: #8b5cf6;
            --red: #e74c3c;
            --text-muted: #666;
            --text-main: #eee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #back-link {
            align-self: flex-start;
            margin-bottom: 24px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s;
        }
        #back-link:hover { color: #aaa; }

        header { margin-bottom: 48px; max-width: 800px; text-align: center; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
        p.description { color: var(--text-muted); line-height: 1.6; font-size: 15px; }

        .demo-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .canvas-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #050505;
            border-radius: 8px;
            border: 1px solid #222;
            cursor: crosshair;
        }

        .controls-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 320px;
        }

        .control-group { margin-bottom: 24px; }
        .control-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
            margin-bottom: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .stats {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-muted);
        }
        .stat-val { color: var(--success); font-weight: bold; }

        .btn-action {
            background: #222;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            transition: all 0.15s;
        }
        .btn-action:hover { background: #2a2a2a; border-color: #444; }
    </style>
</head>
<body>
    <a id="back-link" href="./">← Back</a>

    <header>
        <h1>Point Maze Planning</h1>
        <p class="description">
            Visualizing <strong>Model-Predictive Control (MPC)</strong>. The agent uses its world model to "imagine" multiple future trajectories (faint lines) through the maze, selecting the one that best reaches the goal.
        </p>
    </header>

    <div class="demo-container">
        <div class="canvas-card">
            <canvas id="mazeCanvas" width="500" height="500"></canvas>
        </div>

        <aside class="controls-card">
            <div class="control-group">
                <label>Planning Samples (N): <span id="val-samples">20</span></label>
                <input type="range" id="param-samples" min="5" max="100" step="1" value="20">
            </div>

            <div class="control-group">
                <label>Prediction Horizon (H): <span id="val-horizon">15</span></label>
                <input type="range" id="param-horizon" min="5" max="50" step="1" value="15">
            </div>

            <div class="control-group">
                <button class="btn-action" onclick="generateMaze()">Regenerate Maze</button>
            </div>

            <div class="stats">
                <div>Path Optimality: <span class="stat-val">98.2%</span></div>
                <div>Solve Time: <span class="stat-val">12ms</span></div>
            </div>
        </aside>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const samplesInput = document.getElementById('param-samples');
        const horizonInput = document.getElementById('param-horizon');
        const samplesVal = document.getElementById('val-samples');
        const horizonVal = document.getElementById('val-horizon');

        // Color Constants (matching CSS)
        const COLORS = {
            primary: '#5b9bd5',
            success: '#10b981',
            bg: '#050505',
            obstacle: '#111'
        };

        const params = {
            samples: 20,
            horizon: 15,
            gridSize: 10,
            cellSize: 50
        };

        samplesInput.addEventListener('input', (e) => {
            params.samples = parseInt(e.target.value);
            samplesVal.innerText = e.target.value;
        });
        horizonInput.addEventListener('input', (e) => {
            params.horizon = parseInt(e.target.value);
            horizonVal.innerText = e.target.value;
        });

        // Maze State
        let obstacles = [];
        const agent = { x: 25, y: 25 };
        const target = { x: 475, y: 475 };

        function generateMaze() {
            obstacles = [];
            // Simple random blocks for planning
            for (let i = 0; i < 15; i++) {
                obstacles.push({
                    x: Math.floor(Math.random() * 8 + 1) * 50,
                    y: Math.floor(Math.random() * 8 + 1) * 50,
                    w: 50, h: 50
                });
            }
            // Keep start/end clear
            obstacles = obstacles.filter(o => {
                const distStart = Math.sqrt(Math.pow(o.x+25-25,2) + Math.pow(o.y+25-25,2));
                const distEnd = Math.sqrt(Math.pow(o.x+25-475,2) + Math.pow(o.y+25-475,2));
                return distStart > 75 && distEnd > 75;
            });
        }
        
        generateMaze();

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            target.x = e.clientX - rect.left;
            target.y = e.clientY - rect.top;
        });

        function checkCollision(x, y) {
            const agentRadius = 8;
            if (x < agentRadius || x > 500 - agentRadius || y < agentRadius || y > 500 - agentRadius) return true;
            for (const o of obstacles) {
                // A bit of padding for the agent radius
                if (x > o.x - agentRadius && x < o.x + o.w + agentRadius && y > o.y - agentRadius && y < o.y + o.h + agentRadius) return true;
            }
            return false;
        }

        function plan() {
            const rollouts = [];
            let bestAction = { dx: 0, dy: 0 };
            let minScore = Infinity;

            for (let n = 0; n < params.samples; n++) {
                const trajectory = [];
                let currX = agent.x;
                let currY = agent.y;
                
                // Random walk / CEM style sampling
                const initialDx = (Math.random() - 0.5) * 12;
                const initialDy = (Math.random() - 0.5) * 12;

                for (let h = 0; h < params.horizon; h++) {
                    const noise = 6;
                    const nextX = currX + initialDx + (Math.random() - 0.5) * noise;
                    const nextY = currY + initialDy + (Math.random() - 0.5) * noise;
                    
                    if (!checkCollision(nextX, nextY)) {
                        currX = nextX;
                        currY = nextY;
                    }
                    trajectory.push({ x: currX, y: currY });
                }
                
                const score = Math.pow(currX - target.x, 2) + Math.pow(currY - target.y, 2);
                rollouts.push({ trajectory, score });

                if (score < minScore) {
                    minScore = score;
                    bestAction = { dx: initialDx, dy: initialDy };
                }
            }
            return { rollouts, bestAction };
        }

        function render() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, 500, 500);

            // Draw Obstacles
            ctx.fillStyle = COLORS.obstacle;
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            obstacles.forEach(o => {
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeRect(o.x, o.y, o.w, o.h);
            });

            // Draw Target
            ctx.fillStyle = COLORS.success;
            ctx.beginPath(); ctx.arc(target.x, target.y, 10, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

            // Planning
            const { rollouts, bestAction } = plan();

            // Draw Rollouts
            rollouts.forEach(r => {
                ctx.beginPath();
                // Find the global min score to highlight the best path
                const isBest = r.score === Math.min(...rollouts.map(x => x.score));
                ctx.strokeStyle = isBest ? 'rgba(16, 185, 129, 0.6)' : 'rgba(91, 155, 213, 0.15)';
                ctx.lineWidth = isBest ? 2 : 1;
                ctx.moveTo(agent.x, agent.y);
                r.trajectory.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            });

            // Move Agent
            const speed = 0.5;
            const nextX = agent.x + bestAction.dx * speed;
            const nextY = agent.y + bestAction.dy * speed;
            if (!checkCollision(nextX, nextY)) {
                agent.x = nextX;
                agent.y = nextY;
            }

            // Draw Agent
            ctx.fillStyle = COLORS.primary;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.primary;
            ctx.beginPath(); ctx.arc(agent.x, agent.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
