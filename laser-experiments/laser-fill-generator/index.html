<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Fill Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .controls {
            margin-bottom: 20px;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 800px;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #005f9e; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .refresh-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin: 5px 0;
        }
        .refresh-row button {
            flex: 1;
            margin: 0;
            padding: 10px 4px;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-icon {
            font-size: 22px;
            vertical-align: middle;
            margin-right: 2px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
        }
        .shape-presets {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .preset-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 6px;
            margin: 0;
            width: 64px;
            color: #ccc;
            font-size: 11px;
            font-weight: normal;
        }
        .preset-btn:hover { background: #2a2a2a; border-color: #007acc; color: #fff; }
        .preset-btn svg { width: 26px; height: 26px; }
        .mini-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ccc;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }
        .mini-btn:hover { background: #2a2a2a; border-color: #007acc; color: #fff; }
        .mini-btn:disabled { opacity: 0.3; cursor: not-allowed; background: #1a1a1a; border-color: #444; color: #ccc; }
        .options-row {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .options-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            position: relative;
        }
        .options-row label.dim {
            opacity: 0.4;
        }
        /* The dual-thumb Sizes slider needs a definite-width parent to resolve
           its own width:100%, so it always takes a full row (not just on the
           desktop sidebar, where every row is full-width anyway). */
        .options-row label[for="sizeMinSlider"] {
            width: 100%;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;
        }
        .options-row label[data-tooltip]:not(.dim) {
            cursor: help;
        }
        .options-row label[data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            width: 220px;
            max-width: 60vw;
            background: #111;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.4;
            white-space: normal;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 30;
            pointer-events: none;
        }
        .options-row label[data-tooltip]:not(.dim):hover::after,
        .options-row label[data-tooltip]:not(.dim):focus-within::after {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        input[type="range"]:disabled {
            cursor: not-allowed;
        }
        select {
            background-color: #3a3a3a;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .mode-toggle {
            display: flex;
            width: 100%;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .mode-toggle-btn {
            flex: 1;
            background: #1a1a1a;
            color: #ccc;
            border: none;
            border-radius: 0;
            padding: 8px 6px;
            margin: 0;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .mode-toggle-btn:hover { background: #2a2a2a; }
        .mode-toggle-btn.active { background: #007acc; color: #fff; }
        .mode-toggle-btn + .mode-toggle-btn { border-left: 1px solid #444; }
        #editShapeBtn.active { background-color: #2ecc71; }
        #editShapeBtn.active:hover { background-color: #27ae60; }

        .dual-slider-wrap {
            position: relative;
            width: 100%;
            height: 20px;
            margin-top: 4px;
        }
        .dual-slider-track {
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 4px;
            background: #555;
            border-radius: 2px;
            transform: translateY(-50%);
        }
        .dual-slider-range {
            position: absolute;
            top: 50%;
            height: 4px;
            background: #007acc;
            border-radius: 2px;
            transform: translateY(-50%);
        }
        .dual-slider-wrap input[type="range"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 20px;
            margin: 0;
            background: transparent;
            pointer-events: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .dual-slider-wrap input[type="range"]::-webkit-slider-runnable-track {
            -webkit-appearance: none;
            background: transparent;
        }
        .dual-slider-wrap input[type="range"]::-moz-range-track {
            background: transparent;
        }
        .dual-slider-wrap input[type="range"]::-webkit-slider-thumb {
            pointer-events: auto;
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #007acc;
            cursor: pointer;
        }
        .dual-slider-wrap input[type="range"]::-moz-range-thumb {
            pointer-events: auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #007acc;
            cursor: pointer;
        }
        .dual-slider-wrap input[type="range"]:disabled::-webkit-slider-thumb { border-color: #777; cursor: not-allowed; }
        .dual-slider-wrap input[type="range"]:disabled::-moz-range-thumb { border-color: #777; cursor: not-allowed; }
        .canvas-container {
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        canvas {
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: default;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-width: 100%;
            height: auto;
            touch-action: none; /* Prevent scrolling when drawing on mobile */
        }
        .instructions { font-size: 14px; color: #aaa; margin-top: 10px; }

        /* Desktop: move the control panel to a left sidebar so the canvas can
           use the rest of the screen instead of being capped to 800px wide. */
        @media (min-width: 900px) {
            body {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                gap: 24px;
            }
            .controls {
                width: 300px;
                max-width: 300px;
                flex-shrink: 0;
                margin-bottom: 0;
                position: sticky;
                top: 20px;
                max-height: calc(100vh - 40px);
                overflow-y: auto;
                text-align: left;
                display: flex;
                flex-direction: column;
            }
            /* Buttons move below the sliders/instructions on desktop, without
               changing the HTML order (mobile keeps buttons at the top). */
            .controls > button { width: 100%; margin: 5px 0; order: 3; }
            .shape-presets { order: 4; }
            .options-row {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                order: 1;
            }
            .instructions { order: 2; }
            .options-row label {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .options-row input[type="range"],
            .options-row select {
                width: 100%;
            }
            .canvas-container {
                max-width: 1200px;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="refresh-row">
            <button id="refreshColorsBtn" disabled title="Keep the same layout, reroll colors only"><span class="btn-icon">🎨</span> Color</button>
            <button id="refreshPatternBtn" disabled title="Keep the same colors, reroll layout only"><span class="btn-icon">🔀</span> Pattern</button>
        </div>
        <button id="editShapeBtn" title="Add or move the shape's points">✏️ Edit Shape</button>
        <button id="resetBtn" style="display:none;">Clear Shape</button>
        <div class="shape-presets">
            <button class="preset-btn" data-shape="pendant" title="Pendant">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="8,2 16,2 20,6 20,18 16,22 8,22 4,18 4,6"/></svg>
                <span>Pendant</span>
            </button>
            <button class="preset-btn" data-shape="circle" title="Circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/></svg>
                <span>Circle</span>
            </button>
            <button class="preset-btn" data-shape="cuff" title="Wide cuff bracelet">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="10"/></svg>
                <span>Cuff</span>
            </button>
            <button class="preset-btn" data-shape="bracelet" title="Thin bracelet strip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="10" width="22" height="4"/></svg>
                <span>Bracelet</span>
            </button>
        </div>
        <div class="options-row">
            <label for="styleSelect">Style:
                <select id="styleSelect">
                    <option value="flat">Flat</option>
                    <option value="3d-basic">3D Basic</option>
                    <option value="3d-glossy">3D Glossy</option>
                    <option value="illustrated">Pipes and Gears</option>
                    <option value="circuit">Circuit Board</option>
                    <option value="painted_lady">Painted Lady</option>
                    <option value="ducks">Rows of Ducks</option>
                    <option value="gears" selected>Gears</option>
                    <option value="christmas">Christmas Cookies</option>
                    <option value="coins">World Coins</option>
                    <option value="gems">Gems</option>
                    <option value="buttons">Buttons</option>
                    <option value="autumn_leaves">Autumn Leaves</option>
                </select>
            </label>
            <label for="paletteSelect">
                <span class="ctrl-text">Palette: <button type="button" id="paletteDefaultBtn" class="mini-btn" title="Use default palette for this style">★</button></span>
                <select id="paletteSelect">
                    <option value="classic">Classic</option>
                    <option value="steampunk" selected>SteamPunk</option>
                    <option value="neon">Neon</option>
                    <option value="art_pendant">Cool Stainless</option>
                    <option value="circuit">Circuit Colors</option>
                    <option value="painted_lady">Painted Lady</option>
                    <option value="ducks">Ducks</option>
                    <option value="christmas">Christmas</option>
                    <option value="coins">Coins</option>
                    <option value="gems">Gems</option>
                    <option value="buttons">Buttons</option>
                    <option value="autumn_leaves">Autumn Leaves</option>
                </select>
            </label>
            <div class="mode-toggle" role="group" aria-label="Mode">
                <button type="button" class="mode-toggle-btn active" data-mode="fill">Fill Interior</button>
                <button type="button" class="mode-toggle-btn" data-mode="border">Trace Border</button>
            </div>
            <select id="modeSelect" style="display:none">
                <option value="fill" selected>Fill Interior</option>
                <option value="border">Trace Border</option>
            </select>
            <label for="thicknessSlider"><span class="ctrl-text"><span id="thicknessLabel">Thickness</span> (<span id="thicknessValue">20</span>/500):</span>
                <input type="range" id="thicknessSlider" min="2" max="400" value="20">
            </label>
            <label for="sizeMinSlider"><span class="ctrl-text"><span id="sizeLabel">Sizes</span>: <span id="sizeMinValue">60</span><span id="sizeMinSuffix">%</span>–<span id="sizeMaxValue">430</span><span id="sizeMaxSuffix">%</span></span>
                <div class="dual-slider-wrap">
                    <div class="dual-slider-track"></div>
                    <div class="dual-slider-range" id="sizeRangeHighlight"></div>
                    <input type="range" id="sizeMinSlider" min="20" max="600" step="5" value="60">
                    <input type="range" id="sizeMaxSlider" min="20" max="600" step="5" value="430">
                </div>
            </label>
            <label for="densitySlider"><span class="ctrl-text"><span id="densityLabel">Density</span>: <span id="densityValue">50</span>%</span>
                <input type="range" id="densitySlider" min="5" max="150" value="50">
            </label>
            <label for="gearSlider"><span class="ctrl-text"><span id="gearLabel">Gears</span>: <span id="gearValue">6</span></span>
                <input type="range" id="gearSlider" min="0" max="20" value="6">
            </label>
            <label for="colorSlider"><span class="ctrl-text"><span id="colorLabel">Color Changes</span>: <span id="colorValue">2</span></span>
                <input type="range" id="colorSlider" min="0" max="100" value="15">
            </label>
            <label for="maxStraightSlider"><span class="ctrl-text"><span id="maxStraightLabel">Max Straight</span>: <span id="maxStraightValue">10</span></span>
                <input type="range" id="maxStraightSlider" min="1" max="25" value="10">
            </label>
            <label for="marginSlider"><span class="ctrl-text"><span id="marginLabel">Edge Margin</span>: <span id="marginValue">0</span></span>
                <input type="range" id="marginSlider" min="-100" max="100" value="0">
            </label>
        </div>
        <div class="instructions" id="instructions"></div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="1200" height="900"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const refreshColorsBtn = document.getElementById('refreshColorsBtn');
        const refreshPatternBtn = document.getElementById('refreshPatternBtn');
        function setRefreshEnabled(enabled) {
            refreshColorsBtn.disabled = !enabled;
            refreshPatternBtn.disabled = !enabled;
        }
        const resetBtn = document.getElementById('resetBtn');
        const editShapeBtn = document.getElementById('editShapeBtn');
        const instructions = document.getElementById('instructions');
        let isEditMode = false;
        function setEditMode(on) {
            isEditMode = on;
            editShapeBtn.classList.toggle('active', on);
            editShapeBtn.textContent = on ? '✅ Done Editing' : '✏️ Edit Shape';
            resetBtn.style.display = on ? '' : 'none';
            canvas.style.cursor = on ? 'crosshair' : 'default';
            instructions.textContent = on
                ? 'Tap/click the canvas to add a point, or drag an existing point to move it.'
                : '';
            if (isGenerated) generatePipes();
        }
        editShapeBtn.addEventListener('click', () => setEditMode(!isEditMode));
        const thicknessSlider = document.getElementById('thicknessSlider');
        const thicknessValue = document.getElementById('thicknessValue');
        const styleSelect = document.getElementById('styleSelect');
        const paletteSelect = document.getElementById('paletteSelect');
        const colorSlider = document.getElementById('colorSlider');
        const colorValue = document.getElementById('colorValue');

        // The source of truth for "how much color variety" is this plain JS
        // fraction, not colorSlider.value — range inputs silently re-snap their
        // .value to the nearest step multiple the instant .step changes (a
        // real browser quirk, not just a display rounding), which would
        // otherwise drift the percentage on every style/palette switch (e.g.
        // 100% could silently become 83%). Only the 'input' listener (an
        // actual user drag) updates this; everything else reads it instead of
        // colorSlider.value, so "100% = every color in the palette" always
        // holds regardless of which style/palette is active.
        let colorPct = parseFloat(colorSlider.value) / 100;
        const maxStraightSlider = document.getElementById('maxStraightSlider');
        const maxStraightValue = document.getElementById('maxStraightValue');
        const gearSlider = document.getElementById('gearSlider');
        const gearValue = document.getElementById('gearValue');
        const marginSlider = document.getElementById('marginSlider');
        const marginValue = document.getElementById('marginValue');
        const modeSelect = document.getElementById('modeSelect');
        const densitySlider = document.getElementById('densitySlider');
        const densityValue = document.getElementById('densityValue');
        const sizeMinSlider = document.getElementById('sizeMinSlider');
        const sizeMaxSlider = document.getElementById('sizeMaxSlider');
        const sizeMinValue = document.getElementById('sizeMinValue');
        const sizeMaxValue = document.getElementById('sizeMaxValue');
        const sizeMinSuffix = document.getElementById('sizeMinSuffix');
        const sizeMaxSuffix = document.getElementById('sizeMaxSuffix');
        const sizeRangeHighlight = document.getElementById('sizeRangeHighlight');

        let rawPoints = [];
        let hullPoints = [];
        let isGenerated = false;
        let draggingPoint = null;
        let gears = []; // Store generated gears for redraws
        let shapeIsCustom = false; // true once the user hand-edits away from a loaded preset

        // Pattern (placement/shape/size) and Color (palette picks) are driven by
        // two independently-seeded PRNGs so "Refresh Colors" and "Refresh
        // Pattern" can regenerate one aspect while replaying the other exactly.
        // Plain Math.random() is intentionally never used elsewhere in
        // generation code so every random decision is reproducible this way.
        function makeRng(seed) {
            let s = seed >>> 0;
            return function () {
                s = (s + 0x6D2B79F5) >>> 0;
                let t = s;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        let patternSeed = Math.floor(Math.random() * 4294967296);
        let colorSeed = Math.floor(Math.random() * 4294967296);
        let patternRandom = makeRng(patternSeed);
        let colorRandom = makeRng(colorSeed);
        function reseedRandom() {
            patternRandom = makeRng(patternSeed);
            colorRandom = makeRng(colorSeed);
        }

        // Common laser-cut blanks, offered as one-click starting shapes
        const SHAPE_PRESETS = {
            pendant: () => [
                { x: 435, y: 75 }, { x: 765, y: 75 }, { x: 825, y: 135 }, { x: 825, y: 765 },
                { x: 765, y: 825 }, { x: 435, y: 825 }, { x: 375, y: 765 }, { x: 375, y: 135 }
            ],
            circle: () => {
                let pts = [];
                let cx = 600, cy = 450, r = 330, n = 32;
                for (let i = 0; i < n; i++) {
                    let a = (i / n) * Math.PI * 2;
                    pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
                }
                return pts;
            },
            cuff: () => [
                { x: 225, y: 330 }, { x: 975, y: 330 }, { x: 975, y: 570 }, { x: 225, y: 570 }
            ],
            bracelet: () => [
                { x: 150, y: 367.5 }, { x: 1050, y: 367.5 }, { x: 1050, y: 532.5 }, { x: 150, y: 532.5 }
            ]
        };

        function loadPreset(shapeKey) {
            const apply = () => {
                rawPoints = SHAPE_PRESETS[shapeKey]();
                hullPoints = calculateConvexHull(rawPoints);
                shapeIsCustom = false;
                setRefreshEnabled(true);
                isGenerated = true;
                applySliderMeta();
                generatePipes();
            };
            if (shapeIsCustom) {
                if (confirm('Replace your custom-edited shape with this preset? This cannot be undone.')) apply();
            } else {
                apply();
            }
        }

        // Palettes
        const palettes = {
            classic: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#ecf0f1', '#d35400'],
            steampunk: ['#b08d57', '#a97142', '#8c5e3c', '#5e3a21', '#cda434', '#d4af37', '#7b3f00', '#b5a642', '#8a795d'],
            neon: ['#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ff0000', '#ff8800'],
            art_pendant: ['#3498db', '#5dade2', '#d4af37', '#aab7b8', '#d5f5e3', '#f4d03f', '#7f8c8d'],
            circuit: ['#a52a2a', '#8b4513', '#cd7f32', '#b8860b', '#d2691e'],
            // More vibrant palette for the new Painted Lady style
            painted_lady: ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE', '#6C5CE7', '#FD79A8', '#00B894', '#FDCB6E', '#E17055'],
            ducks: ['#FDD835', '#FFEB3B', '#FFF59D', '#FFFFFF', '#E0E0E0', '#FF9800', '#4CAF50'],
            christmas: ['#c0392b', '#165b33', '#f8b229', '#ffffff', '#0b6e4f', '#e94560', '#d4af37'],
            coins: ['#c9c9c9', '#a8a8a8', '#7d7d7d', '#5a5a5a', '#d4af37', '#b8860b', '#b87333', '#cd7f32', '#8b5a2b'],
            gems: ['#e0115f', '#0f52ba', '#50c878', '#9966cc', '#ffc87c', '#b9f2ff', '#ff8c42'],
            buttons: ['#e63946', '#f4a340', '#ffd23f', '#6a994e', '#1b4332', '#3a86ff', '#ff5da2', '#b185db', '#f1faee'],
            autumn_leaves: ['#c1440e', '#e3641b', '#f2a30f', '#d4a017', '#8b5a2b', '#a52a2a', '#6b4226', '#e8b923']
        };

        // Helper to get coordinates for both mouse and touch events
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            if (!isEditMode) return;
            e.preventDefault();
            const point = getCoordinates(e);
            let clickedExisting = false;

            for (let p of rawPoints) {
                if (Math.hypot(p.x - point.x, p.y - point.y) < 15) {
                    draggingPoint = p;
                    clickedExisting = true;
                    break;
                }
            }

            if (!clickedExisting) {
                rawPoints.push(point);
                draggingPoint = point;
                shapeIsCustom = true;
            }

            hullPoints = calculateConvexHull(rawPoints);
            if (hullPoints.length >= 3) {
                setRefreshEnabled(true);
            }

            if (!isGenerated) {
                drawBase(styleSelect.value);
                drawHandles();
            }
        }

        function handlePointerMove(e) {
            if (!isEditMode || !draggingPoint) return;
            e.preventDefault();
            const point = getCoordinates(e);
            draggingPoint.x = point.x;
            draggingPoint.y = point.y;
            shapeIsCustom = true;

            hullPoints = calculateConvexHull(rawPoints);

            drawBase(styleSelect.value);
            drawHandles();
        }

        function handlePointerUp(e) {
            if (!draggingPoint) return;
            e.preventDefault();
            draggingPoint = null;

            if (isGenerated && hullPoints.length >= 3) {
                generatePipes();
            } else if (!isGenerated) {
                drawBase(styleSelect.value);
                drawHandles();
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        refreshColorsBtn.addEventListener('click', () => {
            if (hullPoints.length < 3) return;
            isGenerated = true;
            const previousPool = colorPoolFingerprint();
            // A fresh random seed usually gives a different color pool, but at
            // low color counts it can coincidentally reshuffle to the same set
            // by chance — retry a few times so a click always visibly changes
            // something, short of the palette only having one color total.
            for (let attempt = 0; attempt < 8; attempt++) {
                colorSeed = Math.floor(Math.random() * 4294967296);
                generatePipes();
                if (colorPoolFingerprint() !== previousPool) break;
            }
        });

        refreshPatternBtn.addEventListener('click', () => {
            if (hullPoints.length < 3) return;
            isGenerated = true;
            patternSeed = Math.floor(Math.random() * 4294967296);
            generatePipes();
        });

        resetBtn.addEventListener('click', () => {
            if (rawPoints.length > 0 && !confirm('Clear the current shape? This cannot be undone.')) return;
            rawPoints = [];
            hullPoints = [];
            isGenerated = false;
            shapeIsCustom = false;
            setRefreshEnabled(false);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => loadPreset(btn.dataset.shape));
        });

        thicknessSlider.addEventListener('input', (e) => {
            thicknessValue.textContent = e.target.value;
            if (isGenerated) generatePipes();
        });

        // Every slider means something different depending on style/mode; this maps
        // the current combination to a contextual label (and, for any combination
        // that genuinely has no effect, disables the control so it doesn't mislead).
        const STYLE_NOUN = {
            flat: 'Pipe', '3d-basic': 'Pipe', '3d-glossy': 'Pipe',
            illustrated: 'Gear', circuit: 'Component', painted_lady: 'House',
            ducks: 'Duck', gears: 'Gear', christmas: 'Cookie',
            coins: 'Coin', gems: 'Gem', buttons: 'Button', autumn_leaves: 'Leaf'
        };
        // A few nouns pluralize irregularly (Leaf -> Leaves, not "Leafs") — the
        // generic slider-description templates below use this instead of a
        // bare `${nounLower}s` wherever the plural actually appears in copy.
        const NOUN_PLURAL_OVERRIDES = { autumn_leaves: 'leaves' };
        const MAZE_STYLE_SET = ['flat', '3d-basic', '3d-glossy', 'illustrated', 'circuit'];

        function computeSliderMeta(style, mode) {
            const noun = STYLE_NOUN[style] || 'Object';
            const nounLower = noun.toLowerCase();
            const nounPlural = NOUN_PLURAL_OVERRIDES[style] || (nounLower + 's');
            const meta = {};

            // A style is "point-only" (no traced path) whenever it's not one of
            // the maze/pipe-tracing styles, with one exception: Painted Lady
            // always uses House Scale (Thickness) as its size control in both
            // modes — Border mode strings houses along the perimeter at the
            // same density/scale convention as Fill's roads, rather than
            // switching to Sizes like the other point-only styles. In every
            // other point-only case, Sizes (below) is the sole size control
            // instead. Labels below are chosen to stay identical across
            // Fill/Border wherever the underlying meaning doesn't genuinely
            // differ, so toggling mode doesn't reshuffle the panel's wording.
            const isPointStyle = !MAZE_STYLE_SET.includes(style) && style !== 'painted_lady';

            if (isPointStyle) {
                meta.thickness = {
                    label: 'Path Thickness',
                    description: `Not meaningful for ${nounPlural}, which are placed individually rather than along a traced path — use ${noun} Sizes below to control their size instead.`,
                    disabled: true
                };
            } else if (style === 'circuit') {
                meta.thickness = { label: 'Trace Thickness', description: mode === 'border' ? "Sets the width of the copper wire and components traced around the border." : "Sets how wide each copper trace and component is drawn.", disabled: false };
            } else if (style === 'painted_lady') {
                meta.thickness = { label: 'House Scale', description: "Scales the size of the houses lining each road segment.", disabled: false };
            } else {
                meta.thickness = { label: 'Pipe Thickness', description: mode === 'border' ? "Sets the width of the pipe traced around the border." : "Sets how wide each pipe segment is, as a fraction of the shape's narrowest dimension.", disabled: false };
            }

            if (MAZE_STYLE_SET.includes(style)) {
                meta.density = { label: 'Density', description: mode === 'border' ? `Controls the spacing between ${nounPlural} strung along the traced border.` : "Controls the maze's grid resolution — higher values mean smaller cells, so the pipe pattern has more, tighter turns.", disabled: false };
            } else if (style === 'gears') {
                meta.density = { label: 'Density', description: mode === 'border' ? `Controls the spacing between ${nounPlural} strung along the traced border.` : "Controls the total count of the mixed-size gear swarm.", disabled: false };
            } else if (style === 'painted_lady') {
                meta.density = { label: 'Density', description: "Controls how close together houses are placed along each road.", disabled: false };
            } else {
                meta.density = { label: 'Density', description: mode === 'border' ? `Controls the spacing between ${nounPlural} strung along the traced border.` : `Controls how close together the ${nounPlural} are scattered.`, disabled: false };
            }

            if (style === 'circuit') {
                meta.color = { label: 'Component Colors', description: "Circuit's wires and components use realistic fixed colors — bare copper, gold-plated jumpers, standard resistor/capacitor bands — not the palette, so this has no effect here.", disabled: true };
            } else if (style === 'painted_lady') {
                meta.color = { label: 'House Colors', description: mode === 'fill' ? "Sets how many palette colors are in play (0% = one color, 100% = the full palette) and how eagerly the houses' color 'neighborhood' changes between road segments." : "Sets how many palette colors are in play (0% = one color, 100% = the full palette) as houses are strung along the border.", disabled: false };
            } else if (mode === 'fill' && MAZE_STYLE_SET.includes(style)) {
                meta.color = { label: noun + ' Colors', description: "Sets how many palette colors are in play (0% = one color, 100% = the full palette) as the pipe winds through the maze.", disabled: false };
            } else {
                meta.color = { label: noun + ' Colors', description: `Sets how many palette colors are in play (0% = one color, 100% = the full palette) — unlike Cluster Run, a small pool stays small even when a run is forced to switch.`, disabled: false };
            }

            if (MAZE_STYLE_SET.includes(style)) {
                meta.maxStraight = { label: 'Color Cluster', description: mode === 'fill' ? "Caps how many grid cells in a row the pipe can travel in a straight line before it must turn." : `Caps how many consecutive ${nounPlural} can share the same color before it's forced to change.`, disabled: false };
            } else if (style === 'painted_lady') {
                meta.maxStraight = { label: 'Color Cluster', description: mode === 'fill' ? "Caps how long each straight road segment can run before turning, which also caps how many segments share a neighborhood color." : `Caps how many consecutive ${nounPlural} can share the same color before it's forced to change.`, disabled: false };
            } else if (mode === 'fill' && (style === 'gears' || style === 'autumn_leaves')) {
                // Placed with pure Math.random() (no grid), so "consecutive"
                // items in the color sequence aren't spatially adjacent on
                // screen — a run cap has nothing visible to constrain.
                meta.maxStraight = { label: 'Color Cluster', description: `This style scatters ${nounPlural} at fully random positions, so consecutive picks aren't near each other on screen — there's no visible run to cap.`, disabled: true };
            } else {
                meta.maxStraight = { label: 'Color Cluster', description: `Caps how many consecutive ${nounPlural} can share the same color before it's forced to change.`, disabled: false };
            }

            if (['flat', '3d-basic', '3d-glossy'].includes(style)) {
                meta.gears = { label: 'Accent Count', description: mode === 'border' ? `Sets how many oversized landmark ${nounPlural} appear evenly along the border (0 disables them).` : "Sets how many decorative gear accents are scattered on top of the pipes.", disabled: false };
            } else if (style === 'gears') {
                meta.gears = { label: 'Accent Count', description: mode === 'border' ? `Sets how many oversized landmark ${nounPlural} appear evenly along the border (0 disables them).` : "Adds extra oversized feature gears behind the swarm — independent of Density, which only scales the regular mixed-size count.", disabled: false };
            } else if (style === 'autumn_leaves') {
                meta.gears = { label: 'Accent Count', description: mode === 'border' ? "Sets how many acorns, gourds, and pinecones appear evenly along the border (0 disables them)." : "Adds acorns, gourds, and pinecones scattered among the regular leaf pile.", disabled: false };
            } else {
                meta.gears = { label: 'Accent Count', description: mode === 'border' ? `Sets how many oversized landmark ${nounPlural} appear evenly along the border (0 disables them).` : `Sets how many oversized landmark ${nounPlural} (or related decorations) appear among the regular scatter.`, disabled: false };
            }

            meta.margin = {
                label: 'Edge Margin',
                description: mode === 'border'
                    ? "Offsets the traced path inward (positive) or outward (negative) from the drawn edge."
                    : "Shrinks (positive) or grows (negative) the fillable area inward/outward from the drawn edge.",
                disabled: false
            };

            if (isPointStyle) {
                meta.size = { label: noun + ' Sizes', description: `Sets the min/max size range for the ${nounPlural}, in the same units as Trace/Pipe Thickness (raw value out of 500, as a fraction of the shape's narrow dimension) since Thickness is disabled for point-only styles. Accent Count ${nounPlural} are drawn as a multiple of the largest size here.`, disabled: false };
            } else if (style === 'painted_lady') {
                meta.size = { label: 'House Sizes', description: "Not used — House Scale (Thickness) controls house size in both Fill and Border mode.", disabled: true };
            } else {
                meta.size = { label: 'Sizes', description: "Only used by point-only styles (everything except Painted Lady's Fill-mode roads and the maze/pipe-tracing styles), where it sets the min/max size range in place of Thickness.", disabled: true };
            }

            return meta;
        }

        function applySliderMeta() {
            const meta = computeSliderMeta(styleSelect.value, modeSelect.value);
            const bindings = [
                ['thickness', 'thicknessLabel', [thicknessSlider]],
                ['density', 'densityLabel', [densitySlider]],
                ['color', 'colorLabel', [colorSlider]],
                ['maxStraight', 'maxStraightLabel', [maxStraightSlider]],
                ['gears', 'gearLabel', [gearSlider]],
                ['margin', 'marginLabel', [marginSlider]],
                ['size', 'sizeLabel', [sizeMinSlider, sizeMaxSlider]]
            ];
            bindings.forEach(([key, labelId, sliders]) => {
                const info = meta[key];
                document.getElementById(labelId).textContent = info.label;
                sliders.forEach(slider => { slider.disabled = info.disabled; });
                const label = sliders[0].closest('label');
                if (label) {
                    label.classList.toggle('dim', info.disabled);
                    if (info.description) label.setAttribute('data-tooltip', info.description);
                    else label.removeAttribute('data-tooltip');
                }
            });
        }

        // Sizes is shared by every point-only style in either mode, and always
        // uses Trace Width's own units (raw value out of 500, as a fraction of
        // the shape's narrow dimension) — Trace Width is disabled for these
        // styles, so Sizes takes over as their sole size control, and using the
        // identical scale keeps the two controls directly comparable instead of
        // a separate percentage layered on top.
        const SIZE_DEFAULTS_POINT = {
            ducks: { min: 15, max: 40 }, painted_lady: { min: 15, max: 40 }, gears: { min: 12, max: 35 },
            christmas: { min: 15, max: 40 }, coins: { min: 12, max: 30 }, gems: { min: 10, max: 30 }, buttons: { min: 10, max: 28 },
            autumn_leaves: { min: 12, max: 32 }
        };

        // Thickness's usable range is 2-400 by default, but some styles look
        // best capped much lower — House Scale (Painted Lady), Trace Thickness
        // (Circuit), and Pipe Thickness (the maze/pipe styles) would balloon
        // absurdly large well before 400.
        const THICKNESS_MAX_BY_STYLE = {
            painted_lady: 40, circuit: 50,
            flat: 50, '3d-basic': 50, '3d-glossy': 50, illustrated: 50
        };
        const THICKNESS_MAX_DEFAULT = 400;
        function applyThicknessRangeForStyle() {
            let max = THICKNESS_MAX_BY_STYLE[styleSelect.value] || THICKNESS_MAX_DEFAULT;
            thicknessSlider.max = String(max);
            if (parseInt(thicknessSlider.value, 10) > max) {
                thicknessSlider.value = String(max);
                thicknessValue.textContent = thicknessSlider.value;
            }
        }

        // Switches the Sizes slider's default range to the current style (units
        // are always Trace Width's 2-400-out-of-500 scale, regardless of mode).
        function applySizeRangeForContext() {
            sizeMinSlider.min = sizeMaxSlider.min = thicknessSlider.min;
            sizeMinSlider.max = sizeMaxSlider.max = '120';
            sizeMinSlider.step = sizeMaxSlider.step = '1';
            sizeMinSuffix.textContent = sizeMaxSuffix.textContent = '/500';
            const def = SIZE_DEFAULTS_POINT[styleSelect.value];
            if (def) {
                sizeMinSlider.value = def.min;
                sizeMaxSlider.value = def.max;
            }
            updateSizeRangeUI();
        }

        // One suggested palette per style. Selecting a style auto-applies it;
        // the button next to the Palette label is a shortcut back to it after
        // the user has manually picked something else for the same style.
        const STYLE_DEFAULT_PALETTE = {
            flat: 'classic', '3d-basic': 'classic', '3d-glossy': 'classic', illustrated: 'classic',
            circuit: 'circuit', painted_lady: 'painted_lady', ducks: 'ducks', gears: 'steampunk',
            christmas: 'christmas', coins: 'coins', gems: 'gems', buttons: 'buttons', autumn_leaves: 'autumn_leaves'
        };
        const paletteDefaultBtn = document.getElementById('paletteDefaultBtn');

        function updatePaletteDefaultBtn() {
            const def = STYLE_DEFAULT_PALETTE[styleSelect.value];
            paletteDefaultBtn.disabled = !def || paletteSelect.value === def;
        }

        paletteDefaultBtn.addEventListener('click', () => {
            const def = STYLE_DEFAULT_PALETTE[styleSelect.value];
            if (!def || paletteSelect.value === def) return;
            paletteSelect.value = def;
            paletteSelect.dispatchEvent(new Event('change'));
        });

        styleSelect.addEventListener('change', () => {
            applySizeRangeForContext();
            applyThicknessRangeForStyle();
            const palDef = STYLE_DEFAULT_PALETTE[styleSelect.value];
            if (palDef) paletteSelect.value = palDef;
            updatePaletteDefaultBtn();
            updateColorSliderStep();
            updateColorCountDisplay();
            applySliderMeta();
            if (isGenerated) generatePipes();
        });

        paletteSelect.addEventListener('change', () => {
            updatePaletteDefaultBtn();
            updateColorSliderStep();
            updateColorCountDisplay();
            if (isGenerated) generatePipes();
        });

        // Skips regenerating when a drag only moves the raw slider value but
        // the color count it resolves to hasn't actually changed — otherwise
        // every tiny nudge re-renders for no visible difference. Kept in sync
        // by updateColorCountDisplay() too, so it's accurate after style/
        // palette changes as well as slider drags.
        let lastColorCount = null;

        // The slider itself stays a plain 0-100 range under the hood, but what
        // the user sees is the actual color count that value resolves to for
        // the current palette (simpler than a raw, hard-to-interpret percent).
        function updateColorCountDisplay() {
            lastColorCount = colorCountFromPct(colorPct, palettes[paletteSelect.value].length);
            colorValue.textContent = lastColorCount;
        }

        // A fixed, plain-integer step (rather than a per-palette 100/(n-1)
        // fraction) so the handle's position always lands exactly where it's
        // set — 100/(n-1) is a repeating binary fraction for most palette
        // lengths, and browsers silently re-snap .value to the nearest step
        // multiple, which visibly moved the handle off max after a style
        // switch even though colorCountFromPct still resolved the correct
        // (maximum) count. 100 discrete positions is far more resolution than
        // any palette needs to reach every integer color count while dragging.
        function updateColorSliderStep() {
            colorSlider.step = '1';
            colorSlider.value = Math.round(colorPct * 100);
        }

        colorSlider.addEventListener('input', () => {
            colorPct = parseFloat(colorSlider.value) / 100;
            const count = colorCountFromPct(colorPct, palettes[paletteSelect.value].length);
            colorValue.textContent = count;
            if (count === lastColorCount) return;
            lastColorCount = count;
            if (isGenerated) generatePipes();
        });

        maxStraightSlider.addEventListener('input', (e) => {
            maxStraightValue.textContent = e.target.value;
            if (isGenerated) generatePipes();
        });

        gearSlider.addEventListener('input', (e) => {
            gearValue.textContent = e.target.value;
            if (isGenerated) generatePipes();
        });

        marginSlider.addEventListener('input', (e) => {
            marginValue.textContent = e.target.value;
            if (isGenerated) generatePipes();
        });

        modeSelect.addEventListener('change', () => {
            // Sizes' range/units are the same in both modes now, so its value is
            // deliberately left untouched here — only a style change re-rolls it.
            applySliderMeta();
            if (isGenerated) generatePipes();
        });

        // The visible mode control is a button toggle; it just drives the
        // hidden <select> so all existing mode-change logic keeps working.
        document.querySelectorAll('.mode-toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) return;
                document.querySelectorAll('.mode-toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                modeSelect.value = btn.dataset.mode;
                modeSelect.dispatchEvent(new Event('change'));
            });
        });

        densitySlider.addEventListener('input', (e) => {
            densityValue.textContent = e.target.value;
            if (isGenerated) generatePipes();
        });

        // Dual-thumb "Sizes" slider: two overlapping range inputs with a min
        // gap enforced so they can't cross, plus a highlighted track segment
        // between them.
        const SIZE_MIN_GAP = 10;
        function updateSizeRangeUI() {
            let minV = parseInt(sizeMinSlider.value, 10);
            let maxV = parseInt(sizeMaxSlider.value, 10);
            sizeMinValue.textContent = minV;
            sizeMaxValue.textContent = maxV;
            let lo = parseInt(sizeMinSlider.min, 10), hi = parseInt(sizeMinSlider.max, 10);
            let span = hi - lo;
            let minPct = ((minV - lo) / span) * 100;
            let maxPct = ((maxV - lo) / span) * 100;
            sizeRangeHighlight.style.left = minPct + '%';
            sizeRangeHighlight.style.width = (maxPct - minPct) + '%';
        }
        sizeMinSlider.addEventListener('input', () => {
            let maxV = parseInt(sizeMaxSlider.value, 10);
            if (parseInt(sizeMinSlider.value, 10) > maxV - SIZE_MIN_GAP) {
                sizeMinSlider.value = maxV - SIZE_MIN_GAP;
            }
            updateSizeRangeUI();
            if (isGenerated) generatePipes();
        });
        sizeMaxSlider.addEventListener('input', () => {
            let minV = parseInt(sizeMinSlider.value, 10);
            if (parseInt(sizeMaxSlider.value, 10) < minV + SIZE_MIN_GAP) {
                sizeMaxSlider.value = minV + SIZE_MIN_GAP;
            }
            updateSizeRangeUI();
            if (isGenerated) generatePipes();
        });
        updateSizeRangeUI();

        // Range inputs stay focused after a drag/click ends, which kept the CSS
        // tooltip (:hover, :focus-within) stuck open after the mouse moved away.
        // Blurring on release fixes the mouse case while tab/keyboard focus still
        // shows the tooltip until focus moves elsewhere.
        document.querySelectorAll('.options-row input[type="range"]').forEach(slider => {
            slider.addEventListener('pointerup', () => slider.blur());
        });

        function drawBase(currentStyle = 'illustrated') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (hullPoints.length >= 3) {
                ctx.beginPath();
                ctx.moveTo(hullPoints[0].x, hullPoints[0].y);
                for (let i = 1; i < hullPoints.length; i++) {
                    ctx.lineTo(hullPoints[i].x, hullPoints[i].y);
                }
                ctx.closePath();

                // Background fills based on style
                if (currentStyle === 'illustrated') {
                    ctx.fillStyle = '#e8ecef';
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 4;
                } else if (currentStyle === 'circuit') {
                    ctx.fillStyle = '#8b5a2b';
                    ctx.strokeStyle = '#d4af37';
                    ctx.lineWidth = 6;
                } else if (currentStyle === 'painted_lady') {
                    ctx.fillStyle = '#2d4227'; // Dark organic hillside
                    ctx.strokeStyle = '#1a2b16';
                    ctx.lineWidth = 4;
                } else if (currentStyle === 'ducks') {
                    ctx.fillStyle = '#4facfe'; // Water blue
                    ctx.strokeStyle = '#00f2fe';
                    ctx.lineWidth = 4;
                } else if (currentStyle === 'gears') {
                    ctx.fillStyle = '#1a110a'; // Dark, greasy mechanical void
                    ctx.strokeStyle = '#3d2b1f';
                    ctx.lineWidth = 4;
                } else if (currentStyle === 'christmas') {
                    ctx.fillStyle = '#7a4a1e'; // Gingerbread dough
                    ctx.strokeStyle = '#c0392b'; // Candy-cane red trim
                    ctx.lineWidth = 6;
                } else if (currentStyle === 'coins') {
                    ctx.fillStyle = '#2b1d10'; // Dark wooden display tray
                    ctx.strokeStyle = '#d4af37'; // Gold trim
                    ctx.lineWidth = 5;
                } else if (currentStyle === 'gems') {
                    ctx.fillStyle = '#1a0f2e'; // Dark velvet jewelry box
                    ctx.strokeStyle = '#9966cc';
                    ctx.lineWidth = 5;
                } else if (currentStyle === 'buttons') {
                    ctx.fillStyle = '#e8ddc7'; // Cream sewing-box fabric
                    ctx.strokeStyle = '#8b5a2b'; // Brown thread trim
                    ctx.lineWidth = 5;
                } else if (currentStyle === 'autumn_leaves') {
                    ctx.fillStyle = '#4a3520'; // Damp forest-floor mulch
                    ctx.strokeStyle = '#2e2013';
                    ctx.lineWidth = 5;
                } else {
                    ctx.fillStyle = '#111';
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 2;
                }

                ctx.fill();
                ctx.stroke();
            }
        }

        function drawHandles() {
            if (!isEditMode) return;
            ctx.fillStyle = 'rgba(0, 122, 204, 0.8)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            rawPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
        }

        function calculateConvexHull(points) {
            if (points.length <= 3) return points;
            const uniquePoints = points.filter((p, index, self) =>
                index === self.findIndex((t) => (t.x === p.x && t.y === p.y))
            );

            const sorted = [...uniquePoints].sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

            const lower = [];
            for (let p of sorted) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
                lower.push(p);
            }

            const upper = [];
            for (let i = sorted.length - 1; i >= 0; i--) {
                let p = sorted[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
                upper.push(p);
            }

            upper.pop(); lower.pop();
            return lower.concat(upper);
        }

        function pointInPolygon(point, vs) {
            let x = point.x, y = point.y;
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].x, yi = vs[i].y;
                let xj = vs[j].x, yj = vs[j].y;
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function distToSegmentSquared(p, v, w) {
            let l2 = (w.x - v.x) * (w.x - v.x) + (w.y - v.y) * (w.y - v.y);
            if (l2 === 0) return (p.x - v.x)*(p.x - v.x) + (p.y - v.y)*(p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            let projX = v.x + t * (w.x - v.x);
            let projY = v.y + t * (w.y - v.y);
            return (p.x - projX)*(p.x - projX) + (p.y - projY)*(p.y - projY);
        }

        function distanceToPolygon(p, poly) {
            let minDist2 = Infinity;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let d2 = distToSegmentSquared(p, poly[j], poly[i]);
                if (d2 < minDist2) minDist2 = d2;
            }
            return Math.sqrt(minDist2);
        }

        // Offset-polygon engine: shrinks (dist > 0) or grows (dist < 0) a convex
        // polygon by `dist` pixels, regardless of vertex winding or shape.
        // Works by shifting each edge along its inward normal (found relative to
        // the centroid) then re-intersecting consecutive shifted edges.
        function offsetPolygon(poly, dist) {
            if (!dist || poly.length < 3) return poly.slice();
            const n = poly.length;
            const centroid = poly.reduce((acc, p) => ({ x: acc.x + p.x / n, y: acc.y + p.y / n }), { x: 0, y: 0 });

            const offsetLines = [];
            for (let i = 0; i < n; i++) {
                let p1 = poly[i], p2 = poly[(i + 1) % n];
                let dx = p2.x - p1.x, dy = p2.y - p1.y;
                let len = Math.hypot(dx, dy);
                if (len === 0) { offsetLines.push({ p1, p2 }); continue; }

                let normal = { x: -dy / len, y: dx / len };
                let mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
                let toCentroid = { x: centroid.x - mid.x, y: centroid.y - mid.y };
                let inward = (normal.x * toCentroid.x + normal.y * toCentroid.y) > 0 ? normal : { x: -normal.x, y: -normal.y };

                offsetLines.push({
                    p1: { x: p1.x + inward.x * dist, y: p1.y + inward.y * dist },
                    p2: { x: p2.x + inward.x * dist, y: p2.y + inward.y * dist }
                });
            }

            function lineIntersect(a1, a2, b1, b2) {
                let d1x = a2.x - a1.x, d1y = a2.y - a1.y;
                let d2x = b2.x - b1.x, d2y = b2.y - b1.y;
                let denom = d1x * d2y - d1y * d2x;
                if (Math.abs(denom) < 1e-9) return { x: (a2.x + b1.x) / 2, y: (a2.y + b1.y) / 2 };
                let t = ((b1.x - a1.x) * d2y - (b1.y - a1.y) * d2x) / denom;
                return { x: a1.x + d1x * t, y: a1.y + d1y * t };
            }

            const result = [];
            for (let i = 0; i < n; i++) {
                let prev = offsetLines[(i - 1 + n) % n];
                let curr = offsetLines[i];
                result.push(lineIntersect(prev.p1, prev.p2, curr.p1, curr.p2));
            }
            return result;
        }

        // Builds a cumulative-length representation of a polygon's perimeter
        // so points can be sampled evenly along it.
        function buildPerimeterPath(poly) {
            const segments = [];
            let total = 0;
            const n = poly.length;
            for (let i = 0; i < n; i++) {
                let p1 = poly[i], p2 = poly[(i + 1) % n];
                let len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                segments.push({ p1, p2, len, start: total });
                total += len;
            }
            return { segments, total };
        }

        // Returns { x, y, angle } at arc-length `dist` along the perimeter path.
        // `angle` is the tangent direction of travel at that point.
        function pointAtDistance(path, dist) {
            let d = path.total > 0 ? ((dist % path.total) + path.total) % path.total : 0;
            for (let seg of path.segments) {
                if (d <= seg.start + seg.len) {
                    let t = seg.len === 0 ? 0 : (d - seg.start) / seg.len;
                    return {
                        x: seg.p1.x + (seg.p2.x - seg.p1.x) * t,
                        y: seg.p1.y + (seg.p2.y - seg.p1.y) * t,
                        angle: Math.atan2(seg.p2.y - seg.p1.y, seg.p2.x - seg.p1.x)
                    };
                }
            }
            let last = path.segments[path.segments.length - 1];
            return { x: last.p2.x, y: last.p2.y, angle: Math.atan2(last.p2.y - last.p1.y, last.p2.x - last.p1.x) };
        }

        // Returns true only if a rigid, straight component of full length
        // `span` can sit at arc-length `dist` without any part of it crossing
        // into an adjacent segment — checking both that the segment is
        // actually long enough to contain it (a short edge, like one of the
        // Circle preset's 32 sides, can be shorter than the component itself,
        // in which case NO position on it works) and that `dist` has room on
        // both sides once it does fit.
        function fitsWithoutCrossingCorner(path, dist, span) {
            let d = path.total > 0 ? ((dist % path.total) + path.total) % path.total : 0;
            for (let seg of path.segments) {
                if (d <= seg.start + seg.len) {
                    if (seg.len < span) return false;
                    let clearance = Math.min(d - seg.start, seg.start + seg.len - d);
                    return clearance >= span / 2;
                }
            }
            return true;
        }

        function drawGear(cx, cy, radius, color, innerColor, teeth, isStacked = false) {
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';

            ctx.beginPath();
            let innerR = radius * 0.75;
            for (let i = 0; i < teeth; i++) {
                let a1 = (i / teeth) * Math.PI * 2;
                let a2 = ((i + 0.4) / teeth) * Math.PI * 2;
                let a3 = ((i + 0.6) / teeth) * Math.PI * 2;
                let a4 = ((i + 1.0) / teeth) * Math.PI * 2;

                if (i === 0) ctx.moveTo(cx + Math.cos(a1)*radius, cy + Math.sin(a1)*radius);
                else ctx.lineTo(cx + Math.cos(a1)*radius, cy + Math.sin(a1)*radius);

                ctx.lineTo(cx + Math.cos(a2)*radius, cy + Math.sin(a2)*radius);
                ctx.lineTo(cx + Math.cos(a3)*innerR, cy + Math.sin(a3)*innerR);
                ctx.lineTo(cx + Math.cos(a4)*innerR, cy + Math.sin(a4)*innerR);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill(); ctx.stroke();

            if (innerColor && innerColor !== color) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = innerColor;
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = color === '#d4af37' ? '#bdc3c7' : '#d4af37';
                ctx.fill(); ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.32, 0, Math.PI * 2);
            ctx.fillStyle = '#e8ecef';
            ctx.fill(); ctx.stroke();

            if (teeth > 8 && !isStacked) {
                for (let i = 0; i < 4; i++) {
                    let a = (i / 4) * Math.PI * 2 + Math.PI/4;
                    ctx.beginPath();
                    ctx.arc(cx + Math.cos(a)*radius*0.5, cy + Math.sin(a)*radius*0.5, radius*0.12, 0, Math.PI*2);
                    ctx.fillStyle = '#e8ecef';
                    ctx.fill(); ctx.stroke();
                }
            }

            if (isStacked) {
                let stackedRadius = radius * 0.55;
                let stackedColor = color === '#d4af37' ? '#bdc3c7' : '#d4af37';
                drawGear(cx, cy, stackedRadius, stackedColor, null, Math.max(6, Math.floor(teeth/2)), false);
            } else {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.18, 0, Math.PI * 2);
                ctx.fillStyle = '#7f8c8d';
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = color === '#d4af37' ? '#d4af37' : '#bdc3c7';
                ctx.fill(); ctx.stroke();
            }
        }

        // New function to draw varied houses
        function drawHouse(ctx, x, y, width, height, color, roofColor, hash) {
            let yBase = y;
            let hType = hash % 4; // 4 types of houses

            ctx.fillStyle = color;
            ctx.strokeStyle = '#222'; // Darker outline
            ctx.lineWidth = 1;

            // Main Body
            ctx.fillRect(x - width / 2, yBase - height, width, height);
            ctx.strokeRect(x - width / 2, yBase - height, width, height);

            // Roof
            ctx.fillStyle = roofColor;
            ctx.beginPath();
            if (hType === 0) { // Slanted Roof
                ctx.moveTo(x - width / 2, yBase - height);
                ctx.lineTo(x + width / 2, yBase - height - width * 0.3);
                ctx.lineTo(x + width / 2, yBase - height);
                ctx.closePath();
            } else if (hType === 1) { // Peaked Roof
                ctx.moveTo(x - width / 2, yBase - height);
                ctx.lineTo(x, yBase - height - width * 0.5);
                ctx.lineTo(x + width / 2, yBase - height);
                ctx.closePath();
            } else if (hType === 2) { // Flat Roof with parapet
                ctx.rect(x - width / 2, yBase - height - width * 0.1, width, width * 0.1);
            } else { // Mansard-like
                ctx.moveTo(x - width / 2, yBase - height);
                ctx.lineTo(x - width * 0.3, yBase - height - width * 0.3);
                ctx.lineTo(x + width * 0.3, yBase - height - width * 0.3);
                ctx.lineTo(x + width / 2, yBase - height);
                ctx.closePath();
            }
            ctx.fill();
            ctx.stroke();

            // Windows and Door
            let windowColor = '#add8e6'; // Light blue
            let doorColor = '#6b4226'; // Brown
            let numWindows = 1 + (hash % 3);
            let winW = width * 0.2;
            let winH = height * 0.2;
            let doorW = width * 0.25;
            let doorH = height * 0.3;

            // Door (sometimes on left, sometimes on right)
            let doorX = (hash % 2 === 0) ? (x - width / 2 + width * 0.1) : (x + width / 2 - width * 0.1 - doorW);
            ctx.fillStyle = doorColor;
            ctx.fillRect(doorX, yBase - doorH, doorW, doorH);
            ctx.strokeRect(doorX, yBase - doorH, doorW, doorH);


            // Windows
            ctx.fillStyle = windowColor;
            for (let i = 0; i < numWindows; i++) {
                // Simple grid of windows
                let winX = x - width / 2 + width * 0.15 + (i % 2) * width * 0.4;
                let winY = yBase - height * 0.7 + Math.floor(i / 2) * height * 0.3;
                if (numWindows === 1) { winX = x - winW / 2; winY = yBase - height*0.6; }

                ctx.fillRect(winX, winY, winW, winH);
                ctx.strokeRect(winX, winY, winW, winH);
            }
        }

        function drawDuck(ctx, x, y, size, color, angle, hash) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Tail
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-size*0.8, 0);
            ctx.lineTo(-size*1.2, -size*0.3);
            ctx.lineTo(-size*0.7, size*0.3);
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(size * 0.6, -size * 0.4, size * 0.55, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Beak (Orange)
            ctx.fillStyle = '#FF9800';
            ctx.beginPath();
            ctx.moveTo(size * 0.9, -size * 0.3);
            ctx.lineTo(size * 1.5, -size * 0.2);
            ctx.lineTo(size * 0.9, -size * 0.1);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(size * 0.7, -size * 0.5, size * 0.08, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.beginPath();
            ctx.ellipse(0, size*0.1, size*0.5, size*0.25, Math.PI*0.05, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.stroke();

            ctx.restore();
        }

        function drawLilypad(ctx, cx, cy, size, hash) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((hash % 360) * Math.PI / 180);
            ctx.beginPath();
            let notch = 0.5;
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, size, notch, Math.PI * 2 - notch);
            ctx.closePath();
            ctx.fillStyle = (hash % 2 === 0) ? '#2e7d32' : '#388e3c';
            ctx.fill();
            ctx.strokeStyle = '#1b5e20';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        function drawLotus(ctx, cx, cy, radius, palette) {
            ctx.save();
            ctx.translate(cx, cy);
            let petals = 8;
            for (let i = 0; i < petals; i++) {
                let a = (i / petals) * Math.PI * 2;
                ctx.save();
                ctx.rotate(a);
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.5, radius * 0.25, radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = palette[i % palette.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.stroke();
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#f4d03f';
            ctx.fill();
            ctx.strokeStyle = '#b8860b';
            ctx.stroke();
            ctx.restore();
        }

        function drawCookieStar(ctx, x, y, size, color, angle, hash) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            let spikes = 5, outer = size, inner = size * 0.45;
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                let r = i % 2 === 0 ? outer : inner;
                let a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                let px = Math.cos(a) * r, py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#7a4a1e';
            ctx.lineWidth = Math.max(size * 0.08, 1);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            for (let i = 0; i < spikes; i++) {
                let a = (i / spikes) * Math.PI * 2 - Math.PI / 2;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * outer * 0.5, Math.sin(a) * outer * 0.5, size * 0.12, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // `angle` is the shape's own rotation (0 = upright). Callers that want
        // tangential border alignment must add Math.PI / 2 themselves before
        // passing it in, since upright "up" is local -y, not local +x.
        function drawGingerbreadMan(ctx, x, y, size, color, angle, hash) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.strokeStyle = '#5c3a1e';
            ctx.lineWidth = Math.max(size * 0.06, 1);

            ctx.beginPath();
            ctx.arc(0, -size * 1.3, size * 0.4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, -size * 0.5, size * 0.45, size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(-size * 0.65, -size * 0.7, size * 0.5, size * 0.18, -0.4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(size * 0.65, -size * 0.7, size * 0.5, size * 0.18, 0.4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(-size * 0.3, size * 0.3, size * 0.2, size * 0.55, 0.15, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(size * 0.3, size * 0.3, size * 0.2, size * 0.55, -0.15, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.beginPath(); ctx.arc(-size * 0.15, -size * 1.35, size * 0.05, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size * 0.15, -size * 1.35, size * 0.05, 0, Math.PI * 2); ctx.fill();
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, -size * 0.8 + i * size * 0.35, size * 0.06, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawChristmasTreeCookie(ctx, x, y, size, color, angle, hash) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color;
            ctx.strokeStyle = '#0b3d1f';
            ctx.lineWidth = Math.max(size * 0.06, 1);

            ctx.beginPath();
            ctx.moveTo(0, -size * 1.4);
            ctx.lineTo(size * 0.55, -size * 0.6);
            ctx.lineTo(size * 0.3, -size * 0.6);
            ctx.lineTo(size * 0.7, size * 0.1);
            ctx.lineTo(size * 0.4, size * 0.1);
            ctx.lineTo(size * 0.85, size * 0.75);
            ctx.lineTo(-size * 0.85, size * 0.75);
            ctx.lineTo(-size * 0.4, size * 0.1);
            ctx.lineTo(-size * 0.7, size * 0.1);
            ctx.lineTo(-size * 0.3, -size * 0.6);
            ctx.lineTo(-size * 0.55, -size * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#6b4226';
            ctx.fillRect(-size * 0.15, size * 0.75, size * 0.3, size * 0.3);
            ctx.strokeRect(-size * 0.15, size * 0.75, size * 0.3, size * 0.3);

            let ornColors = ['#e74c3c', '#f1c40f', '#3498db', '#ffffff'];
            for (let i = 0; i < 5; i++) {
                let oy = -size * 1.0 + i * size * 0.45;
                let ox = (hash % 2 === 0 ? 1 : -1) * (i % 2) * size * 0.25;
                ctx.beginPath();
                ctx.arc(ox, oy, size * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = ornColors[(hash + i) % ornColors.length];
                ctx.fill();
            }
            ctx.restore();
        }

        function shadeColor(hex, factor) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
            let r = parseInt(c.substring(0, 2), 16);
            let g = parseInt(c.substring(2, 4), 16);
            let b = parseInt(c.substring(4, 6), 16);
            r = Math.min(255, Math.max(0, Math.round(r * factor)));
            g = Math.min(255, Math.max(0, Math.round(g * factor)));
            b = Math.min(255, Math.max(0, Math.round(b * factor)));
            return `rgb(${r},${g},${b})`;
        }

        // Draws `text` as engraved lettering following an arc of the coin's rim,
        // centered on the top (-90°) by default. Each glyph stays upright rather
        // than tangential, which reads better at the small sizes coins render at.
        function drawCoinLegend(ctx, text, radius, fontSize, arc, centerAngle) {
            ctx.save();
            ctx.font = `bold ${fontSize}px Georgia, 'Times New Roman', serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let n = text.length;
            let anglePerChar = n > 1 ? arc / (n - 1) : 0;
            let startAngle = centerAngle - arc / 2;
            for (let i = 0; i < n; i++) {
                let a = startAngle + i * anglePerChar;
                let px = Math.cos(a) * radius, py = Math.sin(a) * radius;
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(a + Math.PI / 2);
                ctx.fillText(text[i], 0, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        const COIN_LEGENDS = ['REPUBLIC', 'LIBERTAS', 'UNITY', 'DOMINION', 'FEDERATION', 'ONE WORLD', 'CONCORDIA', 'UNION'];

        function drawCoin(ctx, x, y, radius, color, hash) {
            ctx.save();
            ctx.translate(x, y);

            // Cast shadow first, in a fixed screen direction, before rotating —
            // real shadows in a coin pile don't spin with the coin.
            ctx.beginPath();
            ctx.arc(radius * 0.1, radius * 0.14, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();

            ctx.rotate((hash % 360) * Math.PI / 180);

            // Simulate wear/tarnish: some coins duller and darker than others
            let wear = (hash % 100) / 100;
            let baseColor = shadeColor(color, 1 - wear * 0.4);
            let legendAlpha = 0.55 - wear * 0.25;

            // Base disc
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.55)';
            ctx.lineWidth = Math.max(radius * 0.06, 1);
            ctx.stroke();

            // Reeded edge
            let ridges = 28;
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = Math.max(radius * 0.04, 0.5);
            for (let i = 0; i < ridges; i++) {
                let a = (i / ridges) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * radius * 0.93, Math.sin(a) * radius * 0.93);
                ctx.lineTo(Math.cos(a) * radius * 0.99, Math.sin(a) * radius * 0.99);
                ctx.stroke();
            }

            // Raised inner rim
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.84, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = Math.max(radius * 0.05, 1);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();

            // Curved legend along the top rim, if there's room to read it
            if (radius > 10) {
                ctx.fillStyle = `rgba(0,0,0,${legendAlpha})`;
                drawCoinLegend(ctx, COIN_LEGENDS[hash % COIN_LEGENDS.length], radius * 0.68, Math.max(radius * 0.16, 4), Math.PI * 0.85, -Math.PI / 2);
            }

            // Center emblem
            let type = hash % 5;
            ctx.fillStyle = `rgba(0,0,0,${legendAlpha + 0.1})`;
            ctx.strokeStyle = `rgba(0,0,0,${legendAlpha + 0.1})`;
            ctx.lineWidth = Math.max(radius * 0.05, 1);
            if (type === 0) {
                // Profile bust: a rough head-and-shoulders silhouette
                ctx.beginPath();
                ctx.arc(-radius * 0.05, -radius * 0.22, radius * 0.26, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-radius * 0.38, radius * 0.15);
