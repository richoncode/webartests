<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 3: Spiral Dither View — Halftone CMYK</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap');
    
    body {
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }

    canvas { image-rendering: pixelated; }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
    }

    .back-link { transition: transform 0.2s; }
    .back-link:hover { transform: translateX(-4px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline Lucide Icons ---
    const Icon = ({ children, size = 16, className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const Settings = (p) => <Icon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const RefreshCw = (p) => <Icon {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></Icon>;
    const Zap = (p) => <Icon {...p}><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></Icon>;
    const Layers = (p) => <Icon {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></Icon>;
    const Sliders = (p) => <Icon {...p}><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></Icon>;
    const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>;
    const Target = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
    const Maximize2 = (p) => <Icon {...p}><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></Icon>;
    const Minimize2 = (p) => <Icon {...p}><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" x2="21" y1="10" y2="3"/><line x1="3" x2="10" y1="21" y2="14"/></Icon>;
    const Activity = (p) => <Icon {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></Icon>;
    const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
    const ChevronLeft = (p) => <Icon {...p}><path d="m15 18-6-6 6-6"/></Icon>;

    const App = () => {
      // --- State Management ---
      const [lpi, setLpi] = useState(100); 

      useEffect(() => {
        const stored = localStorage.getItem('halftone_cmyk_session');
        if (stored) {
          try {
            const data = JSON.parse(stored);
            if (data.lpi) setLpi(data.lpi);
          } catch (e) { console.error("Session parse error", e); }
        }
      }, []);
      const [tonalValue, setTonalValue] = useState(50); 
      const [innerLpcm, setInnerLpcm] = useState(847); 
      const [outerLpcm, setOuterLpcm] = useState(847); 
      const [innerPower, setInnerPower] = useState(20); 
      const [outerPower, setOuterPower] = useState(80); 
      const [fragmentation, setFragmentation] = useState(true);
      const [viewMode, setViewMode] = useState('power'); 
      const [randomSeed, setRandomSeed] = useState(1);
      const [isExpanded, setIsExpanded] = useState(false); 
      const [activePointCount, setActivePointCount] = useState(0); 
      const [currentStartAngle, setCurrentStartAngle] = useState(0); 
      const [showLpiPresets, setShowLpiPresets] = useState(false);
      const canvasRef = useRef(null);

      // Constants
      const cellSizeMm = 25.4 / lpi; 
      const CANVAS_SIZE = 800;
      const PADDING = 100;

      const LPI_PRESETS = [
        { label: 'Newsprint', value: 85, desc: 'Coarse stock / Rapid absorption' },
        { label: 'Uncoated Standard', value: 100, desc: 'General stationery / Bond' },
        { label: 'Coated / Magazine', value: 150, desc: 'High-speed web offset' },
        { label: 'Fine Art / Premium', value: 200, desc: 'Sheet-fed / Max detail' },
        { label: 'Ultra Resolution', value: 300, desc: 'Specialized high-fidelity' }
      ];

      // Multi-stop RGB interpolation for Heat Map
      const getHeatColor = (p, alpha) => {
        const stops = [{ r: 37, g: 99, b: 235 }, { r: 34, g: 211, b: 238 }, { r: 239, g: 68, b: 68 }];
        let r, g, b;
        if (p <= 0.5) {
          const t = p * 2;
          r = stops[0].r + (stops[1].r - stops[0].r) * t;
          g = stops[0].g + (stops[1].g - stops[0].g) * t;
          b = stops[0].b + (stops[1].b - stops[0].b) * t;
        } else {
          const t = (p - 0.5) * 2;
          r = stops[1].r + (stops[2].r - stops[1].r) * t;
          g = stops[1].g + (stops[2].g - stops[1].g) * t;
          b = stops[1].b + (stops[2].b - stops[1].b) * t;
        }
        return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${alpha})`;
      };

      const generateSpiral = (centerX, centerY, cellDim, percentage, seed, scale) => {
        const points = [];
        const pseudoRandom = (offset) => {
          const x = Math.sin(seed + offset) * 10000;
          return x - Math.floor(x);
        };
        const targetArea = (cellDim * cellDim) * (percentage / 100);
        const targetRadius = Math.sqrt(targetArea / Math.PI);
        const theta0 = pseudoRandom(0.123) * Math.PI * 2;
        const pitchMm = 10 / innerLpcm;
        const minPossibleRadius = pitchMm / (2 * Math.PI);
        let currentR = minPossibleRadius; 
        let currentTheta = 0;
        const ds = 0.005; 
        if (targetRadius <= minPossibleRadius) return { points: [], targetRadius, minPossibleRadius, theta0 };
        while (currentR <= targetRadius) {
          const t = (currentR - minPossibleRadius) / (Math.max(0.001, targetRadius - minPossibleRadius));
          const angle = theta0 + currentTheta;
          const x = centerX + (currentR * scale) * Math.cos(angle);
          const y = centerY + (currentR * scale) * Math.sin(angle);
          const powerNorm = (innerPower / 100) + t * ((outerPower - innerPower) / 100);
          points.push({ x, y, power: powerNorm, t, r: currentR });
          const localLpcm = innerLpcm + t * (outerLpcm - innerLpcm);
          const dTheta_dr = (2 * Math.PI * localLpcm) / 10;
          const dr = ds / Math.sqrt(1 + Math.pow(currentR * dTheta_dr, 2));
          const dTheta = dTheta_dr * dr;
          const jitter = fragmentation ? (pseudoRandom(currentTheta + 5) - 0.5) * dTheta * 0.6 : 0;
          currentR += dr;
          currentTheta += dTheta + jitter;
          if (points.length > 25000) break;
        }
        return { points, targetRadius, minPossibleRadius, theta0 };
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        const cx = CANVAS_SIZE / 2;
        const cy = CANVAS_SIZE / 2;
        const drawCellSize = CANVAS_SIZE - PADDING * 2;
        const scale = drawCellSize / cellSizeMm;
        ctx.fillStyle = '#050507';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        const { points, targetRadius, minPossibleRadius, theta0 } = generateSpiral(cx, cy, cellSizeMm, tonalValue, randomSeed, scale);
        setActivePointCount(points.length);
        setCurrentStartAngle((theta0 * 180 / Math.PI).toFixed(1));
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - drawCellSize/2, cy - drawCellSize/2, drawCellSize, drawCellSize);
        const drawEndArrow = (pts) => {
          if (pts.length < 2) return;
          const last = pts[pts.length - 1];
          const prev = pts[pts.length - 2];
          const dx = last.x - prev.x;
          const dy = last.y - prev.y;
          const angle = Math.atan2(dy, dx);
          ctx.save();
          ctx.translate(last.x, last.y);
          ctx.rotate(angle);
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-8, -4);
          ctx.lineTo(-8, 4);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };
        if (viewMode === 'power') {
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          const step = Math.max(1, Math.floor(points.length / 4000));
          for (let i = 0; i < points.length - step; i += step) {
            const p1 = points[i];
            const p2 = points[i + step];
            const localLpcm = innerLpcm + p1.t * (outerLpcm - innerLpcm);
            ctx.lineWidth = Math.max(0.6, 120 / localLpcm); 
            ctx.strokeStyle = getHeatColor(p1.power, 0.5 + p1.power * 0.5);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
          drawEndArrow(points);
        } else {
          ctx.lineWidth = 1.2;
          ctx.lineJoin = 'round';
          const step = Math.max(1, Math.floor(points.length / 1500));
          for (let i = 0; i < points.length - step; i += step) {
            const p1 = points[i];
            const p2 = points[i + step];
            ctx.strokeStyle = (i/step) % 2 === 0 ? 'rgba(99, 102, 241, 0.7)' : 'rgba(165, 180, 252, 0.2)';
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            if (points.length < 8000) {
              ctx.fillStyle = '#ef4444';
              ctx.beginPath();
              ctx.arc(p1.x, p1.y, 1.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          drawEndArrow(points);
          ctx.setLineDash([2, 4]);
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
          ctx.beginPath();
          ctx.arc(cx, cy, minPossibleRadius * scale, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }, [lpi, tonalValue, innerLpcm, outerLpcm, innerPower, outerPower, fragmentation, viewMode, randomSeed]);

      return (
        <div className="flex flex-col h-screen bg-zinc-950 text-zinc-100 font-sans overflow-hidden">
          {/* SNUG HEADER */}
          <header className="flex items-center justify-between px-6 py-1.5 border-b border-zinc-800 bg-zinc-900/95 backdrop-blur-md z-30 shrink-0">
            <div className="flex items-center gap-3">
              <div className="p-1 bg-indigo-600 rounded shadow-lg">
                <Target size={14} className="text-white" />
              </div>
              <h1 className="text-sm font-bold tracking-tight italic">
                Laser Halftone Module <span className="text-indigo-400 font-normal">v2.3</span>
              </h1>
            </div>
            <div className="flex bg-zinc-900 rounded-lg p-0.5 border border-zinc-800">
              <button onClick={() => setViewMode('power')} className={`px-4 py-1 rounded text-[10px] font-bold transition-all ${viewMode === 'power' ? 'bg-indigo-600 text-white shadow-sm' : 'text-zinc-400 hover:text-zinc-200'}`}>Power</button>
              <button onClick={() => setViewMode('edges')} className={`px-4 py-1 rounded text-[10px] font-bold transition-all ${viewMode === 'edges' ? 'bg-indigo-600 text-white shadow-sm' : 'text-zinc-400 hover:text-zinc-200'}`}>Edges</button>
            </div>
          </header>

          <main className="flex flex-1 relative overflow-hidden">
            {!isExpanded && (
              <div className="w-80 border-r border-zinc-800 bg-zinc-950 p-6 flex flex-col gap-6 overflow-y-auto shadow-2xl z-20 custom-scrollbar">
                <header className="mb-2">
                  <a href="index.html" className="text-xs text-zinc-500 hover:text-zinc-300 transition-colors flex items-center gap-1 back-link">
                    <ChevronLeft size={12} /> Back to Hub
                  </a>
                </header>

                <section className="space-y-4">
                  <div className="flex items-center gap-2 text-zinc-500"><Sliders size={14} /><span className="text-[10px] uppercase tracking-widest font-black text-zinc-400">Inputs</span></div>
                  <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 space-y-4">
                    
                    {/* LPI SECTION WITH DOWNWARD POP-OUT */}
                    <div className="relative">
                      <div className="flex justify-between mb-2 items-center">
                        <button 
                          onClick={() => setShowLpiPresets(!showLpiPresets)}
                          className="flex items-center gap-1 group relative"
                        >
                          <label className="text-xs font-bold text-indigo-300 cursor-pointer group-hover:text-indigo-200 transition-colors">LPI</label>
                          <ChevronDown size={12} className={`text-indigo-500 transition-transform duration-200 ${showLpiPresets ? 'rotate-180' : ''}`} />
                        </button>
                        <span className="text-sm font-mono text-white">{lpi}</span>
                      </div>

                      {showLpiPresets && (
                        <div className="absolute top-full left-0 w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg shadow-2xl z-50 overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                          <div className="p-2 border-b border-zinc-700 bg-zinc-900/50 flex justify-between items-center">
                            <span className="text-[9px] uppercase font-black text-zinc-500 tracking-widest">Techniques</span>
                            <button onClick={() => setShowLpiPresets(false)} className="text-zinc-500 hover:text-white p-0.5"><Minimize2 size={10}/></button>
                          </div>
                          <div className="max-h-64 overflow-y-auto overscroll-contain">
                            {LPI_PRESETS.map((preset) => (
                              <button
                                key={preset.value}
                                onClick={() => {
                                  setLpi(preset.value);
                                  setShowLpiPresets(false);
                                }}
                                className={`w-full text-left p-3 hover:bg-indigo-600/20 transition-colors border-b border-zinc-700/30 last:border-0 ${lpi === preset.value ? 'bg-indigo-600/10' : ''}`}
                              >
                                <div className="flex justify-between items-center mb-0.5">
                                  <span className="text-[10px] font-bold text-zinc-200">{preset.label}</span>
                                  <span className="text-[10px] font-mono text-indigo-400 font-bold">{preset.value}</span>
                                </div>
                                <p className="text-[8px] text-zinc-500 leading-tight italic">{preset.desc}</p>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <input type="range" min="20" max="300" step="1" value={lpi} onChange={(e) => setLpi(parseInt(e.target.value))} className="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-indigo-400"/>
                    </div>

                    <div>
                      <div className="flex justify-between mb-2"><label className="text-xs font-bold text-indigo-300">Tonal %</label><span className="text-sm font-mono text-white">{tonalValue}%</span></div>
                      <input type="range" min="1" max="100" step="1" value={tonalValue} onChange={(e) => setTonalValue(parseInt(e.target.value))} className="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-indigo-400"/>
                    </div>
                  </div>
                </section>

                <section className="space-y-4">
                  <div className="flex items-center gap-2 text-zinc-500"><Settings size={14} /><span className="text-[10px] uppercase tracking-widest font-black text-zinc-400">Gradients</span></div>
                  <div className="grid grid-cols-2 gap-4">
                    {[['Inner LPCM', innerLpcm, setInnerLpcm], ['Outer LPCM', outerLpcm, setOuterLpcm], ['Inner Pwr', innerPower, setInnerPower], ['Outer Pwr', outerPower, setOuterPower]].map(([label, val, set]) => (
                      <div key={label} className="space-y-1">
                        <label className="text-[9px] font-bold text-zinc-500 uppercase">{label}</label>
                        <input type="number" value={val} onChange={(e) => set(parseInt(e.target.value))} className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs font-mono focus:border-indigo-500 outline-none"/>
                      </div>
                    ))}
                  </div>
                </section>

                {/* COMPACT PATH CONTROL */}
                <div className="flex items-center justify-between p-3 rounded-xl bg-zinc-900 border border-zinc-800 mt-2">
                  <div className="flex items-center gap-4">
                    <div onClick={() => setFragmentation(!fragmentation)} className={`w-10 h-5 rounded-full transition-colors relative cursor-pointer ${fragmentation ? 'bg-indigo-600' : 'bg-zinc-800'}`}>
                      <div className={`absolute top-1 w-3 h-3 bg-white rounded-full transition-transform ${fragmentation ? 'left-6' : 'left-1'}`} />
                    </div>
                    <span className="text-[10px] font-bold uppercase text-zinc-400 tracking-tighter">Dither Path</span>
                  </div>
                  <button 
                    onClick={() => setRandomSeed(Math.random())} 
                    className="p-2 bg-zinc-800 hover:bg-indigo-600 rounded transition-all active:scale-90 text-zinc-400 hover:text-white border border-zinc-700"
                    title="Shuffle Phase"
                  >
                    <RefreshCw size={14} />
                  </button>
                </div>

                <section className="pt-6 border-t border-zinc-800 text-center">
                  <div className="font-mono text-[9px] text-zinc-600 leading-tight">
                    ########################################<br/>
                    # !!! REMINDER: Hard Refresh (Cmd+Shift+R) !!! #<br/>
                    ########################################
                  </div>
                </section>
              </div>
            )}

            <div className="flex-1 bg-black flex flex-col relative overflow-hidden" onClick={() => !isExpanded && setIsExpanded(true)}>
              <div className="absolute top-3 left-3 right-3 flex flex-col gap-1 z-20 pointer-events-none">
                <div className="flex items-center gap-2 h-10 w-full">
                  {isExpanded && (
                    <button onClick={(e) => { e.stopPropagation(); setIsExpanded(false); }} className="w-9 h-9 flex items-center justify-center bg-zinc-900 border border-zinc-800 text-white rounded-lg pointer-events-auto hover:bg-zinc-800 shadow-2xl transition-all active:scale-90"><Minimize2 size={16} /></button>
                  )}
                  <div className={`flex-1 h-9 flex items-center px-3 bg-zinc-900/95 border border-zinc-800 rounded-lg backdrop-blur-md shadow-2xl transition-all ${isExpanded ? 'opacity-100' : 'opacity-80'}`}>
                    <div className="flex items-center justify-between w-full font-mono text-[9px] font-black uppercase tracking-tight text-zinc-400">
                      <div className="flex items-center gap-3 flex-wrap">
                        <div className="flex items-center gap-1"><span className="text-indigo-500">Area</span><span className="text-zinc-100">{((cellSizeMm * cellSizeMm) * (tonalValue/100)).toFixed(4)}<span className="text-[7px] ml-0.5 text-zinc-600">mm²</span></span></div>
                        <div className="w-px h-3 bg-zinc-800" />
                        <div className="flex items-center gap-1"><span className="text-indigo-500">Rad</span><span className="text-zinc-100">{(Math.sqrt((cellSizeMm * cellSizeMm) * (tonalValue/100) / Math.PI)).toFixed(4)}<span className="text-[7px] ml-0.5 text-zinc-600">mm</span></span></div>
                        <div className="w-px h-3 bg-zinc-800" />
                        <div className="flex items-center gap-1"><span className="text-indigo-500">Φ</span><span className="text-emerald-400">{currentStartAngle}°</span></div>
                      </div>
                      <div className="flex items-center gap-3">
                        <div className="w-px h-3 bg-zinc-800" />
                        <div className="flex items-center gap-1"><span className="text-rose-500 font-bold">Min</span><span className="text-zinc-100">{(10/innerLpcm/(2*Math.PI)).toFixed(4)}</span></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className={`ml-[${isExpanded ? '2.5rem' : '0'}] flex items-center h-8 px-4 bg-zinc-900/60 border border-zinc-800/50 rounded-lg backdrop-blur-sm transition-all duration-300 ${isExpanded ? 'w-[calc(100%-2.5rem)]' : 'w-full'}`}>
                  {viewMode === 'power' ? (
                    <div className="flex items-center gap-3 w-full">
                      <span className="text-[8px] font-black text-zinc-500 uppercase tracking-widest shrink-0">Gradient</span>
                      <div className="flex-1 h-1.5 max-w-[200px] rounded-full flex overflow-hidden">
                         <div className="flex-1 h-full" style={{ background: 'linear-gradient(to right, #2563eb, #22d3ee, #ef4444)' }} />
                      </div>
                      <div className="flex items-center gap-2 text-[8px] font-black tracking-tighter uppercase shrink-0">
                        <span className="text-blue-500">{innerPower}%</span>
                        <span className="text-zinc-600 font-bold italic">Ramp</span>
                        <span className="text-red-500">{outerPower}%</span>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-4">
                      <span className="text-[8px] font-black text-zinc-500 uppercase tracking-widest shrink-0">Topology</span>
                      <div className="flex items-center gap-1.5"><div className="h-1.5 w-1.5 rounded-full bg-red-500" /><span className="text-[8px] font-bold text-zinc-300 uppercase italic tracking-tighter">Nodes</span></div>
                      <div className="flex items-center gap-1.5"><div className="h-px w-3 border-t border-dashed border-red-500/50" /><span className="text-[8px] font-bold text-red-500/80 uppercase italic">Bound</span></div>
                    </div>
                  )}
                </div>
              </div>

              <div className="flex-1 flex items-center justify-center cursor-pointer relative">
                <div className="relative group pointer-events-none">
                  <canvas ref={canvasRef} width={CANVAS_SIZE} height={CANVAS_SIZE} className="max-w-full max-h-[75vh] shadow-[0_0_150px_rgba(0,0,0,1)] rounded-lg border border-zinc-800/50 bg-[#050507]"/>
                </div>
              </div>

              <div className="absolute bottom-3 right-3 h-9 flex items-center px-4 bg-zinc-900 border border-zinc-800 rounded-lg backdrop-blur-md shadow-2xl pointer-events-none">
                <div className="flex items-center gap-3 font-mono text-[9px] font-black uppercase tracking-wider">
                  <Activity size={12} className="text-indigo-500" />
                  <div className="flex gap-1 items-center">
                    <span className="text-zinc-500 uppercase text-[8px] tracking-tighter">Nodes:</span>
                    <span className="text-zinc-100">{activePointCount.toLocaleString()}</span>
                  </div>
                  <div className="w-px h-3 bg-zinc-800 mx-1" />
                  <span className="text-[7px] text-zinc-600 uppercase font-black shrink-0">Res: 5μm</span>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
