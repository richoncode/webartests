<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explaining Halftoning — Halftone CMYK</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap');
    
    body {
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }

    canvas { image-rendering: pixelated; }
    
    .back-link { transition: transform 0.2s; }
    .back-link:hover { transform: translateX(-4px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Inline Lucide-style Icons ---
    const Icon = ({ children, size = 24, className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );
    const Target = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
    const Maximize = (p) => <Icon {...p}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></Icon>;
    const Move = (p) => <Icon {...p}><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/></Icon>;
    const RefreshCw = (p) => <Icon {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></Icon>;
    const Microscope = (p) => <Icon {...p}><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0-14 0"/><circle cx="6" cy="11" r="3"/><path d="M9 14h2"/><path d="M12 12h2"/><path d="M12 9V8a2 2 0 0 0-2-2H9"/><path d="M15 13V5a2 2 0 0 0-2-2H9"/></Icon>;
    const Eye = (p) => <Icon {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const ChevronRight = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
    const ChevronLeft = (p) => <Icon {...p}><path d="m15 18-6-6 6-6"/></Icon>;
    const PanelLeftOpen = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/><path d="m14 9 3 3-3 3"/></Icon>;
    const Grid3X3 = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="3" y2="21"/><line x1="15" x2="15" y1="3" y2="21"/></Icon>;
    const ImageIcon = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Icon>;

    const CMYK_CONFIG = [
      { label: 'Cyan', color: '#00FFFF', angle: 15, key: 'c' },
      { label: 'Magenta', color: '#FF00FF', angle: 75, key: 'm' },
      { label: 'Yellow', color: '#EEEE00', angle: 0, key: 'y' },
      { label: 'Black', color: '#000000', angle: 45, key: 'k' },
    ];

    const App = () => {
      const [settings, setSettings] = useState({
        lpi: 85, 
        dotMicrons: { c: 150, m: 150, y: 150, k: 150 }, 
        densities: { c: 50, m: 30, y: 80, k: 10 },
        jitter: 0.15,
        showC: true,
        showM: true,
        showY: true,
        showK: true,
        showGrids: false,
        samplingMode: 'direct', // 'direct', 'pre', 'post'
        intensityMode: 'solid', 
        blendMode: 'multiply'
      });

      const [isDrawing, setIsDrawing] = useState(false);
      const canvasRef = useRef(null);
      const swatchRef = useRef(null);
      const containerRef = useRef(null);
      const swatchContainerRef = useRef(null);
      const plateViewContainerRef = useRef(null);
      const requestRef = useRef(null);

      const pxToMicrons = 20;
      const gridSpacing = (96 / settings.lpi) * 25; 

      const hash = (x, y, salt) => {
        const h = Math.sin(x * 12.9898 + y * 78.233 + salt) * 43758.5453123;
        return h - Math.floor(h);
      };

      const drawLayer = useCallback((ctx, width, height, isThumbnail = false) => {
        if (!width || !height) return;
        const scaleFactor = isThumbnail ? 0.15 : 1; 
        const effectiveSpacing = gridSpacing * scaleFactor;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = settings.blendMode;

        const channels = [
          { active: settings.showC, ...CMYK_CONFIG[0] },
          { active: settings.showM, ...CMYK_CONFIG[1] },
          { active: settings.showY, ...CMYK_CONFIG[2] },
          { active: settings.showK, ...CMYK_CONFIG[3] },
        ];

        channels.forEach((channel, channelIdx) => {
          if (!channel.active) return;

          const angleRad = (channel.angle * Math.PI) / 180;
          const cosA = Math.cos(angleRad);
          const sinA = Math.sin(angleRad);

          const scanSize = Math.sqrt(width * width + height * height) * 1.5;
          const step = effectiveSpacing;

          if (settings.showGrids && !isThumbnail) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = channel.color;
            ctx.lineWidth = 1.2;
            ctx.globalAlpha = 0.6;
            
            for (let u = -scanSize/2; u < scanSize/2; u += step) {
              ctx.beginPath();
              const x1 = u * cosA - (-scanSize/2) * sinA + width / 2;
              const y1 = u * sinA + (-scanSize/2) * cosA + height / 2;
              const x2 = u * cosA - (scanSize/2) * sinA + width / 2;
              const y2 = u * sinA + (scanSize/2) * cosA + height / 2;
              ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            }
            for (let v = -scanSize/2; v < scanSize/2; v += step) {
              ctx.beginPath();
              const x1 = (-scanSize/2) * cosA - v * sinA + width / 2;
              const y1 = (-scanSize/2) * sinA + v * cosA + height / 2;
              const x2 = (scanSize/2) * cosA - v * sinA + width / 2;
              const y2 = (scanSize/2) * sinA + v * cosA + height / 2;
              ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            }
            ctx.restore();
            ctx.globalCompositeOperation = settings.blendMode;
          }

          for (let u = -scanSize/2; u < scanSize/2; u += step) {
            for (let v = -scanSize/2; v < scanSize/2; v += step) {
              let perfectX = u * cosA - v * sinA + width / 2;
              let perfectY = u * sinA + v * cosA + height / 2;
              
              if (perfectX < -step || perfectX > width + step || perfectY < -step || perfectY > height + step) continue;

              let uJitter = 0, vJitter = 0, xJitter = 0, yJitter = 0;
              if (settings.jitter > 0 && settings.samplingMode !== 'direct') {
                const hjx = hash(u, v, channelIdx + settings.jitter * 100);
                const hjy = hash(v, u, channelIdx + settings.jitter * 100 + 1);
                const offX = (hjx - 0.5) * step * settings.jitter;
                const offY = (hjy - 0.5) * step * settings.jitter;
                
                if (settings.samplingMode === 'pre') {
                  uJitter = offX; vJitter = offY;
                  xJitter = offX; yJitter = offY;
                } else {
                  xJitter = offX; yJitter = offY;
                }
              }

              // In the concept module, we use fixed densities, but we'll maintain 
              // the coordinate logic for educational consistency.
              const intensity = settings.densities[channel.key] / 100;

              if (intensity <= 0.01) continue;

              const effectiveDotSize = (settings.dotMicrons[channel.key] / pxToMicrons) * scaleFactor;
              const radius = Math.sqrt(intensity) * (effectiveDotSize / 2);

              if (radius > 0.1) {
                ctx.beginPath();
                ctx.arc(perfectX + xJitter, perfectY + yJitter, radius, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        });
        ctx.globalCompositeOperation = 'source-over';
      }, [settings, gridSpacing]);

      const updateAll = useCallback(() => {
        if (!canvasRef.current || !swatchRef.current) return;
        setIsDrawing(true);

        if (requestRef.current) cancelAnimationFrame(requestRef.current);

        requestRef.current = requestAnimationFrame(() => {
          if (!canvasRef.current || !swatchRef.current) return;
          const mainCtx = canvasRef.current.getContext('2d', { alpha: false });
          const mainScale = window.devicePixelRatio || 1;
          mainCtx.setTransform(mainScale, 0, 0, mainScale, 0, 0);
          drawLayer(mainCtx, canvasRef.current.width / mainScale, canvasRef.current.height / mainScale, false);

          const swatchCtx = swatchRef.current.getContext('2d', { alpha: false });
          const swatchScale = window.devicePixelRatio || 1;
          swatchCtx.setTransform(swatchScale, 0, 0, swatchScale, 0, 0);
          drawLayer(swatchCtx, swatchRef.current.width / swatchScale, swatchRef.current.height / swatchScale, true);

          setIsDrawing(false);
        });
      }, [drawLayer]);

      useEffect(() => {
        const observer = new ResizeObserver(() => {
          if (swatchContainerRef.current && plateViewContainerRef.current && canvasRef.current && swatchRef.current) {
            const dpr = window.devicePixelRatio || 1;
            
            const { clientWidth: sWidth, clientHeight: sHeight } = swatchContainerRef.current;
            swatchRef.current.width = sWidth * dpr;
            swatchRef.current.height = sHeight * dpr;

            const { clientWidth: pWidth, clientHeight: pHeight } = plateViewContainerRef.current;
            canvasRef.current.width = pWidth * dpr;
            canvasRef.current.height = pHeight * dpr;
            
            updateAll();
          }
        });

        if (containerRef.current) observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, [updateAll]);

      useEffect(() => {
        const timer = setTimeout(updateAll, 50);
        return () => clearTimeout(timer);
      }, [settings, updateAll]);

      return (
        <div className="flex h-screen bg-zinc-950 text-zinc-100 font-sans overflow-hidden">
          <aside 
            className="fixed top-0 left-0 bottom-0 w-80 border-r border-zinc-800 bg-zinc-900 flex flex-col shadow-2xl z-50 transition-transform duration-500 ease-in-out transform translate-x-0"
          >
            <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
              <header className="mb-8">
                <div className="mb-4">
                  <a href="index.html" className="text-xs text-zinc-500 hover:text-zinc-300 transition-colors flex items-center gap-1 back-link">
                    <ChevronLeft size={12} /> Back to Hub
                  </a>
                </div>
                <div className="flex items-center justify-between mb-1">
                  <div className="flex items-center gap-2 text-emerald-400">
                    <Microscope size={20} />
                    <h1 className="font-bold tracking-tight uppercase text-sm">Explaining Halftoning</h1>
                  </div>
                  {isDrawing && <RefreshCw size={14} className="animate-spin text-zinc-500" />}
                </div>
                <p className="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Interactive Principles</p>
              </header>

              <div className="space-y-8">
                <section>
                  <h3 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <Move size={12} /> Grid Configuration
                  </h3>
                  <div className="space-y-5">
                    <div>
                      <label className="text-xs flex justify-between mb-2">
                        <span className="text-zinc-400">Lines Per Inch</span>
                        <span className="font-mono text-emerald-400 font-bold">{settings.lpi} LPI</span>
                      </label>
                      <input type="range" min="20" max="150" value={settings.lpi} 
                        onChange={e => setSettings(s => ({...s, lpi: +e.target.value}))}
                        className="w-full accent-emerald-500 bg-zinc-800 h-1 rounded-lg appearance-none cursor-pointer" />
                    </div>
                    
                    <div>
                      <div className="flex justify-between text-[10px] mb-2 uppercase tracking-widest text-zinc-500">
                        <span className="flex items-center gap-1 group relative">
                          Sampling Mode
                          <span className="ml-1 text-zinc-700 cursor-help font-bold">(?)</span>
                          <div className="absolute left-0 bottom-full mb-2 w-48 p-2 bg-zinc-900 border border-zinc-700 rounded-lg text-[9px] font-normal normal-case opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50 shadow-2xl">
                            <p className="text-emerald-400 font-bold mb-1">Expert Intuition:</p>
                            <p className="mb-1"><span className="text-white">Direct:</span> Perfect mathematical grid. Order over organic.</p>
                            <p className="mb-1"><span className="text-white">Pre-Jitter:</span> Samples detail according to jittered center.</p>
                            <p><span className="text-white">Post-Jitter:</span> Mimics head-wobble/mechanical slop. Softer.</p>
                          </div>
                        </span>
                      </div>
                      <div className="flex bg-zinc-950 p-1 rounded-xl border border-zinc-800 gap-1">
                        {['direct', 'pre', 'post'].map(m => (
                          <button 
                            key={m} 
                            onClick={() => setSettings(s => ({...s, samplingMode: m}))}
                            className={`flex-1 py-1.5 rounded-lg text-[9px] font-bold uppercase transition-all ${
                              settings.samplingMode === m ? 'bg-emerald-500 text-zinc-950 shadow-lg shadow-emerald-500/20' : 'text-zinc-500 hover:text-zinc-300'
                            }`}
                          >
                            {m}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs flex justify-between mb-2">
                        <span className="text-zinc-400">Stochastic Jitter</span>
                        <span className="font-mono text-emerald-400 font-bold">{Math.round(settings.jitter * 100)}%</span>
                      </label>
                      <input type="range" min="0" max="1.0" step="0.01" value={settings.jitter} 
                        onChange={e => setSettings(s => ({...s, jitter: +e.target.value}))}
                        className="w-full accent-emerald-500 bg-zinc-800 h-1 rounded-lg appearance-none cursor-pointer" />
                    </div>
                  </div>
                </section>

                <section>
                  <div className="flex items-center justify-between mb-4 mt-2">
                    <h3 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest flex items-center gap-2">
                      <Target size={12} /> CMYK Tonal Densities
                    </h3>
                    <button 
                      onClick={() => setSettings(s => ({...s, showGrids: !s.showGrids}))}
                      className={`flex items-center gap-1.5 px-2 py-1 rounded text-[9px] font-bold transition-all border ${
                        settings.showGrids 
                        ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' 
                        : 'bg-zinc-800 border-zinc-700 text-zinc-500'
                      }`}
                    >
                      <Grid3X3 size={12} />
                      {settings.showGrids ? 'GRIDS ON' : 'GRIDS OFF'}
                    </button>
                  </div>
                  <div className="space-y-4">
                    {CMYK_CONFIG.map(c => (
                      <div key={c.key} className="p-3 bg-zinc-800/50 rounded-xl border border-zinc-800 transition-all hover:bg-zinc-800 hover:border-zinc-700">
                        <div className="flex items-center justify-between gap-3 mb-2.5">
                          <button 
                            onClick={() => setSettings(s => ({...s, [`show${c.key.toUpperCase()}`]: !s[`show${c.key.toUpperCase()}`]}))}
                            className={`flex items-center gap-2 px-2.5 py-1.5 rounded-lg border text-[10px] font-bold transition-all ${
                              settings[`show${c.key.toUpperCase()}`] ? 'bg-zinc-800 border-zinc-600 text-white shadow-lg' : 'opacity-20 border-transparent text-zinc-500'
                            }`}
                          >
                            <div className="w-2.5 h-2.5 rounded-full" style={{backgroundColor: c.color}} />
                            {c.label}
                            <span className="font-mono opacity-60 ml-2">{c.angle}°</span>
                          </button>
                          <span className="font-mono text-[10px] text-emerald-400 font-bold bg-zinc-950 px-2 py-1 rounded border border-emerald-500/20">{settings.densities[c.key]}%</span>
                        </div>
                        <input type="range" min="0" max="100" value={settings.densities[c.key]} 
                          onChange={e => setSettings(s => ({...s, densities: {...s.densities, [c.key]: +e.target.value}}))}
                          className="w-full accent-emerald-500 bg-zinc-900 h-1 rounded-lg appearance-none cursor-pointer" />
                      </div>
                    ))}
                  </div>
                </section>
                
                <section className="pt-6 border-t border-zinc-800 text-center">
                  <div className="font-mono text-[9px] text-zinc-600 leading-tight">
                    ########################################<br/>
                    # !!! REMINDER: Hard Refresh (Cmd+Shift+R) !!! #<br/>
                    ########################################
                  </div>
                </section>
              </div>
            </div>
          </aside>

          <main 
            ref={containerRef} 
            className="flex-1 relative flex flex-col bg-white transition-all duration-500 ease-in-out ml-80"
          >
            <div 
              ref={swatchContainerRef} 
              className="relative h-[180px] w-full border-b border-zinc-300 shadow-sm z-30"
            >
              <canvas ref={swatchRef} className="w-full h-full block" />
              <div className="absolute top-0 left-0 pointer-events-none z-50">
                <div className="bg-zinc-950 text-white border-r border-b border-emerald-500/50 p-4 rounded-br-2xl shadow-2xl min-w-[180px]">
                  <div className="flex items-center gap-2 mb-1.5">
                    <Eye size={14} className="text-emerald-400" />
                    <span className="text-emerald-400 font-black text-[10px] uppercase tracking-[0.2em]">
                      Print View
                    </span>
                  </div>
                  <div className="flex flex-col gap-0.5 text-[9px] font-mono text-zinc-400 border-t border-zinc-800 pt-2">
                     <span className="text-emerald-500/70 font-bold uppercase tracking-widest leading-none">C{settings.densities.c}% M{settings.densities.m}% Y{settings.densities.y}% K{settings.densities.k}%</span>
                     <span className="mt-1 uppercase">Direct Slider Input</span>
                  </div>
                </div>
              </div>
            </div>

            <div 
              ref={plateViewContainerRef}
              className="relative flex-1 bg-zinc-50 overflow-hidden"
            >
              <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" />
              
              <div className="absolute bottom-0 left-0 pointer-events-none z-40">
                <div className="bg-zinc-950 text-white border-r border-t border-emerald-500/50 p-4 rounded-tr-2xl shadow-2xl min-w-[200px]">
                  <div className="flex items-center gap-3 mb-2">
                    <Microscope size={14} className="text-emerald-400" />
                    <div className="flex flex-col leading-[1.1]">
                      <h2 className="text-emerald-400 font-black text-[11px] uppercase tracking-[0.2em]">
                        Concept
                      </h2>
                      <h2 className="text-emerald-400 font-black text-[11px] uppercase tracking-[0.2em]">
                        Magnified
                      </h2>
                    </div>
                  </div>
                  <div className="flex flex-col gap-1.5 text-[9px] font-mono text-zinc-400 border-t border-zinc-800 pt-3">
                     <div className="flex items-center gap-2">
                       <span className="text-zinc-500">ZOOM:</span>
                       <span className="text-zinc-200">Interactive</span>
                     </div>
                     <div className="flex flex-col pt-0.5 leading-tight">
                       <span className="text-emerald-500/80 font-bold uppercase tracking-[0.1em]">Explaining</span>
                       <span className="text-emerald-500/80 font-bold uppercase tracking-[0.1em]">Density</span>
                     </div>
                  </div>
                </div>
              </div>

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
