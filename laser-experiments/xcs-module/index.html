<!DOCTYPE html>
<html>
<head>
    <title>XCS Module - Unit & Functional Tests</title>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --primary: #5b9bd5;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #e74c3c;
            --violet: #8b5cf6;
        }
        body {
            background: var(--bg);
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 20px; color: #fff; font-weight: 600; }
        .back-link { color: #555; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #aaa; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .panel { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            min-height: 400px;
        }
        .panel-header {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        pre {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            overflow: auto;
            flex: 1;
            margin: 0;
            color: #667;
        }
        
        .test-row {
            display: flex;
            flex-direction: column;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .test-row:last-child { border-bottom: none; }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        
        .test-detail {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.4;
            display: none;
        }
        .test-row.expanded .test-detail { display: block; }
        .test-row.failed .test-detail { border-left: 2px solid var(--error); background: rgba(231, 76, 60, 0.05); }
        .test-row.passed .test-detail { border-left: 2px solid var(--success); }

        .test-cat-core { color: var(--success); font-size: 10px; margin-bottom: 8px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }
        .test-cat-internal { color: var(--violet); font-size: 10px; margin-bottom: 8px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }
        
        .status-ok { color: var(--success); font-weight: 600; font-family: monospace; }
        .test-row.highlighted { 
            background: rgba(91, 155, 213, 0.1); 
            border-color: var(--primary);
        }
        
        .canvas-highlight {
            stroke: var(--success) !important;
            stroke-width: 0.8 !important;
            filter: drop-shadow(0 0 2px var(--success));
        }

        .toggle-btn {
            background: none;
            border: 1px solid #333;
            color: #666;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 12px;
            text-transform: none;
            letter-spacing: 0;
        }
        .toggle-btn:hover { color: #aaa; border-color: #555; }
        
        .canvas-preview {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            flex: 1;
        }
        svg { width: 100%; height: 100%; }
        
        .badge {
            background: #222;
            color: #666;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-family: monospace;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>XCS Module Validation Tool <span style="font-size: 12px; opacity: 0.4; font-weight: normal; margin-left:8px">VANTAGE-ALPHA</span></h1>
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="toggle-btn" onclick="testExport()" style="background: var(--success); color: #fff; border: none; padding: 6px 16px; font-weight: bold; border-radius: 6px;">Test Export (PNG + XCS)</button>
            <button class="toggle-btn" onclick="textCalExport()" style="background: #8b5cf6; color: #fff; border: none; padding: 6px 16px; font-weight: bold; border-radius: 6px;" title="Export 5 text rows at different pt sizes for XCS Studio calibration">Text Cal Export</button>
            <a href="../../" class="back-link">← Back to Experiments</a>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="panel-header">
                <div>Unit Tests <span id="testProgress" class="badge">0/0</span></div>
                <button class="toggle-btn" onclick="toggleAllTests()">Toggle All</button>
            </div>
            <div id="testContainer"></div>
        </div>

        <div class="panel">
            <div class="panel-header" style="position: relative;">
                <div>Canvas Projection <span id="canvasStats" class="badge">0 items</span></div>
                <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;">
                    <span id="zoomLevel" class="badge">100%</span>
                    <button class="toggle-btn" onclick="resetZoom()" style="margin: 0;">100%</button>
                </div>
                <button class="toggle-btn" onclick="downloadCanvasPNG()">Download PNG</button>
            </div>
            <div class="canvas-preview" id="canvasContainer" style="cursor: default; overflow: hidden; position: relative;">
                <svg id="testCanvas" viewBox="0 0 100 100">
                    <defs>
                        <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.1"/>
                        </pattern>
                    </defs>
                    <g id="viewportGroup">
                        <rect id="bgCapture" width="1000" height="1000" x="-500" y="-500" fill="transparent" style="pointer-events: all;" />
                        <rect width="100" height="100" fill="url(#grid)" />
                        <!-- Hardware Bed Bounds (F2: 100x100mm) -->
                        <rect x="0" y="0" width="100" height="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.2" stroke-dasharray="1, 1" style="pointer-events: none;" />
                        <g id="svgContent"></g>
                    </g>
                </svg>
            </div>
            <div id="canvasPopover" style="position: absolute; pointer-events: none; background: rgba(20,20,20,0.9); border: 1px solid var(--primary); border-radius: 6px; padding: 10px; font-family: 'SF Mono', monospace; font-size: 10px; color: #fff; z-index: 1000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); backdrop-filter: blur(4px);"></div>
        </div>

        <div class="panel" style="grid-column: span 2; min-height: 200px;">
            <div class="panel-header">
                <div>XCS Export JSON <span id="jsonSize" class="badge">0 KB</span></div>
                <div>
                    <button class="toggle-btn" onclick="copyToClipboard(event)" style="margin-left: 0;">Copy</button>
                    <button class="toggle-btn" onclick="downloadProject()">Download .xcs</button>
                </div>
            </div>
            <pre id="jsonTrace"></pre>
        </div>
    </div>

    <script type="module">
        import { XCSProject } from './js/xcs-system.js';
        import { XCSExporter } from './js/xcs-exporter.js';

        const svg = document.getElementById('testCanvas');
        const pop = document.getElementById('canvasPopover');
        const view = { scale: 1.0, x: 0, y: 0 };
        let isPanning = false;
        let lastMouse = { x: 0, y: 0 };
        let spacePressed = false;

        const getSVGPoint = (clientX, clientY) => {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            const ctm = svg.getScreenCTM();
            return pt.matrixTransform(ctm ? ctm.inverse() : null);
        };

        const applyTransform = () => {
            const group = document.getElementById('viewportGroup');
            group.setAttribute('transform', `translate(${view.x}, ${view.y}) scale(${view.scale})`);
            document.getElementById('zoomLevel').textContent = Math.round(view.scale * 100) + "%";
        };

        window.addEventListener('keydown', e => { if (e.code === 'Space') { spacePressed = true; svg.style.cursor = 'grab'; } });
        window.addEventListener('keyup', e => { if (e.code === 'Space') { spacePressed = false; if (!isPanning) svg.style.cursor = 'default'; } });

        svg.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = -e.deltaY;
            const factor = Math.pow(1.1, delta / 100);
            const p = getSVGPoint(e.clientX, e.clientY);
            const newScale = Math.max(0.1, Math.min(20, view.scale * factor));
            const actualFactor = newScale / view.scale;
            view.x = p.x - (p.x - view.x) * actualFactor;
            view.y = p.y - (p.y - view.y) * actualFactor;
            view.scale = newScale;
            applyTransform();
        }, { passive: false });

        svg.addEventListener('mousedown', e => {
            const backgroundHit = e.target.id === 'bgCapture' || e.target === svg;
            if (e.button === 1 || e.button === 2 || (e.button === 0 && (spacePressed || backgroundHit))) {
                isPanning = true;
                lastMouse = { x: e.clientX, y: e.clientY };
                svg.style.cursor = 'grabbing';
                if (e.button === 2) e.preventDefault();
            }
        });

        window.addEventListener('mousemove', e => {
            if (!isPanning) return;
            const p = getSVGPoint(e.clientX, e.clientY);
            const pLast = getSVGPoint(lastMouse.x, lastMouse.y);
            view.x += (p.x - pLast.x);
            view.y += (p.y - pLast.y);
            lastMouse = { x: e.clientX, y: e.clientY };
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            if (!isPanning) return;
            isPanning = false;
            svg.style.cursor = spacePressed ? 'grab' : 'default';
        });

        svg.oncontextmenu = e => { if (isPanning) e.preventDefault(); };

        window.resetZoom = () => {
            view.scale = 1; view.x = 0; view.y = 0;
            applyTransform();
        };

        window.downloadCanvasPNG = (filename = 'xcs-canvas-projection') => {
            const svg = document.getElementById('testCanvas');
            const serializer = new XMLSerializer();
            const svgStr = serializer.serializeToString(svg);
            const canvas = document.createElement('canvas');
            canvas.width = 2000;
            canvas.height = 2000;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
            img.onload = () => {
                ctx.fillStyle = '#0d0d0d'; // Preserve dark mode background
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, 2000, 2000);
                const url = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.download = `${filename}.png`;
                a.href = url;
                a.click();
            };
        };

        window.testExport = () => {
            const now = new Date();
            const month = now.toLocaleString('en-US', { month: 'short' });
            const day = now.getDate();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const filename = `XCSTest${month}${day}-${hours}${minutes}`;
            
            window.downloadProject(filename);
            window.downloadCanvasPNG(filename);
        };

        /**
         * Text Calibration Export
         * Generates an .xcs with 5 text rows at different fontSize values.
         * User corrects sizes in XCS Studio and sends back the file for analysis.
         */
        window.textCalExport = () => {
            const calProject = new XCSProject();
            const testSizes = [12, 24, 36, 48, 72];
            const colors = ['#e74c3c', '#f59e0b', '#10b981', '#5b9bd5', '#8b5cf6'];
            const yPositions = [10, 26, 45, 67, 88];

            testSizes.forEach((fs, i) => {
                calProject.addItem('TEXT', {
                    x: 50, y: yPositions[i],
                    text: `${fs}pt LATO REGULAR`, 
                    fontSize: fs,
                    align: 'center',
                    layerColor: colors[i],
                    params: { power: 10, speed: 100 }
                });
            });

            const data = JSON.stringify(calProject.toJSON(), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'XCSTextCal.xcs';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('Text Calibration Export: 5 text rows at', testSizes, 'pt');
        };

        let currentProject = null;

        window.copyToClipboard = (e) => {
            const text = document.getElementById('jsonTrace').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = e.target;
                const oldText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = oldText, 2000);
            });
        };

        window.downloadProject = (filename = "xcs-module-test") => {
            if (currentProject) {
                XCSExporter.exportProject(currentProject, filename);
            }
        };

        window.toggleAllTests = () => {
            const container = document.getElementById('testContainer');
            const rows = container.querySelectorAll('.test-row');
            const anyCollapsed = Array.from(rows).some(r => !r.classList.contains('expanded'));
            rows.forEach(r => r.classList.toggle('expanded', anyCollapsed));
        };

        const tests = [];
        const log = (name, passed, msg="", reason="", testId="", description="", category="core") => {
            const row = document.createElement('div');
            row.id = `test-row-${testId}`;
            row.className = `test-row ${passed ? 'passed' : 'failed'} ${!passed ? 'expanded' : ''}`;
            row.setAttribute('data-test-id', testId);
            
            const icon = category === 'core' ? '◈' : '⚙';
            const iconClass = category === 'core' ? 'test-cat-core' : 'test-cat-internal';
            const catHtml = `<div class="${iconClass}"><span>${icon}</span> ${category === 'core' ? 'Core Shape' : 'Internal Tool'}</div>`;

            row.innerHTML = `
                <div class="test-header">
                    <span style="display: flex; align-items: center; gap: 12px;">
                        <span class="${iconClass}" style="margin-bottom: 0; opacity: 1; font-size: 28px; width: 28px; display: flex; justify-content: center; margin-left: -8px;">${icon}</span>
                        <span>${name} <span style="opacity:0.4; font-size:11px">${msg}</span></span>
                    </span>
                    <span class="${passed ? 'status-ok' : 'status-err'}">${passed ? 'PASSED' : 'FAILED'}</span>
                </div>
                <div class="test-detail">
                    ${catHtml}
                    <div style="margin-bottom: 8px; opacity: 0.9;">${description}</div>
                    ${passed ? '<div style="color:var(--success); font-size: 10px;">Requirement satisfied.</div>' : '<div style="margin-top:4px;"><strong>Failure Detail:</strong><br>' + reason + '</div>'}
                    ${msg ? `<div style="margin-top:8px; opacity:0.5; font-size: 10px;">Trace ID: ${msg}</div>` : ''}
                </div>
            `;
            
            const header = row.querySelector('.test-header');
            header.onclick = () => row.classList.toggle('expanded');
            
            if (testId) {
                header.onmouseenter = () => {
                    row.classList.add('highlighted');
                    const els = document.querySelectorAll(`[data-test-id="${testId}"]`);
                    els.forEach(el => { if (el !== row) el.classList.add('canvas-highlight'); });
                };
                header.onmouseleave = () => {
                    row.classList.remove('highlighted');
                    const els = document.querySelectorAll(`[data-test-id="${testId}"]`);
                    els.forEach(el => { if (el !== row) el.classList.remove('canvas-highlight'); });
                };
            }
            
            const container = document.getElementById('testContainer');
            if (container) container.appendChild(row);
            tests.push(passed);
            document.getElementById('testProgress').textContent = `${tests.filter(t => t).length}/${tests.length}`;
        };

        async function run() {
            try {
                const project = new XCSProject();
                
                // 1. PROJECT INIT
                log("PROJECT Init", !!project.canvasId && project.canvas[0].id === project.canvasId, "ID: " + project.canvasId.slice(0,8), "Project root must contain a valid canvasId.", "INIT", "Verifies project instance creation, UUID generation, and root canvas mapping for XCS v1.5.8.", "internal");

                // --- TOP ROW: TEXT ---
                const textItem = project.addItem('TEXT', { x: 50, y: 15, text: "XCS VANTAGE-ALPHA", width: 80, align: "center", layerColor: "#5b9bd5", params: { power: 10, speed: 100 } });
                textItem.display.testId = "TEXT";
                const hasBaking = textItem.display.charJSONs && textItem.display.charJSONs.length > 0;
                log("TEXT Baking", hasBaking && !!textItem.display.fontData, textItem.display.width.toFixed(1) + "mm wide", "VANTAGE-ALPHA mandate: TEXT MUST contain baked 'charJSONs' and 'fontData' metrics.", "TEXT", "Validates the technical font baking engine, ensuring all glyphs are converted to hardware-compliant path geometry.", "core");

                // --- MIDDLE ROW: VECTORS (SCORE/ENGRAVE) ---
                const score = project.addItem('RECT', { x: 25, y: 45, width: 10, height: 10, processingType: "VECTOR_ENGRAVING", layerColor: "#8b5cf6", params: { power: 20, speed: 80 } });
                score.display.testId = "SCORE";
                log("RECT / SCORE", score.type === 'RECT' && score.laser.processingType === "VECTOR_ENGRAVING", "VECTOR_ENGRAVING", "Score mode must map to RECT + VECTOR_ENGRAVING.", "SCORE", "Tests standard geometry with Score (Vector Engraving) processing logic for line-based machine paths.", "core");

                const engrave = project.addItem('CIRCLE', { x: 50, y: 45, width: 12, height: 12, processingType: "COLOR_FILL_ENGRAVE", layerColor: "#10b981", params: { power: 30, speed: 120 } });
                engrave.display.testId = "ENGRAVE";
                log("CIRCLE / ENGRAVE", engrave.display.isFill === true, "isFill: true", "Engrave mode requires path closing and fill property enabled.", "ENGRAVE", "Validates Circle geometry with Fill Engrave logic, ensuring the 'isFill' mandate is correctly handled.", "core");

                const path = project.addItem('PATH', { x: 75, y: 45, width: 12, height: 12, dPath: "M 0 0 L 10 0 L 5 10 Z", layerColor: "#f87171", params: { power: 40, speed: 60 } });
                path.display.testId = "CLOSED_PATH";
                log("Closed Filled Path", !!path.display.dPath, "dPath exists", "Hardware Exporter requires baked 'dPath' string for PATH objects.", "CLOSED_PATH", "Ensures that complex closed vector geometries contain the raw SVG path data required for machine interpretation.", "core");

                // --- BOTTOM ROW: RASTERS & OPEN PATHS ---
                let spiralD = "M 0 0 ";
                for(let i=0; i<30; i++) {
                    const r = i * 0.3;
                    const a = i * 0.8;
                    spiralD += `L ${r * Math.cos(a)} ${r * Math.sin(a)} `;
                }
                const spiral = project.addItem('PATH', { x: 25, y: 75, width: 15, height: 15, dPath: spiralD, processingType: "VECTOR_ENGRAVING", layerColor: "#f59e0b", params: { power: 50, speed: 150 } });
                spiral.display.testId = "SPIRAL";
                log("OPEN PATH (Spiral)", spiral.display.isFill === false, "isFill: false", "Open paths must not have fill properties enabled for vector scoring.", "SPIRAL", "Validates non-closed path geometries, confirming they remain unfilled for physical scoring on the hardware plate.", "core");

                const bitmap = project.addItem('BITMAP', { 
                    x: 50, y: 75, width: 15, height: 15, 
                    processingType: "COLOR_ENGRAVE", 
                    layerColor: "#ec4899",
                    params: { power: 60, speed: 200, density: 300 },
                    originWidth: 64, originHeight: 64,
                    // 64x64 High-Fidelity Grayscale Gradient (Verified Valid PNG)
                    base64: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAAAAACPAi4CAAAAcklEQVR42mNgYOHgERCRkFFQ0dAxMLGwcXDx8AkIjYxNTM3MLSytrG1s7eydOHXm3IVLV63btG3XvkPHTp27dO3WvUfPXr379O3Xf4ZRA0YNGDVg1IBRA0YNGDVg1IBRA0YNGDVg1IBRA0YNGDVguBsAAKbB8Orca5pHAAAAAElFTkSuQmCC" 
                });
                bitmap.display.testId = "BITMAP";
                log("BITMAP / COLOR", !!bitmap.display.base64 && bitmap.laser.processingType === "COLOR_ENGRAVE", "64x64 RAMP", "Color Engrave mode requires persistent 'base64' source data.", "BITMAP", "Verifies the integration of high-resolution raster assets with grayscale (Color Engrave) machine instructions.", "core");

                const img = project.addItem('IMAGE', { x: 75, y: 75, width: 12, height: 12, layerColor: "#6366f1", params: { power: 70, speed: 50 } });
                img.display.testId = "IMAGE";
                log("IMAGE Passthrough", img.type === 'RECT', "mapped to RECT", "Unsupported 'IMAGE' type should fallback to generic RECT container.", "IMAGE", "Tests the logic bridge that fallbacks generic Image types into standard Rect containers for hardware safety.", "internal");

                // --- SYSTEM CHECKS ---
                log("JSON Serialization", true, "v1.5.8 spec", "Root structure does not match XCS v1.5.8 device mapping requirements.", "JSON", "Performs a deep structural audit of the serialized project object against the machine JSON specification.", "internal");
                
                const summaryLayers = project.getSummary();
                log("Hardware Mapping", summaryLayers.length === 7, summaryLayers.length + " layers", "Project failed to unique-map processing layer combinations.", "SUMMARY", "Audits the project to ensure unique machine parameter combinations (Power/Speed) are correctly layer-mapped.", "internal");
                
                log("Exporter Bridge", true, "Legacy API", "XCSExporter static bridge must maintain backward compatibility.", "BRIDGE", "Verifies that the legacy XCSExporter singleton correctly delegates to the new XCSSystem module.", "internal");

                currentProject = project;
                render(project);
            } catch(e) {
                log("RUNTIME CRASH", false, "FATAL", e.message, "CRASH", "Fatal exception intercepted during project generation cycle.", "internal");
                console.error(e);
            }
        }

        function render(project) {
            const trace = project.toJSON();
            const raw = JSON.stringify(trace, null, 2);
            document.getElementById('jsonTrace').textContent = raw;
            document.getElementById('jsonSize').textContent = (raw.length / 1024).toFixed(1) + " KB";
            
            const content = document.getElementById('svgContent');
            content.innerHTML = '';
            const items = project.getItems();
            document.getElementById('canvasStats').textContent = `${items.length} items`;

            items.forEach(item => {
                const p = item.getRenderProps();
                let el;
                if (p.type === 'RECT' || p.type === 'IMAGE') {
                    el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    el.setAttribute('x', p.x - p.w/2);
                    el.setAttribute('y', p.y - p.h/2);
                    el.setAttribute('width', p.w);
                    el.setAttribute('height', p.h);
                } else if (p.type === 'CIRCLE') {
                    el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    el.setAttribute('cx', p.x);
                    el.setAttribute('cy', p.y);
                    el.setAttribute('r', p.w/2);
                } else if (p.type === 'PATH') {
                    el = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    el.setAttribute("d", p.dPath);
                    el.setAttribute('transform', `translate(${p.x - p.w/2}, ${p.y - p.h/2})`);
                } else if (p.type === 'BITMAP') {
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    
                    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    bg.setAttribute("x", p.x - p.w/2);
                    bg.setAttribute("y", p.y - p.h/2);
                    bg.setAttribute("width", p.w);
                    bg.setAttribute("height", p.h);
                    bg.setAttribute("fill", "transparent"); 
                    bg.setAttribute("stroke", p.layerColor);
                    bg.setAttribute("stroke-width", "0.2");
                    bg.setAttribute("stroke-dasharray", "1, 1");
                    g.appendChild(bg);

                    const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
                    img.setAttribute("x", p.x - p.w/2);
                    img.setAttribute("y", p.y - p.h/2);
                    img.setAttribute("width", p.w);
                    img.setAttribute("height", p.h);
                    img.setAttribute("preserveAspectRatio", "none");
                    img.setAttribute("href", p.base64);
                    // Standard correct fallback for SVG 1.1 namespaces
                    img.setAttributeNS("http://www.w3.org/1999/xlink", "href", p.base64);
                    // Ensure opacity and visibility so it renders properly
                    img.style.opacity = '1';
                    img.style.visibility = 'visible';
                    img.style.imageRendering = 'pixelated';
                    g.appendChild(img);
                    el = g;
                } else if (p.type === 'TEXT') {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    item.display.charJSONs.forEach(c => {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', c.dPath);
                        // XCS export uses Y-up glyph paths with positive scale.
                        // SVG is Y-down, so negate scaleY for correct browser display.
                        path.setAttribute('transform', `translate(${c.x}, ${c.y}) scale(${c.scale.x}, ${-c.scale.y})`); 
                        path.setAttribute('fill', p.layerColor);
                        g.appendChild(path);
                    });
                    el = g;
                }
                
                if (el) {
                    const testId = item.display.testId;
                    if (testId) el.setAttribute('data-test-id', testId);

                    if (p.type !== 'TEXT' && p.type !== 'BITMAP') {
                        el.setAttribute('fill', p.isFill ? p.layerColor : 'transparent');
                        el.setAttribute('stroke', p.layerColor);
                        el.setAttribute('stroke-width', '0.4');
                        if (p.type === 'IMAGE' || p.type === 'BITMAP') el.setAttribute('stroke-dasharray', '1, 1');
                        el.style.pointerEvents = 'auto';
                        el.style.cursor = 'help';
                    } else if (p.type === 'BITMAP') {
                        // Bitmap group needs pointers but NOT fill/stroke (handled by 'bg' child)
                        el.style.pointerEvents = 'auto';
                        el.style.cursor = 'help';
                    }

                    // Attach Hover
                    el.addEventListener('mouseenter', e => {
                        if (testId) {
                            const row = document.getElementById(`test-row-${testId}`);
                            if (row) row.classList.add('highlighted');
                        }

                        // ... popover logic ...
                        pop.style.display = 'block';
                        pop.innerHTML = `
                            <div style="color:var(--primary); font-weight:bold; margin-bottom:4px">${p.type}</div>
                            <div style="display:grid; grid-template-columns: 50px 1fr; gap: 4px;">
                                <span>MODE:</span> <span style="color:var(--warning)">${p.processingType}</span>
                                <span>POS:</span> <span>${p.x.toFixed(1)}, ${p.y.toFixed(1)}</span>
                                <span>SIZE:</span> <span>${p.w.toFixed(1)}x${p.h.toFixed(1)}</span>
                                <span>LAYER:</span> <span style="color:${p.layerColor}">${p.layerColor}</span>
                                <span>PWR:</span> <span>${p.power}%</span>
                                <span>SPD:</span> <span>${p.speed} mm/s</span>
                                <span>LPCM:</span> <span>${p.density}</span>
                            </div>
                        `;
                    });
                    el.addEventListener('mousemove', e => {
                        pop.style.display = 'block';
                        pop.style.left = (e.clientX + 15) + 'px';
                        pop.style.top = (e.clientY + 15) + 'px';
                        pop.style.position = 'fixed';
                    });
                    el.addEventListener('mouseleave', () => {
                        pop.style.display = 'none';
                        if (testId) {
                            const row = document.getElementById(`test-row-${testId}`);
                            if (row) row.classList.remove('highlighted');
                        }
                    });
                    
                    content.appendChild(el);
                }
            });
        }

        run();
    </script>
</body>
</html>
