<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>iwsdk-app-a</title>
    <script>
      // On GitHub Pages the TypeScript source isn't compiled — redirect to the
      // pre-built dist/. Skip on localhost (Vite dev server handles TS) and
      // skip when already inside /dist/ (to avoid a loop in the built output).
      if (location.hostname !== 'localhost' &&
          location.hostname !== '127.0.0.1' &&
          !location.pathname.includes('/dist/')) {
        location.replace('./dist/');
      }
    </script>
    <style>
      html, body { background: #000; margin: 0; }

      #qr-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
      }
      #qr-modal.visible {
        display: flex;
      }
      #qr-modal-card {
        position: relative;
        background: #fff;
        border-radius: 20px;
        padding: 48px 32px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: min(82vw, 560px);
        box-sizing: border-box;
      }
      #qr-code-large {
        width: 100%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #qr-code-large canvas,
      #qr-code-large img,
      #qr-code-large svg {
        width: 100% !important;
        height: auto !important;
        display: block;
      }
      #qr-modal-card p {
        margin: 0;
        color: #555;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 0.02em;
        text-align: center;
      }
      #qr-close {
        position: absolute;
        top: 12px;
        right: 14px;
        background: none;
        border: none;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: #aaa;
        padding: 4px 8px;
        font-family: sans-serif;
      }
      #qr-close:hover { color: #333; }
    </style>
    <script type="module" crossorigin src="/webartests/iwsdk-app-a/dist/assets/index-BbZ1Dp3u.js"></script>
  </head>
  <body>
    <div id="scene-container"></div>

    <div id="qr-modal">
      <div id="qr-modal-card">
        <button id="qr-close" onclick="hideQRModal()">&#x2715;</button>
        <div id="qr-code-large"></div>
        <p>Scan to open on Quest or another headset</p>
      </div>
    </div>

    <script>
      var _qrReady = false;

      function _generateQR() {
        if (_qrReady) return;
        _qrReady = true;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
        s.onload = function() {
          new QRCode(document.getElementById('qr-code-large'), {
            text: 'https://richoncode.github.io/webartests/iwsdk-app-a/dist/',
            width: 512,
            height: 512,
            colorDark: '#000000',
            colorLight: '#ffffff',
          });
        };
        document.head.appendChild(s);
      }

      function showQRModal() {
        _generateQR();
        document.getElementById('qr-modal').classList.add('visible');
      }
      function hideQRModal() {
        document.getElementById('qr-modal').classList.remove('visible');
      }

      document.getElementById('qr-modal').addEventListener('click', function(e) {
        if (e.target === this) hideQRModal();
      });
    </script>
  </body>
</html>
