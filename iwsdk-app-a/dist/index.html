<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>iwsdk-app-a</title>
    <style>
      #qr-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
      }
      #qr-modal.visible {
        display: flex;
      }
      #qr-modal-card {
        position: relative;
        background: #fff;
        border-radius: 20px;
        padding: 40px 40px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #qr-modal-card p {
        margin: 0;
        color: #555;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        letter-spacing: 0.02em;
        text-align: center;
      }
      #qr-close {
        position: absolute;
        top: 12px;
        right: 14px;
        background: none;
        border: none;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: #aaa;
        padding: 4px 8px;
        font-family: sans-serif;
      }
      #qr-close:hover { color: #333; }
    </style>
    <script type="module" crossorigin src="/webartests/iwsdk-app-a/dist/assets/index-CjHPs4qA.js"></script>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>

    <div id="qr-modal">
      <div id="qr-modal-card">
        <button id="qr-close" onclick="hideQRModal()">&#x2715;</button>
        <div id="qr-code-large"></div>
        <p>Scan to open on Quest or another headset</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
      new QRCode(document.getElementById('qr-code-large'), {
        text: 'https://richoncode.github.io/webartests/iwsdk-app-a/dist/',
        width: 300,
        height: 300,
        colorDark: '#000000',
        colorLight: '#ffffff',
      });

      function showQRModal() {
        document.getElementById('qr-modal').classList.add('visible');
      }
      function hideQRModal() {
        document.getElementById('qr-modal').classList.remove('visible');
      }

      // Click outside card to dismiss
      document.getElementById('qr-modal').addEventListener('click', function(e) {
        if (e.target === this) hideQRModal();
      });
    </script>
  </body>
</html>
