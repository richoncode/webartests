<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Investing — webartests</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
    padding: 60px 24px 80px;
  }
  a.back { display: inline-block; margin-bottom: 40px; color: #555; text-decoration: none; font-size: 14px; }
  a.back:hover { color: #aaa; }
  .page { max-width: 900px; margin: 0 auto; }
  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #5b9bd5; margin-bottom: 8px;
  }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 8px; }
  .lede { color: #888; font-size: 15px; line-height: 1.6; max-width: 640px; margin-bottom: 36px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    align-items: stretch;
  }

  a.report {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 196px;
    padding: 22px;
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    background: var(--grad);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
  }
  a.report:hover, a.report:focus-visible {
    transform: translateY(-4px);
    filter: saturate(1.08) brightness(1.06);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.38);
    outline: none;
  }
  a.report h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.2;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.28);
  }
  a.report p {
    font-size: 14px;
    line-height: 1.45;
    color: #fff;
    background: rgba(8, 8, 8, 0.38);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .open {
    margin-top: auto;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <a class="back" href="../">← Back</a>
  <div class="page">
    <p class="kicker">Reports</p>
    <h1>Investing</h1>
    <p class="lede">How an industry is actually put together. One card per report.</p>
    <div class="grid" id="reports"></div>
  </div>
  <script>
    /*
     * REPORTS — add a card by appending an object, then add the page at href.
     *
     *   href         path from this folder, with a trailing slash
     *   title        card title
     *   description  one line
     *   gradient     CSS linear-gradient(...)
     */
    var reports = [
      {
        href: "oil-vs-ai/",
        title: "Oil vs AI",
        description: "Petroleum and AI as parallel supply chains, and the narrow pipe that sets the pace.",
        gradient: "linear-gradient(135deg, #ffb020 0%, #ff4d3a 48%, #7a5cff 100%)"
      }
    ];

    var mount = document.getElementById("reports");
    reports.forEach(function (report) {
      var card = document.createElement("a");
      card.className = "report";
      card.href = report.href;
      card.style.setProperty("--grad", report.gradient);

      var title = document.createElement("h2");
      title.textContent = report.title;

      var desc = document.createElement("p");
      desc.textContent = report.description;

      var open = document.createElement("span");
      open.className = "open";
      open.textContent = "Open →";

      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(open);
      mount.appendChild(card);
    });
  </script>
</body>
</html>
