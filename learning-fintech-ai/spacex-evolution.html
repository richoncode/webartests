const NODE_BY_ID = Object.fromEntries(NODES.map(n => [n.id, n]));

// When real events cluster too tightly in time to fit side by side at their
// true positions, stagger them into sub-rows within the same lane instead of
// nudging their dates or merging them into one card.
const MIN_GAP_T = NODE_WIDTH / TIME_SCALE;
const NODE_ROW = {};
const ASPECT_ROWS_USED = {};
ASPECTS.forEach(a => {
  const list = NODES.filter(n => n.aspect === a.id).sort((x, y) => x.time - y.time);
  const rowLastTime = [];
  list.forEach(n => {
    let row = rowLastTime.findIndex(t => n.time - t >= MIN_GAP_T);
    if (row === -1) { row = rowLastTime.length; rowLastTime.push(n.time); }
    else { rowLastTime[row] = n.time; }
    NODE_ROW[n.id] = row;
  });
  ASPECT_ROWS_USED[a.id] = Math.max(1, rowLastTime.length);
});

// Lane height is per-aspect, not uniform: a lane only grows tall enough for
// however many sub-rows its own real events actually need.
const ASPECT_HEIGHT = {};
const ASPECT_Y_OFFSET = {};
(() => {
  let cumY = 0;
  ASPECTS.forEach(a => {
    const rows = ASPECT_ROWS_USED[a.id];
    const contentHeight = rows * NODE_HEIGHT + (rows - 1) * ROW_GAP;
    const h = Math.max(BASE_LANE_HEIGHT, contentHeight + LANE_PADDING);
    ASPECT_HEIGHT[a.id] = h;
    ASPECT_Y_OFFSET[a.id] = cumY;
    cumY += h;
  });
})();
const TIMELINE_HEIGHT = ASPECTS.reduce((sum, a) => sum + ASPECT_HEIGHT[a.id], 0);

const VALUATION_RAW = [

  const out = { ...p, confidence: confidenceForT(p.t) };

  STACK_ORDER.forEach(id => {

    out[`${id}_cum_dashed`] = p.t >= LAST_ACTUAL_T ? running : null;

// Per-series {base, top} bands for the stacked area chart — base/top are the
// exact same cumulative values used for the solid/dashed overlay lines, so
// each band's top edge and its overlay line are pixel-identical by
// construction (same numbers, same xForT/yFor calls) rather than two
// independently-computed things that happen to agree.
const COMPOSITE_BANDS = COMPOSITE_RAW.map(row => {
  let running = 0;
  const bands = {};
  STACK_ORDER.forEach(id => {
    const base = running;
    running += row[id];
    bands[id] = { t: row.t, base, top: running };
  });
  return bands;
});

function yScaleFor(maxValue, plotHeight, topPad) {

function ValuationChart() {
  const wrapperRef = useRef(null);

  const maxT = VALUATION_RAW[VALUATION_RAW.length - 1].t;

  const handleMove = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const t = Math.round((e.clientX - rect.left - SIDEBAR_W) / TIME_SCALE);

  const yFor = yScaleFor(VALUATION_MAX * 1.15, CHART_ROW_HEIGHT, 10);

  const forecastPts = VALUATION_DATA.filter(p => p.t >= LAST_ACTUAL_T);
  const areaGen = area().x(d => xForT(d.t)).y0(CHART_ROW_HEIGHT).y1(d => yFor(d.valuation)).curve(curveMonotoneX);
  const lineGen = line().x(d => xForT(d.t)).y(d => yFor(d.valuation)).curve(curveMonotoneX);
  const hoveredRow = hoveredT !== null ? VALUATION_RAW.find(p => p.t === hoveredT) : null;

  // year ruler (was a bare z-index number mismatch, and the tooltip's own

  let tooltipStyle = null;
  if (hoveredRow && wrapperRef.current) {

  );
}

function CompositeChart() {
  const wrapperRef = useRef(null);
  const [hoveredT, setHoveredT] = useState(null);
  const maxT = COMPOSITE_RAW[COMPOSITE_RAW.length - 1].t;

  const handleMove = e => {

  const bandAreaGen = area().x(d => xForT(d.t)).y0(d => yFor(d.base)).y1(d => yFor(d.top)).curve(curveMonotoneX);
  const cumLineGen = line().x(d => xForT(d.t)).y(d => yFor(d.top)).curve(curveMonotoneX);
  const seriesBands = useMemo(() => Object.fromEntries(STACK_ORDER.map(id => [id, COMPOSITE_BANDS.map(row => row[id])])), []);

  let tooltipStyle = null;
  if (hoveredT !== null && wrapperRef.current) {

          <CompositeTooltip t={hoveredT} />
        </div>,
        document.body
      )}

  );
}

/* ------------------------------------------------------------------ */
/* React Flow: lane background + milestone node + hover popout          */
/* ------------------------------------------------------------------ */

function LaneNode({ data }) {
  return <div className="h-full w-full border-t border-slate-800/50" style={{ backgroundColor: data.color + '0d' }} />;
}

const handleDot = "!opacity-0";

function MilestonePopout({ anchorRect, data, id, StatusIcon, statusColor, isCompleted, isBlocked }) {
  // Fixed-position + portaled to document.body so it can never get trapped
  // inside React Flow's transformed viewport (a transform creates its own
  // stacking context, which silently caps any z-index used inside it —
  // that's why this used to render underneath the sticky year ruler).
  //
  // Anchored diagonally off the node's right side (not centered above/below
  // and not directly beside it) so the popout never covers the left/right
  // handles (same-lane edges) or the top/bottom handles (cross-lane edges) —
  // both stay visible, including their hover-highlight animation.
  const POPOUT_W = 256;
  const left = Math.min(anchorRect.right + 14, window.innerWidth - POPOUT_W - 12);
  // Flip based on the node's actual position in the viewport right now (not
  // which lane it's in) — a node can end up near the top of the screen
  // regardless of lane once the page is scrolled.
  const flipBelow = anchorRect.top < 280;
  const style = flipBelow
    ? { position: 'fixed', top: anchorRect.bottom + 14, left }
    : { position: 'fixed', bottom: window.innerHeight - anchorRect.top + 14, left };

  return createPortal(
    <div className="pointer-events-none z-[9999]" style={{ ...style, width: POPOUT_W }}>
      <div className="pointer-events-auto rounded-xl bg-slate-800/95 backdrop-blur border border-slate-700 shadow-2xl p-3.5">
        <div className="flex items-center justify-between mb-2">
          <span
            className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded"
            style={{ backgroundColor: data.color + '26', color: data.color }}
          >
            {data.aspectLabel}
          </span>
          <span className={`flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide ${statusColor}`}>
            <StatusIcon size={11} strokeWidth={2.5} />{data.status}
          </span>
        </div>
        <div className="text-[13.5px] font-semibold text-white mb-1 leading-snug">{data.title}</div>
        {data.date && (
          <div className="text-[10px] text-slate-500 font-mono mb-1.5">{data.date}</div>
        )}
        <div className="text-[11.5px] text-slate-400 leading-snug mb-2.5">{data.desc}</div>
        {isBlocked && data.blockedBy && (
          <div className="flex items-start gap-1.5 mb-2.5 -mt-1 bg-red-950/40 border border-red-900/50 rounded-md px-2 py-1.5">
            <AlertTriangle size={11} className="text-red-400 shrink-0 mt-0.5" />
            <span className="text-[10.5px] text-red-300/90 leading-snug"><span className="font-semibold uppercase tracking-wide text-red-400">Blocked: </span>{data.blockedBy}</span>
          </div>
        )}
        {data.goal && (
          <div className="flex items-start gap-1.5 mb-2.5 -mt-1 bg-sky-950/40 border border-sky-900/50 rounded-md px-2 py-1.5">
            <Target size={11} className="text-sky-400 shrink-0 mt-0.5" />
            <span className="text-[10.5px] text-sky-300/90 leading-snug"><span className="font-semibold uppercase tracking-wide text-sky-400">Goal: </span>{data.goal}</span>
          </div>
        )}
        {data.rev && (
          <div className="flex items-center justify-between border-t border-slate-700/70 pt-2">
            <span className="text-[10px] text-slate-500 uppercase tracking-wide">{data.oneTime ? 'Deal Value' : 'Est. Revenue'}</span>
            <span className="text-[13px] font-bold text-green-400 tabular-nums">{data.rev}{!data.oneTime ? '/yr' : ''}</span>
          </div>
        )}
        {data.sourceUrl ? (
          <a href={data.sourceUrl} target="_blank" rel="noopener noreferrer" className={`flex items-center gap-1 text-[9px] text-sky-400 hover:text-sky-300 underline decoration-sky-700 mt-1 ${!data.rev ? 'border-t border-slate-700/70 pt-2' : ''}`}>
            source ↗
          </a>
        ) : data.relatedUrl ? (
          <a href={data.relatedUrl} target="_blank" rel="noopener noreferrer" className={`flex items-center gap-1 text-[9px] text-slate-400 hover:text-slate-300 underline decoration-slate-600 mt-1 ${!data.rev ? 'border-t border-slate-700/70 pt-2' : ''}`}>
            related ↗ <span className="italic text-slate-600">(topic reference, not a citation for this figure)</span>
          </a>
        ) : (
          <div className={`text-[9px] text-slate-600 italic mt-1 ${!data.rev ? 'border-t border-slate-700/70 pt-2' : ''}`}>illustrative estimate — no external source</div>
        )}
        <div className="text-right text-[11px] text-slate-400 font-mono font-semibold mt-1.5 select-none tracking-wide">{id}</div>
      </div>
      <div className={`w-2.5 h-2.5 bg-slate-800 rotate-45 absolute left-3 ${flipBelow ? 'border-l border-t border-slate-700 -top-[5px]' : 'border-r border-b border-slate-700 -bottom-[5px]'}`} />
    </div>,
    document.body
  );
}

function MilestoneNode({ id, data }) {
  const StatusIcon = STATUS_ICON[data.status] || Clock;
  const statusColor = STATUS_COLOR[data.status] || 'text-slate-400';
  const isCompleted = data.status === 'Completed';
  const isBlocked = data.status === 'Blocked';
  const wrapperRef = useRef(null);
  const [anchorRect, setAnchorRect] = useState(null);

  const handleEnter = () => {
    data.onHover(id);
    if (wrapperRef.current) setAnchorRect(wrapperRef.current.getBoundingClientRect());
  };
  const handleLeave = () => {
    data.onHover(null);
    setAnchorRect(null);
  };

  return (
    <div
      ref={wrapperRef}
      className="group relative"
      style={{ width: NODE_WIDTH }}
      onMouseEnter={handleEnter}
      onMouseLeave={handleLeave}
    >
      <Handle type="target" position={Position.Left} id="left" className={handleDot} />
      <Handle type="source" position={Position.Right} id="right" className={handleDot} />
      <Handle type="target" position={Position.Top} id="top" className={handleDot} />
      <Handle type="source" position={Position.Top} id="top" className={handleDot} />
      <Handle type="target" position={Position.Bottom} id="bottom" className={handleDot} />
      <Handle type="source" position={Position.Bottom} id="bottom" className={handleDot} />

      <div
        className={`relative rounded-lg bg-slate-900 border shadow-lg shadow-black/30 px-3 py-2 transition-colors group-hover:border-slate-600 ${isCompleted ? 'border-slate-800' : 'border-dashed border-slate-700'}`}
        style={{ borderLeft: `4px solid ${data.color}`, minHeight: NODE_HEIGHT }}
      >
        <div className="flex items-center gap-1.5 mb-1">
          <StatusIcon size={12} strokeWidth={2.5} className={statusColor} />
          <span className={`text-[9px] font-bold uppercase tracking-wider ${statusColor}`}>{data.status}</span>
          {!isCompleted && <span className="ml-auto text-[8px] font-semibold uppercase tracking-wider text-slate-600">predicted</span>}
        </div>
        <div className="text-[12.5px] font-medium text-slate-100 leading-tight pr-7">{data.title}</div>
        <span className="absolute bottom-1 right-1.5 text-[8px] leading-none text-slate-600/60 font-mono select-none transition-all duration-150 group-hover:text-[13px] group-hover:text-slate-200 group-hover:bottom-1.5 group-hover:right-2">{id}</span>
      </div>

      {anchorRect && (
        <MilestonePopout
          anchorRect={anchorRect}
          flipBelow={data.flipBelow}
          data={data}
          id={id}
          StatusIcon={StatusIcon}
          statusColor={statusColor}
          isCompleted={isCompleted}
          isBlocked={isBlocked}
        />
      )}
    </div>
  );
}

function DependencyEdge({ id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, style, markerEnd, data }) {
  const [hovered, setHovered] = useState(false);
  const [path, labelX, labelY] = getSmoothStepPath({
    sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition,
    borderRadius: data.borderRadius,
  });
  return (
    <>
      <BaseEdge id={id} path={path} style={style} markerEnd={markerEnd} />
      {data.reason && (
        <path
          d={path}
          fill="none"
          stroke="transparent"
          strokeWidth={16}
          style={{ cursor: 'help' }}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        />
      )}
      {hovered && data.reason && (
        <EdgeLabelRenderer>
          <div
            className="pointer-events-none absolute z-[1000]"
            style={{ transform: `translate(-50%, -50%) translate(${labelX}px, ${labelY}px)` }}
          >
            <div className="rounded-lg bg-slate-800/95 backdrop-blur border border-slate-700 shadow-2xl px-3 py-2 text-[11px] text-slate-200 leading-snug max-w-[230px] text-center">
              {data.reason}
            </div>
          </div>
        </EdgeLabelRenderer>
      )}
    </>
  );
}

const nodeTypes = { milestone: MilestoneNode, lane: LaneNode };
const edgeTypes = { dependency: DependencyEdge };

function LaneLabels() {
  // Each label's outer box spans the full scroll width so its inner sticky
  // child has room to stay pinned to the left edge as the page scrolls right.
  return (
    <div className="absolute top-0 left-0 z-20 h-full pointer-events-none" style={{ width: TOTAL_WIDTH }}>
      {ASPECTS.map(a => (
        <div
          key={a.id}
          className="absolute left-0 right-0"
          style={{ top: ASPECT_Y_OFFSET[a.id] + ASPECT_HEIGHT[a.id] / 2, transform: 'translateY(-50%)' }}
        >
          <div className="sticky left-3 flex items-center gap-2 w-max">
            <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: a.color }} />
            <span className="text-[10.5px] font-semibold uppercase tracking-wide text-slate-300 bg-slate-950/90 px-1.5 py-0.5 rounded backdrop-blur-sm whitespace-nowrap">
              {a.label}
            </span>
          </div>
        </div>
      ))}
    </div>
  );
}

function Timeline() {
  const [hoveredId, setHoveredId] = useState(null);

  const nodes = useMemo(() => {
    const laneNodes = ASPECTS.map((a, i) => ({
      id: `lane-${a.id}`,
      type: 'lane',
      position: { x: 0, y: ASPECT_Y_OFFSET[a.id] },
      data: { color: a.color },
      style: { width: TOTAL_WIDTH, height: ASPECT_HEIGHT[a.id] },
      draggable: false,
      selectable: false,
      zIndex: 0,
    }));
    const milestoneNodes = NODES.map(n => {
      const aspect = ASPECT_BY_ID[n.aspect];
      const rowsUsed = ASPECT_ROWS_USED[n.aspect];
      const contentHeight = rowsUsed * NODE_HEIGHT + (rowsUsed - 1) * ROW_GAP;
      const laneTop = ASPECT_Y_OFFSET[n.aspect] + (ASPECT_HEIGHT[n.aspect] - contentHeight) / 2;
      return {
        id: n.id,
        type: 'milestone',
        position: {
          x: xForT(n.time),
          y: laneTop + NODE_ROW[n.id] * (NODE_HEIGHT + ROW_GAP),
        },
        data: {
          title: n.title, status: n.status, rev: n.rev, desc: n.desc, blockedBy: n.blockedBy, goal: n.goal, date: n.date, oneTime: n.oneTime, sourceUrl: n.sourceUrl, relatedUrl: n.relatedUrl || ASPECT_RELATED_URL[n.aspect],
          color: aspect.color, aspectLabel: aspect.label, onHover: setHoveredId,
          flipBelow: ASPECT_INDEX[n.aspect] === 0,
        },
        style: { width: NODE_WIDTH },
        zIndex: 10,
      };
    });
    return [...laneNodes, ...milestoneNodes];
  }, []);

  // Same-lane dependencies run left->right (horizontal). Cross-lane
  // dependencies run top<->bottom (vertical) so the line actually drops
  // through the swimlanes instead of cutting diagonally across cards.
  const edges = useMemo(() => EDGES.map(e => {
    const sourceNode = NODE_BY_ID[e.source];
    const targetNode = NODE_BY_ID[e.target];
    const sourceAspect = ASPECT_BY_ID[sourceNode.aspect];
    const sIdx = ASPECT_INDEX[sourceNode.aspect];
    const tIdx = ASPECT_INDEX[targetNode.aspect];
    const isActive = hoveredId && (e.source === hoveredId || e.target === hoveredId);
    const isDimmed = hoveredId && !isActive;
    const color = isActive ? sourceAspect.color : '#475569';

    let sourceHandle, targetHandle, borderRadius;
    if (sIdx === tIdx) {
      sourceHandle = 'right'; targetHandle = 'left'; borderRadius = 5;
    } else if (tIdx > sIdx) {
      sourceHandle = 'bottom'; targetHandle = 'top'; borderRadius = 0;
    } else {
      sourceHandle = 'top'; targetHandle = 'bottom'; borderRadius = 0;
    }
    // Per-edge override — for when the default straight-down/up routing
    // would cut through a crowded stack of sub-rows in between.
    if (e.sourceHandle) sourceHandle = e.sourceHandle;
    if (e.targetHandle) targetHandle = e.targetHandle;

    return {
      id: `e-${e.source}-${e.target}`,
      source: e.source,
      target: e.target,
      sourceHandle,
      targetHandle,
      type: 'dependency',
      data: { reason: e.reason, borderRadius },
      animated: !!isActive,
      style: {
        stroke: color,
        strokeWidth: isActive ? 2.5 : 1.5,
        opacity: isDimmed ? 0.08 : (isActive ? 1 : 0.4),
        transition: 'opacity 150ms ease, stroke 150ms ease',
      },
      markerEnd: { type: MarkerType.ArrowClosed, width: 14, height: 14, color },
      zIndex: isActive ? 5 : 1,
    };
  }), [hoveredId]);

  return (
    <div className="relative h-full" style={{ width: TOTAL_WIDTH }}>
      <ReactFlow
        nodes={nodes}
        edges={edges}
        nodeTypes={nodeTypes}
        edgeTypes={edgeTypes}
        defaultViewport={{ x: 0, y: 0, zoom: 1 }}
        minZoom={1}
        maxZoom={1}
        panOnDrag={false}
        panOnScroll={false}
        zoomOnScroll={false}
        zoomOnPinch={false}
        zoomOnDoubleClick={false}
        preventScrolling={false}
        nodesDraggable={false}
        nodesConnectable={false}
        elementsSelectable={false}
        proOptions={{ hideAttribution: true }}
        style={{ width: TOTAL_WIDTH, height: '100%' }}
        className="!bg-slate-950"
      >
        <Background variant="dots" gap={22} size={1} color="#1e293b" />
      </ReactFlow>
      <LaneLabels />
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                  */
/* ------------------------------------------------------------------ */

function App() {
  return (
    <div className="h-screen w-screen flex flex-col bg-slate-950 text-slate-100">
      <header className="shrink-0 flex items-center gap-3 px-5 py-3 border-b border-slate-800/80">
        <Rocket size={18} className="text-slate-400" />
        <div>
          <h1 className="text-[15px] font-bold tracking-tight leading-none">Space Infrastructure &amp; Valuation Timeline</h1>
          <p className="text-[11px] text-slate-500 mt-0.5">Charts and swimlanes share one time axis — scroll horizontally and everything moves together</p>
        </div>
        <div className="ml-auto flex items-center gap-4 text-[10px] text-slate-500">
          <div className="flex items-center gap-3">
            {Object.keys(STATUS_ICON).map(s => {
              const Icon = STATUS_ICON[s];
              return (
                <span key={s} className={`flex items-center gap-1 font-semibold uppercase tracking-wide ${STATUS_COLOR[s]}`}>
                  <Icon size={11} strokeWidth={2.5} />{s}
                </span>
              );
            })}
          </div>
          <div className="w-px h-3 bg-slate-800" />
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border border-slate-500 inline-block" />Completed</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border border-dashed border-slate-500 inline-block" />Predicted</span>
          <div className="w-px h-3 bg-slate-800" />
          <span className="flex items-center gap-1.5"><span className="w-3 h-px bg-slate-400 inline-block" />Actual</span>
          <span className="flex items-center gap-1.5">
            <svg width="14" height="2" className="shrink-0"><line x1="0" y1="1" x2="14" y2="1" stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="3 2" /></svg>
            Est. / Forecast
          </span>
        </div>
      </header>

      <div className="flex-1 min-h-0 overflow-auto px-4 pb-4 pt-3">
        <div className="relative rounded-xl border border-slate-800" style={{ width: TOTAL_WIDTH, minWidth: TOTAL_WIDTH }}>
          <ChartRow icon={Satellite} title="Sector Valuation ($T)" height={CHART_ROW_HEIGHT}>
            <ValuationChart />
          </ChartRow>
          <ChartRow icon={TrendingUp} title="Composite Validation Value ($M)" height={CHART_ROW_HEIGHT}>
            <CompositeChart />
          </ChartRow>
          <YearRuler />
          <div style={{ height: TIMELINE_HEIGHT }}>
            <ReactFlowProvider>
              <Timeline />
            </ReactFlowProvider>
          </div>
          <MarsWindowOverlay />
        </div>
      </div>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
