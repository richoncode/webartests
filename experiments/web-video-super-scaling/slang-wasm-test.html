        <div class="workspace-grid">
            <div class="panel">
                <h2 class="panel-title accent-amber">Slang Source</h2>
                <textarea id="slang-input" class="editor-area" spellcheck="false">[numthreads(16, 16, 1)]
void main(uint3 id : SV_DispatchThreadID) {
    // Basic test kernel
    float2 uv = float2(id.xy) / 1024.0;
    float val = sin(uv.x * 10.0) * cos(uv.y * 10.0);
}</textarea>
                <button id="compile-btn" class="btn-primary">

                <h2 class="panel-title accent-emerald">WGSL Output</h2>
                <pre id="wgsl-output" class="editor-area output-area">// Output will appear here...</pre>

            </div>

        <div class="console-container">
            <div class="console-header">
                <h2 class="panel-title" style="font-size: 15px;">Compiler Console</h2>
                <button id="copy-console-btn" onclick="copyConsole()" class="btn-tiny">
                    Copy Log
                </button>
            </div>
            <pre id="console-output" class="console-log"></pre>
        </div>
    </div>

    <script>
        const slangInput = document.getElementById('slang-input');
        const wgslOutput = document.getElementById('wgsl-output');
        const consoleOutput = document.getElementById('console-output');
        const statusDiv = document.getElementById('status');
        const compileBtn = document.getElementById('compile-btn');

        let slangSession = null;
        let slangModule = null;

        function log(msg, type = 'info') {
            const span = document.createElement('span');
            span.style.color = type === 'error' ? '#f87171' : (type === 'warn' ? '#f59e0b' : '#888');
            span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            consoleOutput.appendChild(span);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            console.log(`[Slang] ${msg}`);
        }

        async function init() {
            log('Initializing Slang-WASM compiler via dynamic import...');
            
            try {
                // Determine path relative to this file
                const slangWasmPath = '../../shared/slang/slang-wasm.js';
                const loadModule = await import(slangWasmPath);
                
                // Initialize the module
                const slang = await loadModule.default({
                    locateFile: (path) => {
                        return `../../shared/slang/${path}`;
                    }
                });

                if (!slang) throw new Error("Could not initialize Slang WASM.");

                log('Slang-WASM module loaded successfully.');
                
                const globalSession = slang.createGlobalSession();
                
                // 15 = slang.CompileTarget.Wgsl
                const targets = slang.getCompileTargets();
                let wgslTargetIndex = -1;
                for (let i = 0; i < targets.length; i++) {
                    if (targets[i].name.toLowerCase() === 'wgsl') {
                        wgslTargetIndex = targets[i].value;
                        break;
                    }
                }

                if (wgslTargetIndex === -1) throw new Error("WGSL target not found in compiler targets.");
                
                slangSession = globalSession.createSession(wgslTargetIndex);
                log('Slang session created for WGSL target.');
                onSuccess();
            } catch (e) {
                log(`Initialization failed: ${e.message}`, 'error');
                statusDiv.innerText = 'Status: Load Error';
                statusDiv.className = 'status-box accent-red';
            }
        }

        function onSuccess() {
            statusDiv.innerText = 'Status: Ready';
            statusDiv.className = 'status-box accent-emerald';
            log('Slang-WASM compiler ready.');
            compileBtn.addEventListener('click', compile);
        }

        async function compile() {
            if (!slangSession) {
                log('Slang session not initialized', 'error');
                return;
            }
            
            const source = slangInput.value;
            log('Compiling Slang source...');
            wgslOutput.textContent = '// Compiling...';
            
            try {
                const startTime = performance.now();
                
                const module = slangSession.loadModuleFromSource(source, "shader", "/user.slang");
                if (!module) throw new Error("Could not load module from source.");

                const entryPoint = module.findEntryPointByName("main");
                if (!entryPoint) throw new Error("Entry point 'main' not found.");

                const composite = slangSession.createCompositeComponentType([module, entryPoint]);
                const code = composite.getTargetCode(0);

                const duration = (performance.now() - startTime).toFixed(2);
                
                wgslOutput.textContent = code;
                log(`Compilation successful in ${duration}ms`);

                // Cleanup
                if (module.delete) module.delete();
                if (entryPoint.delete) entryPoint.delete();
                if (composite.delete) composite.delete();
            } catch (err) {
                wgslOutput.textContent = `// Error:\n${err.message}`;
                log(`Compilation failed: ${err.message}`, 'error');
            }
        }

        window.copyConsole = async function() {
            const text = consoleOutput.innerText;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    textArea.style.top = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
                
                const btn = document.getElementById('copy-console-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = '#065f46';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#2a2a2a';
                }, 2000);
            } catch (err) {
                alert(`Copy failed: ${err.message}`);
            }
        };

        init();
    </script>
