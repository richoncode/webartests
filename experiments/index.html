<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiments — webartests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 60px 24px 80px;
    }
    a.back {
      display: inline-block;
      margin-bottom: 40px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.1s;
    }
    a.back:hover {
      color: #aaa;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 48px;
      max-width: 600px;
      line-height: 1.6;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5b9bd5;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin-bottom: 48px;
    }
    .card-div {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px 28px 22px;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .card-div:hover {
      background: #222;
      border-color: #444;
    }
    .card-icon {
      font-size: 32px;
      margin-bottom: 14px;
    }
    .card-div h2 a {
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
    .card-div h2 a:hover {
      color: #5b9bd5;
    }
    .card-div p {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
      margin-top: 8px;
    }
    .tag {
      display: inline-block;
      margin-top: 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      background: #222;
      border: 1px solid #333;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #222;
    }
    .card-topic {
      font-size: 11px;
      color: #5b9bd5;
      background: #0a1520;
      border: 1px solid #1a3050;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .card-topic:hover {
      background: #132338;
      color: #7db4e0;
    }
  </style>
</head>
<body>
  <a href="../" class="back">← Back</a>
  
  <p class="section-label">R&D Lab</p>
  <h1>Experiments</h1>
  <p class="subtitle">High-fidelity interactive experiments, technical proofs of concept, and architectural research across WebGPU, WebXR, and documentation automation.</p>

  <div class="grid" id="experiments-grid"></div>

  <script src="../shared/js/experiments.js"></script>
  <script>
    // Subpage shows the full catalog (no filter).
    // basePrefix '../' makes the JSON's site-root-relative hrefs work from here.
    renderExperiments({
      jsonUrl: '../shared/data/experiments.json',
      mountSelector: '#experiments-grid',
      basePrefix: '../',
    });
  </script>
</body>
</html>
