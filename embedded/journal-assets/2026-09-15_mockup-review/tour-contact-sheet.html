<!doctype html><meta charset=utf-8><title>tour contact sheet</title><style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.7; min-height: 100vh; padding: 60px 24px 80px; }
  a.back { display: inline-block; margin-bottom: 40px; color: #555; text-decoration: none; font-size: 14px; }
  a.back:hover { color: #aaa; }
  .page { max-width: 900px; }
  h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 15px; line-height: 1.6; max-width: 680px; margin-bottom: 28px; }
  .controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .controls label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
  select, input[type=range] { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 7px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; }
  input[type=range] { padding: 0; width: 120px; }
  .val { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; color: #5b9bd5; min-width: 38px; }
  .tour { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; flex-wrap: wrap; }
  .tour button { background: #1a1a1a; border: 1px solid #333; color: #ccc; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .tour button:hover { border-color: #5b9bd5; color: #fff; }
  .tour .count { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; color: #5b9bd5; min-width: 52px; }
  .tour .what { font-size: 13px; color: #888; }
  .tour .keys { font-size: 11px; color: #555; margin-left: auto; }
  .note { font-size: 13px; color: #666; margin-bottom: 22px; max-width: 680px; }
  .note b { color: #aaa; }
  .frame { display: inline-block; padding: 14px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; }
  .caption { font-size: 12px; color: #555; margin-top: 10px; font-family: 'SF Mono','Fira Code',monospace; }
  .geom { margin-top: 34px; }
  .geom h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .geom p { font-size: 14px; color: #666; margin-bottom: 16px; max-width: 680px; }
  table.g { border-collapse: collapse; font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
  table.g th { text-align: left; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #555; padding: 0 18px 8px 0; border-bottom: 1px solid #262626; }
  table.g td { padding: 6px 18px 6px 0; border-bottom: 1px solid #161616; color: #bbb; }
  table.g td:first-child { color: #5b9bd5; }
  table.g tr.off td { color: #444; }

  /* ── E Ink Spectra 6 palette, approximated until the panel is photographed ── */
  .panel {
    --paper:  #EDEAE2; --ink: #22201E; --red: #C0392B;
    --yellow: #E8C33A; --blue: #2F5597; --green: #4A8B3B;
    position: relative; width: 800px; height: 480px;
    background: var(--paper); color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    line-height: 1.15; overflow: hidden;
  }
  .box { position: absolute; overflow: hidden; }
  .k { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; }
  .rule { background: var(--red); }
  .hrule, .vrule { background: var(--ink); }

  /* Header */
  .hd { background: var(--blue); color: var(--paper); padding: 0 22px; display: flex; align-items: center; justify-content: space-between; }
  .hd-day { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .hd-date { font-size: 14px; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .hd-mid { display: flex; align-items: center; gap: 10px; }
  .hd-now { font-size: 46px; font-weight: 800; letter-spacing: -2px; }
  .hd-cond { font-size: 14px; font-weight: 700; opacity: 0.92; max-width: 120px; }
  .hd-place { font-size: 13px; font-weight: 800; letter-spacing: 1.8px; text-align: right; }
  .hd-sub { font-size: 11px; opacity: 0.85; margin-top: 3px; text-align: right; }

  /* Detail row */
  .cell { padding: 0 16px; display: flex; flex-direction: column; justify-content: center; }
  .peak { background: var(--yellow); }
  .peak-v { font-size: 34px; font-weight: 800; line-height: 1; margin-top: 3px; letter-spacing: -1px; }
  .peak-t { font-size: 12px; font-weight: 700; margin-top: 3px; }
  .sun { background: var(--green); color: var(--paper); }
  .sun-v { font-size: 20px; font-weight: 800; margin-top: 4px; }
  .air-row { display: flex; gap: 9px; align-items: baseline; margin-top: 3px; }
  .air-v { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .air-b { font-size: 13px; font-weight: 800; letter-spacing: 0.8px; }
  .air-pm { font-size: 11px; font-weight: 700; opacity: 0.72; margin-left: auto; }
  .air-chip { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; padding: 3px 8px;
              border: 2px solid var(--ink); }
  .air-bar { height: 6px; margin-top: 6px; display: flex; gap: 2px; }
  .air-bar div { flex: 1; }

  /* Forecast strip */
  .fc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  .fc.today { background: var(--yellow); }
  .fc-d { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
  .fc-t { display: flex; align-items: baseline; gap: 7px; }
  .fc-hi { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .fc-lo { font-size: 15px; font-weight: 700; color: var(--blue); }
  .fc-p { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--blue); }
  .fc-p.dry { color: rgba(34,32,30,0.38); }

  /* Bands */
  .evt { background: var(--green); color: var(--paper); padding: 0 22px; display: flex;
    align-items: center; gap: 12px; overflow: hidden; }
  .evt-txt { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
  /* Half width drops a size, the way drawEvent's three-step shrink does. */
  .half .evt-txt { font-size: 15px; }
  .half .evt-txt.long { font-size: 12px; }
  .half .bin-txt { font-size: 15px; }
  .half .bin-sub { display: none; }
  .bin { background: var(--red); color: var(--paper); padding: 0 22px; display: flex; align-items: center; gap: 11px; }
  .bin-txt { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .bin-sub { font-size: 13px; font-weight: 700; opacity: 0.9; margin-left: auto; }
  .lch { background: var(--blue); color: var(--paper); padding: 0 22px; display: flex; align-items: center; gap: 12px; }
  .lch-txt { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; letter-spacing: -0.3px; }
  .lch-sub { font-size: 12px; font-weight: 700; opacity: 0.92; margin-top: 2px; }
  .lch-mid { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .lch-time { font-size: 25px; font-weight: 800; text-align: right; width: 168px; }
  .lch-tz { font-size: 11px; font-weight: 700; opacity: 0.85; }
  /* Reserved slot, not tucked after the mission name — that put it on the text. */
  .chance { flex: 0 0 auto; min-width: 92px; text-align: right; font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .quote { background: var(--paper); color: var(--ink); padding: 0 22px; display: flex; flex-direction: column;
    justify-content: center; border-left: 6px solid var(--blue); }
  .q-txt { font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-who { font-size: 12px; font-weight: 700; opacity: 0.6; text-align: right; margin-top: 3px; }
  .prime { flex: 0 0 auto; width: 58px; text-align: center; background: var(--yellow); color: var(--ink);
           font-size: 10px; font-weight: 800; letter-spacing: 1.2px; padding: 4px 0;
           border: 2px solid var(--ink); border-radius: 11px; }

  /* Footer */
  .ft { padding: 0 22px; display: flex; align-items: center; gap: 16px; }
  .bat-body { width: 92px; height: 32px; border: 4px solid var(--ink); border-radius: 5px; padding: 3px; display: flex; gap: 3px; }
  .bat-cap { width: 6px; height: 14px; background: var(--ink); border-radius: 0 3px 3px 0; }
  .seg { flex: 1; }
  .bat-pct { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .bat-info { flex: 1; min-width: 0; }
  .bat-v { font-size: 18px; font-weight: 800; }
  .run-n { font-size: 17px; font-weight: 800; }
  .run-l { font-size: 12px; font-weight: 700; }
  .src { padding: 0 22px; display: flex; align-items: center; justify-content: flex-end;
    font-size: 11px; font-weight: 700; color: #6b6862; letter-spacing: 0.2px; }
  .filter { margin-left: auto; display: flex; align-items: center; gap: 9px; padding: 0 14px;
    height: 34px; border-radius: 17px; border: 2px solid var(--ink); font-size: 13px; font-weight: 800;
    letter-spacing: -0.2px; white-space: nowrap; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 800; color: var(--paper); background: var(--red); }

  .grid .box { outline: 1px dashed rgba(255,0,255,0.5); outline-offset: -1px; }
  .grid .box::after { content: attr(data-g); position: absolute; left: 2px; top: 1px;
                      font: 700 9px/1.2 'SF Mono', monospace; color: #d0f; background: rgba(255,255,255,0.82); padding: 1px 3px; }
