<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"
     aria-label="State diagram: SELECT, BRIGHTNESS and HUE screens with the rotary, touch and press transitions between them">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c33a"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#16202b; stroke:#5b9bd5; stroke-width:2; rx:12; }
    .name { fill:#fff; font:700 17px -apple-system,Segoe UI,sans-serif; }
    .note { fill:#8fa8bd; font:12px -apple-system,Segoe UI,sans-serif; }
    .edge { stroke:#8aa; stroke-width:2; fill:none; marker-end:url(#a); }
    .edgey{ stroke:#e8c33a; stroke-width:2; fill:none; marker-end:url(#ay); }
    .lab  { fill:#cfe0ef; font:600 12px -apple-system,Segoe UI,sans-serif; }
    .laby { fill:#e8c33a; font:600 12px -apple-system,Segoe UI,sans-serif; }
    .self { stroke:#4a8b3b; stroke-width:2; fill:none; marker-end:url(#a); }
    .labg { fill:#7fc06a; font:600 12px -apple-system,Segoe UI,sans-serif; }
  </style>

  <rect class="box" x="30"  y="150" width="190" height="96"/>
  <text class="name" x="125" y="182" text-anchor="middle">SELECT</text>
  <text class="note" x="125" y="204" text-anchor="middle">browse groups</text>
  <text class="note" x="125" y="222" text-anchor="middle">11 groups, 17 lights</text>

  <rect class="box" x="285" y="150" width="190" height="96"/>
  <text class="name" x="380" y="182" text-anchor="middle">BRIGHTNESS</text>
  <text class="note" x="380" y="204" text-anchor="middle">dim the selection</text>
  <text class="note" x="380" y="222" text-anchor="middle">dps 22, 10-1000</text>

  <rect class="box" x="540" y="150" width="190" height="96"/>
  <text class="name" x="635" y="182" text-anchor="middle">HUE</text>
  <text class="note" x="635" y="204" text-anchor="middle">colour groups only</text>
  <text class="note" x="635" y="222" text-anchor="middle">dps 24, HSV hex</text>

  <path class="edge" d="M220 178 H285"/>
  <text class="lab" x="252" y="170" text-anchor="middle">press</text>
  <path class="edge" d="M285 222 H220"/>
  <text class="lab" x="252" y="240" text-anchor="middle">press</text>

  <path class="edgey" d="M475 178 H540"/>
  <text class="laby" x="507" y="170" text-anchor="middle">long touch</text>
  <path class="edgey" d="M540 222 H475"/>
  <text class="laby" x="507" y="240" text-anchor="middle">long touch</text>

  <path class="edge" d="M635 150 C635 70 380 60 200 110 L150 150"/>
  <text class="lab" x="420" y="66" text-anchor="middle">press — straight back to SELECT</text>

  <path class="self" d="M60 150 C40 110 110 100 125 140"/>
  <text class="labg" x="96" y="104" text-anchor="middle">rotate: next group</text>
  <path class="self" d="M315 150 C295 110 365 100 380 140"/>
  <text class="labg" x="351" y="104" text-anchor="middle">rotate: brightness</text>
  <path class="self" d="M570 246 C550 300 620 310 635 258"/>
  <text class="labg" x="606" y="330" text-anchor="middle">rotate: hue</text>
  <path class="self" d="M330 246 C310 300 380 310 395 258"/>
  <text class="labg" x="366" y="330" text-anchor="middle">touch: toggle on/off</text>

  <text class="note" x="380" y="382" text-anchor="middle">Long touch is offered only when the group reports dps 24. A dimmable or switch-only group ignores it.</text>
  <text class="note" x="380" y="402" text-anchor="middle">Entering BRIGHTNESS reads the first member's live state, so the knob starts from what the light is actually doing.</text>
</svg>
