<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img"
     aria-label="State machine: LIGHTS, BRIGHTNESS and COLOR. Tap enters from LIGHTS and returns from either control screen. Swipe browses the list in LIGHTS and cycles between BRIGHTNESS and COLOR. Rotate adjusts within each state and the knob press toggles power.">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ab"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c33a"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fc06a"/></marker>
  </defs>
  <style>
    .box{fill:#16202b;stroke:#5b9bd5;stroke-width:2;rx:12}
    .nm{fill:#fff;font:700 18px -apple-system,Segoe UI,sans-serif}
    .nt{fill:#8fa8bd;font:12px -apple-system,Segoe UI,sans-serif}
    .tap{stroke:#9ab;stroke-width:2;fill:none;marker-end:url(#g)}
    .swp{stroke:#e8c33a;stroke-width:2;fill:none;marker-end:url(#y)}
    .slf{stroke:#7fc06a;stroke-width:2;fill:none;marker-end:url(#v)}
    .lt{fill:#cfe0ef;font:600 12px -apple-system,Segoe UI,sans-serif}
    .ly{fill:#e8c33a;font:600 12px -apple-system,Segoe UI,sans-serif}
    .lv{fill:#7fc06a;font:600 12px -apple-system,Segoe UI,sans-serif}
    .key{fill:#8fa8bd;font:12px -apple-system,Segoe UI,sans-serif}
  </style>

  <rect class="box" x="26"  y="168" width="196" height="104"/>
  <text class="nm" x="124" y="202" text-anchor="middle">LIGHTS</text>
  <text class="nt" x="124" y="226" text-anchor="middle">11 groups, 17 lights</text>
  <text class="nt" x="124" y="246" text-anchor="middle">grouped by name suffix</text>

  <rect class="box" x="292" y="168" width="196" height="104"/>
  <text class="nm" x="390" y="202" text-anchor="middle">BRIGHTNESS</text>
  <text class="nt" x="390" y="226" text-anchor="middle">dp 22, perceptual L*</text>
  <text class="nt" x="390" y="246" text-anchor="middle">every group</text>

  <rect class="box" x="558" y="168" width="196" height="104"/>
  <text class="nm" x="656" y="202" text-anchor="middle">COLOR</text>
  <text class="nt" x="656" y="226" text-anchor="middle">dp 24, named hues</text>
  <text class="nt" x="656" y="246" text-anchor="middle">colour groups only</text>

  <path class="tap" d="M222 196 H292"/>
  <text class="lt" x="257" y="188" text-anchor="middle">tap</text>
  <path class="tap" d="M292 248 H222"/>
  <text class="lt" x="257" y="266" text-anchor="middle">tap</text>

  <path class="swp" d="M488 196 H558"/>
  <text class="ly" x="523" y="188" text-anchor="middle">swipe</text>
  <path class="swp" d="M558 248 H488"/>
  <text class="ly" x="523" y="266" text-anchor="middle">swipe</text>

  <path class="tap" d="M656 168 C656 86 400 74 210 128 L150 168"/>
  <text class="lt" x="430" y="82" text-anchor="middle">tap — straight back to LIGHTS</text>

  <path class="slf" d="M58 168 C36 122 112 112 124 158"/>
  <text class="lv" x="92" y="112" text-anchor="middle">rotate or swipe: next group</text>
  <path class="slf" d="M324 168 C302 122 378 112 390 158"/>
  <text class="lv" x="358" y="112" text-anchor="middle">rotate: dim</text>
  <path class="slf" d="M590 168 C568 122 644 112 656 158"/>
  <text class="lv" x="624" y="112" text-anchor="middle">rotate: colour</text>

  <path class="slf" d="M340 272 C318 322 394 332 406 286"/>
  <text class="lv" x="372" y="352" text-anchor="middle">press: on / off</text>
  <path class="slf" d="M606 272 C584 322 660 332 672 286"/>
  <text class="lv" x="638" y="352" text-anchor="middle">press: on / off</text>

  <text class="key" x="390" y="404" text-anchor="middle">Tap moves in and out. Swipe moves sideways — along the list, or between the two things the knob can adjust.</text>
  <text class="key" x="390" y="426" text-anchor="middle">The knob press always means power, on every screen. A swipe on a white-only group has nowhere to go and is ignored.</text>
  <text class="key" x="390" y="448" text-anchor="middle">Entering BRIGHTNESS reads the group's live state, so the knob starts from what the light is actually doing.</text>
</svg>
