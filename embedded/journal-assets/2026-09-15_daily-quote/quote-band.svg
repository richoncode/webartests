<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 352" width="840" height="352" role="img"><rect width="840" height="352" fill="#0d0d0d"/><text x="420.0" y="30" fill="#fff" font-size="15" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">the band when no launch is worth standing outside for</text><rect x="20" y="56" width="800" height="56" fill="#f2f2ee"/><rect x="20" y="56" width="6" height="56" fill="#2f6fd0"/><text x="50" y="82" fill="#111" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8220;What stands in the way becomes the way.&#8221;</text><text x="798" y="102" fill="#555" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8212; Marcus Aurelius</text><text x="822" y="74" fill="#8a8a8a" font-size="10" text-anchor="end" font-family="monospace">F_BODY 483px</text><rect x="20" y="140" width="800" height="56" fill="#f2f2ee"/><rect x="20" y="140" width="6" height="56" fill="#2f6fd0"/><text x="50" y="166" fill="#111" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8220;Power concedes nothing without a demand. It never did.&#8221;</text><text x="798" y="186" fill="#555" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8212; Frederick Douglass</text><text x="822" y="158" fill="#8a8a8a" font-size="10" text-anchor="end" font-family="monospace">F_BODY 653px</text><rect x="20" y="224" width="800" height="56" fill="#f2f2ee"/><rect x="20" y="224" width="6" height="56" fill="#2f6fd0"/><text x="50" y="250" fill="#111" font-size="13" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8220;One must still have chaos in oneself to give birth to a dancing star.&#8221;</text><text x="798" y="270" fill="#555" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="600">&#8212; Friedrich Nietzsche</text><text x="822" y="242" fill="#8a8a8a" font-size="10" text-anchor="end" font-family="monospace">F_TINY 773px</text><text x="420.0" y="336" fill="#8a8a8a" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">widths measured from FreeSansBold, the same metrics the panel uses</text></svg>
