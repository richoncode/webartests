"400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">VBAT</text><path d="M 400 232 L 418 232 L 418 112 L 450 112" fill="none" stroke="#9aa0a6" stroke-width="2"/><text x="406" y="272" fill="#9aa0a6" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">GND</text><path d="M 620 92 L 690 92" fill="none" stroke="#e74c3c" stroke-width="2"/><text x="655" y="84" fill="#e74c3c" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">5 V</text><path d="M 620 112 L 690 112" fill="none" stroke="#9aa0a6" stroke-width="2"/><text x="655" y="128" fill="#9aa0a6" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">GND</text><text x="655" y="70" fill="#5b9bd5" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">J37</text><rect x="700" y="96" width="160" height="58" rx="6" fill="#141414" stroke="#2a2a2a"/><text x="780" y="114" fill="#8a8a8a" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">J37  1.25-4P</text><text x="780" y="130" fill="#fff" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">1 VUSB_IN   4 GND</text><text x="780" y="146" fill="#8a8a8a" font-size="10" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">2/3 USB data — leave open</text><rect x="450" y="300" width="170" height="62" rx="8" fill="#1a1a1a" stroke="#f0a040" stroke-width="1.6"/><text x="535.0" y="328.0" fill="#fff" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="middle">MAX17048</text><text x="535.0" y="346.0" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="middle">state of charge, I²C</text><path d="M 400 230 L 420 230 L 420 331 L 450 331" fill="none" stroke="#e74c3c" stroke-width="2"/><text x="398" y="300" fill="#e74c3c" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">VBAT</text><path d="M 620 316 L 660 316 L 660 205 L 690 205" fill="none" stroke="#f0a040" stroke-width="2" stroke-dasharray="5 4"/><text x="648" y="186" fill="#f0a040" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">SDA / SCL</text><rect x="700" y="176" width="160" height="58" rx="6" fill="#141414" stroke="#2a2a2a"/><text x="780" y="194" fill="#8a8a8a" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">J36  1.25-4P</text><text x="780" y="210" fill="#fff" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">1 SCL GPIO39</text><text x="780" y="226" fill="#fff" font-size="11" font-weight="400" font-family="'SF Mono', 'Fira Code', ui-monospace, monospace" text-anchor="middle">2 SDA GPIO38   4 GND</text><text x="30" y="300" fill="#e74c3c" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">Charge with the device asleep.</text><text x="30" y="320" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">A TP4056 does not share the load: with the boost</text><text x="30" y="336" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">drawing from the cell while the charger is running,</text><text x="30" y="352" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">termination never settles and the cell sits at full</text><text x="30" y="368" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">voltage. Either charge it switched off, or use a</text><text x="30" y="384" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="start">load-sharing part — MCP73871 or IP5306 — instead.</text><text x="450.0" y="456" fill="#8a8a8a" font-size="11" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" text-anchor="middle">connector pinouts read from Elecrow's schematic, not inferred</text></svg>
