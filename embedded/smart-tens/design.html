<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart TENS — Design</title>
<style>body{background:#0d0d0d;color:#888;font-family:system-ui,sans-serif;padding:48px;}</style>
</head>
<body>
<p id="status">Loading design…</p>
<script>
(async () => {
  const n = 5;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('./parts/p' + i + '.txt');
    if (!r.ok) throw new Error('missing part ' + i);
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch((e) => {
  document.getElementById('status').textContent = 'Failed to load design: ' + e.message;
});
</script>
</body>
</html>
