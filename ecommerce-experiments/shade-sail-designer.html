<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Shade Sail Designer — webartests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .animate-spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input[type="range"] { accent-color: #3b82f6; }
        .dark { color-scheme: dark; }
        #back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
            transition: color 0.15s;
        }
        #back-link:hover { color: #fff; }
        .light #back-link { color: #555; }
        .light #back-link:hover { color: #000; }
    </style>
</head>
<body class="transition-colors duration-200 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, className = '', size = 24, strokeWidth = 2 }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide) lucide.createIcons();
            }, [name]);

            return (
                <span className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}>
                    <i data-lucide={name} style={{ width: size, height: size, strokeWidth }}></i>
                </span>
            );
        };

        const INVENTORY = [
            { id: 'eq-8', type: 'Equilateral', label: "8' Equilateral", sides: [8, 8, 8] },
            { id: 'eq-10', type: 'Equilateral', label: "10' Equilateral", sides: [10, 10, 10] },
            { id: 'eq-12', type: 'Equilateral', label: "12' Equilateral", sides: [12, 12, 12] },
            { id: 'eq-13', type: 'Equilateral', label: "13' Equilateral", sides: [13, 13, 13] },
            { id: 'eq-15', type: 'Equilateral', label: "15' Equilateral", sides: [15, 15, 15] },
            { id: 'eq-16', type: 'Equilateral', label: "16' Equilateral", sides: [16, 16, 16] },
            { id: 'eq-18', type: 'Equilateral', label: "18' Equilateral", sides: [18, 18, 18] },
            { id: 'eq-20', type: 'Equilateral', label: "20' Equilateral", sides: [20, 20, 20] },
            { id: 'eq-24', type: 'Equilateral', label: "24' Equilateral", sides: [24, 24, 24] },
            { id: 'ra-10', type: 'Right-Angled', label: "10' × 10' × 14.1' Right-Angled", sides: [10, 10, 14.1] },
            { id: 'ra-12', type: 'Right-Angled', label: "12' × 12' × 17' Right-Angled", sides: [12, 12, 17] },
            { id: 'ra-13', type: 'Right-Angled', label: "13' × 13' × 18' Right-Angled", sides: [13, 13, 18] },
            { id: 'ra-14', type: 'Right-Angled', label: "14' × 14' × 19.8' Right-Angled", sides: [14, 14, 19.8] },
            { id: 'ra-15', type: 'Right-Angled', label: "15' × 15' × 21.2' Right-Angled", sides: [15, 15, 21.2] },
            { id: 'ra-16', type: 'Right-Angled', label: "16' × 16' × 22.6' Right-Angled", sides: [16, 16, 22.6] },
            { id: 'ra-18', type: 'Right-Angled', label: "18' × 18' × 25.5' Right-Angled", sides: [18, 18, 25.5] },
            { id: 'ra-20', type: 'Right-Angled', label: "20' × 20' × 28.3' Right-Angled", sides: [20, 20, 28.3] },
            { id: 'iso-13', type: 'Isosceles', label: "13' × 10' × 10' Isosceles", sides: [13, 10, 10] },
            { id: 'iso-16', type: 'Isosceles', label: "16' × 13' × 13' Isosceles", sides: [16, 13, 13] },
            { id: 'iso-20', type: 'Isosceles', label: "20' × 16' × 16' Isosceles", sides: [20, 16, 16] }
        ];

        const COLORS = {
            'Sand Beige': { hex: '#E6D5B8', border: '#C8B598', rgb: [230, 213, 184], text: 'text-amber-800', bg: 'bg-[#E6D5B8]' },
            'Slate Gray': { hex: '#708090', border: '#576673', rgb: [112, 128, 144], text: 'text-slate-800', bg: 'bg-[#708090]' },
            'Autumn Terracotta': { hex: '#C25A3F', border: '#9E442D', rgb: [194, 90, 63], text: 'text-orange-950', bg: 'bg-[#C25A3F]' },
            'Bahama Ocean Blue': { hex: '#0096C7', border: '#007AA3', rgb: [0, 150, 199], text: 'text-sky-950', bg: 'bg-[#0096C7]' },
            'Cream White': { hex: '#FFFDD0', border: '#E0DEB3', rgb: [255, 253, 208], text: 'text-yellow-950', bg: 'bg-[#FFFDD0]' }
        };

        const TEMPLATES = [
            { id: 'cozy', name: 'Cozy 12\' Patio', desc: 'Small decks & areas.', postAB: 16.5, postBC: 16.5, postCA: 16.5, recSail: 'eq-12' },
            { id: 'medium', name: 'Medium 16\' Asymmetric', desc: 'Custom landscapes.', postAB: 19.5, postBC: 17.0, postCA: 21.5, recSail: 'ra-13' },
            { id: 'large', name: 'Large 20\' Corner Space', desc: 'Max commercial coverage.', postAB: 24.0, postBC: 22.0, postCA: 25.0, recSail: 'eq-18' }
        ];

        // --- STABLE SHARED COMPONENTS ---
        
        const SmartInput = ({ label, value, onChange, min, max, step = 0.1, subLabel }) => {
            const [active, setActive] = useState(false);
            const [localValue, setLocalValue] = useState(value.toFixed(1));
            const containerRef = useRef(null);
            
            useEffect(() => { if (!active) setLocalValue(value.toFixed(1)); }, [value, active]);

            const handleInputChange = (e) => {
                const val = e.target.value; setLocalValue(val);
                const parsed = parseFloat(val); if (!isNaN(parsed) && parsed >= min && parsed <= max) onChange(parsed);
            };

            const handleKeyDown = (e) => { if (e.key === 'Enter') e.target.blur(); };

            return (
                <div 
                    className="space-y-1 relative" 
                    ref={containerRef}
                    onFocus={() => setActive(true)} 
                    onBlur={(e) => {
                        if (e.relatedTarget && containerRef.current.contains(e.relatedTarget)) return;
                        setActive(false); setLocalValue(value.toFixed(1));
                    }}
                >
                    <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        <span>{label}</span>
                        {subLabel && <span className="text-sky-500 font-mono">{subLabel}</span>}
                    </div>
                    <input 
                        type="number" step={step} value={localValue} 
                        onChange={handleInputChange}
                        onKeyDown={handleKeyDown}
                        className="w-full bg-slate-100 dark:bg-[#252525] border border-slate-200 dark:border-[#333] rounded-lg px-3 py-1.5 text-sm font-bold focus:border-sky-500 outline-none"
                    />
                    {active && (
                        <div 
                            className="absolute left-0 right-0 top-full mt-2 p-3 bg-white dark:bg-[#1a1a1a] border dark:border-[#333] rounded-xl shadow-xl z-50 animate-slide-up"
                            onPointerDown={e => e.preventDefault()}
                            tabIndex="-1"
                        >
                            <input 
                                type="range" min={min} max={max} step={step} value={value} 
                                tabIndex="-1"
                                onChange={e => {
                                    const v = parseFloat(e.target.value);
                                    onChange(v); setLocalValue(v.toFixed(1));
                                }}
                                className="w-full cursor-pointer h-4" 
                                style={{ accentColor: '#3b82f6' }} 
                            />
                            <div className="flex justify-between text-[10px] mt-1 text-slate-400 font-mono">
                                <span>{min}'</span><span>{value.toFixed(1)}'</span><span>{max}'</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [darkMode, setDarkMode] = useState(true);
            const [showSaved, setShowSaved] = useState(false);
            const [showSiteConfig, setShowSiteConfig] = useState(false);
            const [selectedColor, setSelectedColor] = useState('Bahama Ocean Blue');
            
            // --- PERSISTENT SAVED DESIGNS ---
            const [savedSails, setSavedSails] = useState(() => {
                const local = localStorage.getItem('shade-sail-designs');
                return local ? JSON.parse(local) : [
                    { id: 'initial', name: 'Patio Project', sides: { AB: 13.5, BC: 15.0, CA: 15.0 }, heights: [5, 5, 0], latitude: 37.3, selectedSailId: 'eq-12', compassAngle: 305 * Math.PI / 180 }
                ];
            });
            const [activeId, setActiveId] = useState(savedSails[0].id);

            const activeIndex = useMemo(() => {
                const idx = savedSails.findIndex(s => s.id === activeId);
                return idx !== -1 ? idx : 0;
            }, [savedSails, activeId]);

            const activeDesign = savedSails[activeIndex];

            const updateActiveDesign = (updates) => {
                setSavedSails(prev => prev.map(s => s.id === activeId ? { ...s, ...updates } : s));
            };

            const setSides = (newSidesOrFn) => {
                const nextSides = typeof newSidesOrFn === 'function' ? newSidesOrFn(activeDesign.sides) : newSidesOrFn;
                updateActiveDesign({ sides: nextSides });
            };

            const setHeights = (newHeightsOrFn) => {
                const nextHeights = typeof newHeightsOrFn === 'function' ? newHeightsOrFn(activeDesign.heights) : newHeightsOrFn;
                updateActiveDesign({ heights: nextHeights });
            };

            const setLatitude = (lat) => updateActiveDesign({ latitude: lat });
            const setCompassAngle = (ang) => updateActiveDesign({ compassAngle: ang });
            const setSelectedSailId = (id) => updateActiveDesign({ selectedSailId: id });

            const handleNewDesign = () => {
                const newId = 'design-' + Date.now();
                const newDesign = { id: newId, name: 'Untitled Layout', sides: { AB: 15, BC: 15, CA: 15 }, heights: [0, 0, 0], latitude: activeDesign.latitude, selectedSailId: 'eq-12', compassAngle: activeDesign.compassAngle };
                setSavedSails(prev => [...prev, newDesign]);
                setActiveId(newId); setShowSaved(true);
            };

            const handleDuplicate = (e, design) => {
                e.stopPropagation();
                const newId = 'design-' + Date.now();
                const dupe = { ...design, id: newId, name: `${design.name} (Copy)` };
                setSavedSails(prev => [...prev, dupe]);
                setActiveId(newId);
            };

            const handleRename = (id, newName) => {
                setSavedSails(prev => prev.map(s => s.id === id ? { ...s, name: newName } : s));
            };

            const handleDelete = (e, id) => {
                e.stopPropagation(); if (savedSails.length <= 1) return;
                const nextSails = savedSails.filter(s => s.id !== id);
                setSavedSails(nextSails);
                if (activeId === id) setActiveId(nextSails[0].id);
            };

            useEffect(() => { localStorage.setItem('shade-sail-designs', JSON.stringify(savedSails)); }, [savedSails]);

            const triggerToast = (msg) => { setToastMessage(msg); setShowToast(true); setTimeout(() => setShowToast(false), 3000); };

            const detectLocation = (e) => {
                if (e) e.stopPropagation();
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { setLatitude(parseFloat(pos.coords.latitude.toFixed(1))); triggerToast('📍 Location detected!'); },
                        () => triggerToast('❌ Unable to detect location')
                    );
                }
            };

            const { sides, heights, latitude, selectedSailId, compassAngle } = activeDesign;
            const { AB: postAB, BC: postBC, CA: postCA } = sides;
            
            const [sunHour, setSunHour] = useState(13);
            const [clearanceCheck, setClearanceCheck] = useState(false);
            const [tensionSpace, setTensionSpace] = useState(1.5);
            const [turnbuckleSpace, setTurnbuckleSpace] = useState(1.2);
            const [fitsOnly, setFitsOnly] = useState(true);
            const [showToast, setShowToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            const canvasRef = useRef(null);
            const draggingCornerIdx = useRef(null);
            const viewportRef = useRef({ scale: 1, offsetX: 0, offsetY: 0, cPosts: [] });
            
            useEffect(() => {
                document.documentElement.className = darkMode ? 'dark' : 'light';
                document.body.className = darkMode ? 'bg-[#0d0d0d] text-[#eee]' : 'bg-[#F8FAFC] text-slate-800';
            }, [darkMode]);

            const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
            useEffect(() => {
                const canvas = canvasRef.current; if (!canvas) return;
                const observer = new ResizeObserver(entries => {
                    if (entries[0]) {
                        const { width, height } = entries[0].contentRect;
                        if (width > 0 && height > 0) setCanvasSize({ width, height });
                    }
                });
                observer.observe(canvas); return () => observer.disconnect();
            }, []);

            const isTriangleValid = (a, b, c) => (a + b > c) && (b + c > a) && (c + a > b);
            const isCurrentLayoutValid = isTriangleValid(postAB, postBC, postCA);

            const posts = useMemo(() => {
                const a = postAB, b = postBC, c = postCA;
                if (!isTriangleValid(a, b, c)) return [{x:0,y:0}, {x:a,y:0}, {x:a/2, y:a}];
                const cosA = (a*a + c*c - b*b) / (2*a*c);
                const sinA = Math.sqrt(Math.max(0, 1 - cosA*cosA));
                return [{ x: 0, y: 0 }, { x: a, y: 0 }, { x: c * cosA, y: c * sinA }];
            }, [sides]);

            const trueAB = useMemo(() => Math.sqrt(postAB**2 + Math.pow(heights[1]-heights[0], 2)), [postAB, heights]);
            const trueBC = useMemo(() => Math.sqrt(postBC**2 + Math.pow(heights[2]-heights[1], 2)), [postBC, heights]);
            const trueCA = useMemo(() => Math.sqrt(postCA**2 + Math.pow(heights[0]-heights[2], 2)), [postCA, heights]);

            const getAlignedSailCoordinates = (postCoords, sailSides) => {
                const a = sailSides[0], b = sailSides[1], c = sailSides[2];
                const cosA = (a*a + c*c - b*b) / (2*a*c);
                const sinA = Math.sqrt(Math.max(0, 1 - cosA*cosA));
                const rawSail = [{x:0,y:0}, {x:a,y:0}, {x:c*cosA,y:c*sinA}];
                const cp = { x: (postCoords[0].x+postCoords[1].x+postCoords[2].x)/3, y: (postCoords[0].y+postCoords[1].y+postCoords[2].y)/3 };
                const cs = { x: (rawSail[0].x+rawSail[1].x+rawSail[2].x)/3, y: (rawSail[0].y+rawSail[1].y+rawSail[2].y)/3 };
                const pZ = postCoords.map(p => ({x:p.x-cp.x, y:p.y-cp.y})), sZ = rawSail.map(s => ({x:s.x-cs.x, y:s.y-cs.y}));
                let n=0, d=0;
                for(let i=0;i<3;i++) { n += (sZ[i].x*pZ[i].y - sZ[i].y*pZ[i].x); d += (sZ[i].x*pZ[i].x + sZ[i].y*pZ[i].y); }
                const t = Math.atan2(n, d);
                return sZ.map(s => ({ x: (s.x*Math.cos(t) - s.y*Math.sin(t)) + cp.x, y: (s.x*Math.sin(t) + s.y*Math.cos(t)) + cp.y }));
            };

            const metrics = useMemo(() => {
                if (!isCurrentLayoutValid) return null;
                const sail = INVENTORY.find(s => s.id === selectedSailId);
                if (!sail) return null;
                const alignedSail = getAlignedSailCoordinates(posts, sail.sides);
                if (!alignedSail) return null;
                const gaps = [], edgeTensions = [], pullDeviations = [];
                const reqSpace = clearanceCheck ? (tensionSpace + turnbuckleSpace) : 0.5;
                for (let i = 0; i < 3; i++) {
                    const p = posts[i], s = alignedSail[i];
                    gaps.push(Math.sqrt((p.x-s.x)**2 + (p.y-s.y)**2));
                    const prev = (i+2)%3, next = (i+1)%3;
                    const v1 = { x: alignedSail[prev].x-s.x, y: alignedSail[prev].y-s.y };
                    const v2 = { x: alignedSail[next].x-s.x, y: alignedSail[next].y-s.y };
                    const m1 = Math.sqrt(v1.x**2+v1.y**2)||1, m2 = Math.sqrt(v2.x**2+v2.y**2)||1;
                    const bisectIn = { x: v1.x/m1 + v2.x/m2, y: v1.y/m1 + v2.y/m2 };
                    const mB = Math.sqrt(bisectIn.x**2+bisectIn.y**2)||1;
                    const uBisectOut = { x: -bisectIn.x/mB, y: -bisectIn.y/mB };
                    const chainVec = { x: p.x-s.x, y: p.y-s.y };
                    const mC = Math.sqrt(chainVec.x**2+chainVec.y**2)||1;
                    const dot = uBisectOut.x*(chainVec.x/mC) + uBisectOut.y*(chainVec.y/mC);
                    pullDeviations.push(Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI);
                }
                [[0,1],[1,2],[2,0]].forEach(([i,j]) => {
                    const fI = gaps[i]<reqSpace ? Math.max(15,(gaps[i]/reqSpace)*100) : Math.min(100,100-(gaps[i]-reqSpace)*2);
                    const fJ = gaps[j]<reqSpace ? Math.max(15,(gaps[j]/reqSpace)*100) : Math.min(100,100-(gaps[j]-reqSpace)*2);
                    edgeTensions.push(Math.round((fI+fJ)/2));
                });
                return { alignedSail, gaps, edgeTensions, pullDeviations };
            }, [posts, selectedSailId, clearanceCheck, tensionSpace, turnbuckleSpace, isCurrentLayoutValid]);

            const handleInteraction = (clientX, clientY) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = clientX - rect.left, y = clientY - rect.top;
                const cx = canvasSize.width - 55, cy = 55;
                if (Math.sqrt((x-cx)**2+(y-cy)**2) <= 45) {
                    const move = (e) => {
                        const r = canvasRef.current.getBoundingClientRect();
                        const cX = e.clientX || (e.touches && e.touches[0].clientX);
                        const cY = e.clientY || (e.touches && e.touches[0].clientY);
                        setCompassAngle(Math.atan2(cY - r.top - cy, cX - r.left - cx) + Math.PI/2);
                    };
                    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up); };
                    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
                    window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
                    return;
                }
                const v = viewportRef.current;
                for (let i = 0; i < 3; i++) {
                    if (v.cPosts[i] && Math.sqrt((x-v.cPosts[i].x)**2 + (y-v.cPosts[i].y)**2) < 25) {
                        draggingCornerIdx.current = i;
                        const move = (e) => {
                            if (draggingCornerIdx.current === null) return;
                            const r = canvasRef.current.getBoundingClientRect();
                            const cX = e.clientX || (e.touches && e.touches[0].clientX);
                            const cY = e.clientY || (e.touches && e.touches[0].clientY);
                            const nx = (cX - r.left - v.offsetX)/v.scale, ny = (cY - r.top - v.offsetY)/v.scale;
                            setSides(prev => {
                                const p = posts; const next = { ...prev };
                                if (draggingCornerIdx.current === 0) { next.AB = Math.sqrt((nx-p[1].x)**2+(ny-p[1].y)**2); next.CA = Math.sqrt((nx-p[2].x)**2+(ny-p[2].y)**2); }
                                else if (draggingCornerIdx.current === 1) { next.AB = Math.sqrt((nx-p[0].x)**2+(ny-p[0].y)**2); next.BC = Math.sqrt((nx-p[2].x)**2+(ny-p[2].y)**2); }
                                else if (draggingCornerIdx.current === 2) { next.BC = Math.sqrt((nx-p[1].x)**2+(ny-p[1].y)**2); next.CA = Math.sqrt((nx-p[0].x)**2+(ny-p[0].y)**2); }
                                return next;
                            });
                        };
                        const up = () => { draggingCornerIdx.current = null; window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up); };
                        window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
                        window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
                        return;
                    }
                }
            };

            const sortedInventory = useMemo(() => {
                if (!isCurrentLayoutValid) return INVENTORY;
                return [...INVENTORY].map(sail => {
                    const aligned = getAlignedSailCoordinates(posts, sail.sides);
                    let fits = true, totalGap = 0;
                    const reqSpace = clearanceCheck ? (tensionSpace + turnbuckleSpace) : 0.5;
                    for (let i = 0; i < 3; i++) {
                        const dist = Math.sqrt((posts[i].x - aligned[i].x)**2 + (posts[i].y - aligned[i].y)**2);
                        if (dist < reqSpace) fits = false; totalGap += dist;
                    }
                    return { ...sail, fits, totalGap };
                }).sort((a, b) => { if (a.fits !== b.fits) return a.fits ? -1 : 1; return a.totalGap - b.totalGap; });
            }, [posts, selectedSailId, clearanceCheck, tensionSpace, turnbuckleSpace, isCurrentLayoutValid]);

            const filteredInventory = fitsOnly ? sortedInventory.filter(sail => sail.fits) : sortedInventory;

            useEffect(() => {
                const canvas = canvasRef.current; if (!canvas || canvasSize.width === 0) return;
                const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
                canvas.width = canvasSize.width * dpr; canvas.height = canvasSize.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const width = canvasSize.width, height = canvasSize.height;
                const theme = { bg: '#5c647a', grid: '#6a728a', postSpan: '#f87171', sailEdge: '#fbbf24', chain: '#38bdf8', post: '#fbbf24' };

                const drawSimpleLabel = (text, x, y, color, size = 9, align = 'center') => {
                    ctx.save(); ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
                    ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 3; ctx.fillStyle = color;
                    ctx.fillText(text, x, y); ctx.restore();
                };

                ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, width, height);
                ctx.strokeStyle = theme.grid; ctx.lineWidth = 1;
                for (let x = 0; x <= width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
                for (let y = 0; y <= height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }

                const minX = Math.min(...posts.map(p => p.x)), maxX = Math.max(...posts.map(p => p.x));
                const minY = Math.min(...posts.map(p => p.y)), maxY = Math.max(...posts.map(p => p.y));
                const scale = 0.65 * Math.min(width / (maxX - minX || 1), height / (maxY - minY || 1));
                const offsetX = width/2 - ((minX + maxX)/2)*scale, offsetY = height/2 - ((minY+maxY)/2)*scale;
                const toCanvas = (p) => ({ x: p.x*scale + offsetX, y: p.y*scale + offsetY });
                const cPosts = posts.map(toCanvas);
                viewportRef.current = { scale, offsetX, offsetY, cPosts };

                if (!isCurrentLayoutValid || !metrics) {
                    cPosts.forEach((post, idx) => {
                        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(post.x, post.y, 8, 0, 2*Math.PI); ctx.fill();
                        drawSimpleLabel(`Post ${String.fromCharCode(65 + idx)}`, post.x, post.y - 12, '#fff', 10);
                    });
                    return;
                }
                const { alignedSail, gaps, edgeTensions } = metrics;
                const cSail = alignedSail.map(toCanvas), scX = (cSail[0].x+cSail[1].x+cSail[2].x)/3, scY = (cSail[0].y+cSail[1].y+cSail[2].y)/3;

                const drawRotatedLabel = (text, p1, p2, color, size = 8, baseOffset = 16, outward = true) => {
                    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
                    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    let nx = -(p2.y - p1.y), ny = p2.x - p1.x;
                    const len = Math.sqrt(nx*nx + ny*ny) || 1; nx /= len; ny /= len;
                    const dx = scX - mx, dy = scY - my; const dot = dx*nx + dy*ny;
                    const dir = outward ? (dot > 0 ? -1 : 1) : (dot > 0 ? 1 : -1);
                    const finalX = mx + nx * dir * baseOffset, finalY = my + ny * dir * baseOffset;
                    ctx.save(); ctx.translate(finalX, finalY); ctx.rotate(angle + (Math.abs(angle) > Math.PI/2 ? Math.PI : 0));
                    ctx.font = `bold ${size}px monospace`; ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 3; ctx.fillStyle = color;
                    ctx.fillText(text, 0, 4); ctx.restore();
                };

                const hRad = (sunHour - 12) * 15 * (Math.PI / 180);
                const shadowAngle = hRad + compassAngle;
                const sdx = Math.sin(shadowAngle) * 50, sdy = -Math.cos(shadowAngle) * 50;
                ctx.save(); ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.fillStyle = 'rgba(0,0,0,0.3)'; 
                ctx.beginPath(); ctx.moveTo(cSail[0].x + sdx, cSail[0].y + sdy);
                for(let i=0;i<3;i++) {
                    const n = (i+1)%3, cpX = (cSail[i].x+cSail[n].x)/2+sdx, cpY = (cSail[i].y+cSail[n].y)/2+sdy;
                    ctx.quadraticCurveTo(cpX+(scX+sdx-cpX)*0.15, cpY+(scY+sdy-cpY)*0.15, cSail[n].x+sdx, cSail[n].y+sdy);
                }
                ctx.fill(); ctx.restore();

                ctx.strokeStyle = 'rgba(248, 113, 113, 0.2)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(cPosts[0].x, cPosts[0].y); ctx.lineTo(cPosts[1].x, cPosts[1].y); ctx.lineTo(cPosts[2].x, cPosts[2].y); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
                
                [[postAB, trueAB, 0, 1], [postBC, trueBC, 1, 2], [postCA, trueCA, 2, 0]].forEach(([floor, trueL, i, j]) => {
                    const text = Math.abs(trueL - floor) > 0.1 ? `${trueL.toFixed(1)}' (${floor.toFixed(1)}' Floor)` : `${floor.toFixed(1)} ft`;
                    drawRotatedLabel(text, cPosts[i], cPosts[j], theme.postSpan, 9, 20, true);
                });

                const colorObj = COLORS[selectedColor] || COLORS['Bahama Ocean Blue'];
                ctx.fillStyle = `rgba(${colorObj.rgb[0]}, ${colorObj.rgb[1]}, ${colorObj.rgb[2]}, 0.85)`;
                ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cSail[0].x, cSail[0].y);
                for(let i=0;i<3;i++) {
                    const n = (i+1)%3, midX = (cSail[i].x+cSail[n].x)/2, midY = (cSail[i].y+cSail[n].y)/2;
                    ctx.quadraticCurveTo(midX+(scX-midX)*(edgeTensions[i]<65?0.16:0.08), midY+(scY-midY)*(edgeTensions[i]<65?0.16:0.08), cSail[n].x, cSail[n].y);
                }
                ctx.fill(); ctx.stroke();
                const sail = INVENTORY.find(s => s.id === selectedSailId);
                if (sail) {
                    drawRotatedLabel(`${sail.sides[0].toFixed(1)} ft`, cSail[0], cSail[1], theme.sailEdge, 8, 14, false);
                    drawRotatedLabel(`${sail.sides[1].toFixed(1)} ft`, cSail[1], cSail[2], theme.sailEdge, 8, 14, false);
                    drawRotatedLabel(`${sail.sides[2].toFixed(1)} ft`, cSail[2], cSail[0], theme.sailEdge, 8, 14, false);
                }

                for(let i=0;i<3;i++) { 
                    const isBadAngle = metrics.pullDeviations[i] > 45;
                    ctx.strokeStyle = isBadAngle ? '#ef4444' : 'rgba(255,255,255,0.3)'; 
                    ctx.lineWidth = isBadAngle ? 2.5 : 1.5; ctx.setLineDash(isBadAngle ? [] : [2, 2]);
                    ctx.beginPath(); ctx.moveTo(cSail[i].x, cSail[i].y); ctx.lineTo(cPosts[i].x, cPosts[i].y); ctx.stroke(); 
                    drawRotatedLabel(`${gaps[i].toFixed(1)}'`, cSail[i], cPosts[i], isBadAngle ? '#f87171' : theme.chain, 8, 8, true);
                    if (isBadAngle) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cPosts[i].x, cPosts[i].y, 12, 0, 2*Math.PI); 
                        ctx.globalAlpha = 0.2; ctx.fill(); ctx.globalAlpha = 1.0;
                    }
                }
                ctx.setLineDash([]);

                cPosts.forEach((post, idx) => {
                    ctx.save(); ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(255,255,255,0.3)';
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(post.x, post.y, 8, 0, 2*Math.PI); ctx.fill();
                    ctx.fillStyle = theme.post; ctx.beginPath(); ctx.arc(post.x, post.y, 5.5, 0, 2*Math.PI); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(post.x, post.y, 2, 0, 2*Math.PI); ctx.fill();
                    ctx.restore(); 
                    drawSimpleLabel(`Post ${String.fromCharCode(65 + idx)}`, post.x, post.y - 20, '#fff', 10);
                    drawSimpleLabel(`H: ${heights[idx].toFixed(1)}'`, post.x, post.y - 10, '#38bdf8', 8);
                });

                const cx = width - 55, cy = 55, cr = 30;
                ctx.save(); ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(30,41,59,0.85)';
                ctx.beginPath(); ctx.arc(cx, cy, cr, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
                ctx.translate(cx, cy); ctx.rotate(compassAngle);
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(0, -(cr-6)); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.fill();
                ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(0, cr-6); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.fill();
                ctx.restore(); 
                drawSimpleLabel('N', cx, cy - cr + 10, '#fff', 9);
                const deg = Math.round(((compassAngle * 180 / Math.PI) % 360 + 360) % 360);
                drawSimpleLabel(`${deg}°`, cx, cy + cr + 12, '#94a3b8', 10);

                // --- CANVAS METADATA (For PNG Export) ---
                const timeStr = sunHour > 12 ? (sunHour-12) + 'PM' : (sunHour === 12 ? '12PM' : sunHour + 'AM');
                drawSimpleLabel(`SOLAR TIME: ${timeStr}`, 15, height - 15, '#94a3b8', 9, 'left');
            }, [darkMode, activeId, savedSails, selectedColor, selectedSailId, clearanceCheck, tensionSpace, turnbuckleSpace, compassAngle, sunHour, isCurrentLayoutValid, metrics, postAB, postBC, postCA, canvasSize, latitude]);

            const handleSavePNG = () => {

                <div className={`min-h-screen ${darkMode ? 'dark' : ''}`}>

                    </header>

                    <main className="max-w-7xl mx-auto px-4 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

                                    <div className="flex items-center gap-2"><span className="w-5 h-5 bg-sky-50 dark:bg-sky-900 text-sky-600 dark:text-sky-300 rounded-full flex items-center justify-center text-[10px]">1</span><h2 className="font-bold text-slate-950 dark:text-white text-sm uppercase tracking-tight">Saved Designs</h2></div>

                                                    <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">

                                                <div className="text-[10px] text-slate-500 dark:text-slate-400">AB: {s.sides.AB.toFixed(1)}' · BC: {s.sides.BC.toFixed(1)}' · CA: {s.sides.CA.toFixed(1)}'</div>
                                            </div>

                                    </div>
                                </button>
                                {showSiteConfig && (
                                    <div className="p-5 space-y-4 animate-slide-up border-t dark:border-[#333]">
                                        <div className="flex flex-wrap gap-2">
                                            {[{ name: 'Miami', lat: 25.8 }, { name: 'San Jose', lat: 37.3 }, { name: 'New York', lat: 40.7 }, { name: 'London', lat: 51.5 }, { name: 'Sydney', lat: -33.9 }].map(city => (
                                                <button key={city.name} onClick={() => setLatitude(city.lat)} className={`px-2.5 py-1 rounded-lg border text-[10px] font-bold transition-all ${Math.abs(latitude - city.lat) < 0.5 ? 'bg-sky-500 border-sky-500 text-white' : 'border-slate-200 dark:border-[#333] text-slate-500 hover:border-sky-500'}`}>{city.name}</button>

                                        <div className="flex items-center gap-2 text-[10px] text-slate-500 italic"><Icon name="info" size={12} /><span>Latitude affects sun path and shadow depth.</span></div>

                            <section className="bg-white dark:bg-[#1a1a1a] rounded-2xl border border-slate-200 dark:border-[#2a2a2a] p-5 shadow-sm space-y-5">
                                <h2 className="font-bold text-slate-950 dark:text-white border-b dark:border-[#2a2a2a] pb-2 flex items-center gap-2 uppercase text-sm tracking-tight"><span className="w-5 h-5 bg-sky-50 dark:bg-sky-900 text-sky-600 dark:text-sky-300 rounded-full flex items-center justify-center text-[10px]">3</span>Sides & Elevations</h2>

                            <section className="bg-white dark:bg-[#1a1a1a] rounded-2xl border border-slate-200 dark:border-[#2a2a2a] p-5 shadow-sm space-y-4">
                                <h2 className="font-bold text-slate-950 dark:text-white border-b dark:border-[#2a2a2a] pb-2 flex items-center gap-2 uppercase text-sm tracking-tight"><span className="w-5 h-5 bg-sky-50 dark:bg-sky-900 text-sky-600 dark:text-sky-300 rounded-full flex items-center justify-center text-[10px]">4</span>Compatible Inventory</h2>
                                <div className="overflow-hidden rounded-xl border border-slate-100 dark:border-[#333]"><table className="min-w-full text-left text-[11px]"><thead className="bg-slate-50 dark:bg-[#252525]"><tr className="dark:text-white"><th className="px-3 py-2">Size</th><th className="px-3 py-2">Type</th><th className="px-3 py-2 text-right">Status</th></tr></thead><tbody className="divide-y dark:divide-[#333]">{filteredInventory.map(s => { return <tr key={s.id} onClick={() => s.fits && setSelectedSailId(s.id)} className={`cursor-pointer transition-colors ${selectedSailId === s.id ? 'bg-sky-50 dark:bg-sky-900/40 text-sky-900 dark:text-sky-100 font-bold' : s.fits ? 'hover:bg-slate-50 dark:hover:bg-[#333]' : 'opacity-30 pointer-events-none'}`}><td className="px-3 py-2">{s.label}</td><td className="px-3 py-2 text-slate-500 dark:text-slate-400">{s.type}</td><td className="px-3 py-2 text-right font-bold text-emerald-600">{s.fits ? 'FITS ✓' : ''}</td></tr> })}</tbody></table></div>
                            </section>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
